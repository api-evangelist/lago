openapi: 3.2.0
info:
  title: Lago API documentation Analytics API
  description: Lago API allows your application to push customer information and metrics (events) from your application to the billing application.
  version: 1.55.0
  license:
    name: AGPLv3
    url: https://github.com/getlago/lago-openapi/blob/main/LICENSE
  contact:
    email: tech@getlago.com
servers:
- url: https://api.getlago.com/api/v1
  description: US Lago cluster
- url: https://api.eu.getlago.com/api/v1
  description: EU Lago cluster
security:
- bearerAuth: []
tags:
- name: Analytics
  description: Everything about Analytics
paths:
  /analytics/gross_revenue:
    get:
      tags:
      - Analytics
      summary: List gross revenue
      description: Gross revenue is the monthly sum of the totals of `finalized` invoices and of the amounts of the fees paid in advance that are not attached to an invoice. Invoice totals include taxes, are net of coupons, and are reduced by the amounts refunded through credit notes. Self-billed invoices and invoices with a lost payment dispute are excluded.
      operationId: findAllGrossRevenues
      parameters:
      - name: currency
        in: query
        description: Currency of revenue analytics. Format must be ISO 4217.
        required: false
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/Currency'
          - example: USD
      - name: external_customer_id
        in: query
        description: The customer external unique identifier (provided by your own application). Use it to filter revenue analytics at the customer level.
        required: false
        explode: true
        schema:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
      - $ref: '#/components/parameters/billing_entity_code'
      - $ref: '#/components/parameters/months'
      responses:
        '200':
          description: Gross revenue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrossRevenues'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /analytics/invoice_collection:
    get:
      tags:
      - Analytics
      summary: List of finalized invoices
      description: 'Represents a monthly aggregation, detailing both the total count and the cumulative amount of invoices that have been marked as `finalized`. This report sorts invoices categorically based on their `payment_status`. Self-billed invoices and invoices with a lost payment dispute are excluded.

        This is a premium feature.'
      operationId: findAllInvoiceCollections
      parameters:
      - name: currency
        in: query
        description: The currency of revenue analytics. Format must be ISO 4217.
        required: false
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/Currency'
          - example: USD
      - $ref: '#/components/parameters/billing_entity_code'
      - $ref: '#/components/parameters/months'
      responses:
        '200':
          description: Finalized invoice collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceCollections'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /analytics/invoiced_usage:
    get:
      tags:
      - Analytics
      summary: List usage revenue
      description: Reports the monthly revenue generated by usage-based fees, broken down by billable metric. It only counts usage that has already been invoiced, so the usage of the current billing period is not included. Amounts exclude taxes and are net of coupons. Fees on self-billed invoices and on invoices with a lost payment dispute are left out.
      operationId: findAllInvoicedUsages
      parameters:
      - name: currency
        in: query
        description: The currency of invoiced usage analytics. Format must be ISO 4217.
        required: false
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/Currency'
          - example: USD
      - $ref: '#/components/parameters/billing_entity_code'
      - $ref: '#/components/parameters/months'
      responses:
        '200':
          description: Invoiced usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicedUsages'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /analytics/mrr:
    get:
      tags:
      - Analytics
      summary: List MRR
      description: 'Quantifies the revenue generated from `subscription` fees on a monthly basis. This figure is calculated post-application of applicable taxes and deduction of any applicable discounts. The method of calculation varies based on the subscription billing cycle:


        - Revenue from `monthly` subscription invoices is included in the MRR for the month in which the invoice is issued.

        - Revenue from `quarterly` subscription invoices is distributed evenly over three months. This distribution applies to fees paid in advance (allocated to the next remaining months depending on calendar or anniversary billing) as well as to fees paid in arrears (allocated to the preceding months depending on calendar or anniversary billing).

        - Revenue from `yearly` subscription invoices is distributed evenly over twelve months. This allocation is applicable for fees paid in advance (spread over the next remaining months depending on calendar or anniversary billing) and for fees paid in arrears (spread over the previous months depending on calendar or anniversary billing).

        - Revenue from `semiannual` subscription invoices is distributed evenly over six months. This allocation is applicable for fees paid in advance (spread over the next remaining months depending on calendar or anniversary billing) and for fees paid in arrears (spread over the previous months depending on calendar or anniversary billing).

        - Revenue from `weekly` subscription invoices, the total revenue from all invoices issued within a month is summed up. This total is then divided by the number of invoices issued during that month, and the result is multiplied by 4.33, representing the average number of weeks in a month.'
      operationId: findAllMrrs
      parameters:
      - name: currency
        in: query
        description: The currency of MRR analytics. Format must be ISO 4217.
        required: false
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/Currency'
          - example: USD
      - $ref: '#/components/parameters/billing_entity_code'
      - $ref: '#/components/parameters/months'
      responses:
        '200':
          description: MRR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mrrs'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /analytics/overdue_balance:
    get:
      tags:
      - Analytics
      summary: List overdue balance
      description: Overdue balance is the amount still due on invoices that are past their payment due date. Each entry covers one month of payment due dates and sums the invoice totals minus the amounts already paid and minus the credits applied by finalized credit notes. Self-billed invoices are excluded.
      operationId: findAllOverdueBalances
      parameters:
      - name: currency
        in: query
        description: Filter the overdue balances by the currency of the invoices. Format must be ISO 4217.
        required: false
        explode: true
        schema:
          allOf:
          - $ref: '#/components/schemas/Currency'
          - example: USD
      - name: external_customer_id
        in: query
        description: The customer external unique identifier (provided by your own application). Use it to restrict the overdue balances to a single customer.
        required: false
        explode: true
        schema:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
      - $ref: '#/components/parameters/billing_entity_code'
      - $ref: '#/components/parameters/months'
      responses:
        '200':
          description: Overdue balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverdueBalances'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /analytics/usage:
    get:
      tags:
      - Analytics
      summary: List usage
      description: 'Returns the usage billed by each billable metric, aggregated over the requested period and time granularity.

        This is a premium feature. On a non-premium license the response always covers the last 30 days with a daily granularity, and only the `billable_metric_code` filter is applied.'
      operationId: findAllUsages
      parameters:
      - name: time_granularity
        in: query
        description: The time granularity of usage analytics. Possible values are 'daily', 'weekly' and 'monthly'. Defaults to 'daily'.
        required: false
        schema:
          type: string
          enum:
          - daily
          - weekly
          - monthly
          default: daily
          example: monthly
      - name: currency
        in: query
        description: The currency of usage analytics. Format must be ISO 4217.
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/Currency'
          - example: USD
      - name: from_date
        in: query
        description: The start date of the period for which the usage analytics is calculated.
        required: false
        schema:
          type: string
          format: date
          example: '2023-11-01'
      - name: to_date
        in: query
        description: The end date of the period for which the usage analytics is calculated.
        required: false
        schema:
          type: string
          format: date
          example: '2023-11-30'
      - name: customer_type
        in: query
        description: The type of customer for which the usage analytics is calculated. Possible values are 'individual', 'company'.
        required: false
        schema:
          type: string
          enum:
          - individual
          - company
          example: individual
      - name: external_customer_id
        in: query
        description: The external identifier of the customer for which the usage analytics is calculated.
        required: false
        schema:
          type: string
          example: ext-customer-123
      - name: customer_country
        in: query
        description: The country of the customer for which the usage analytics is calculated.
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/Country'
          - example: US
      - name: external_subscription_id
        in: query
        description: The external identifier of the subscription for which the usage analytics is calculated.
        required: false
        schema:
          type: string
          example: ext-subscription-123
      - name: is_billable_metric_recurring
        in: query
        description: Indicates whether the billable metric associated with the usage is recurring.
        required: false
        schema:
          type: boolean
          example: true
      - name: plan_code
        in: query
        description: The code of the plan for which the usage analytics is calculated.
        required: false
        schema:
          type: string
          example: plan-code-123
      - name: billable_metric_code
        in: query
        description: The code of the usage-based billable metrics for which the usage analytics is calculated.
        required: false
        schema:
          type: string
          example: code1
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usages'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  schemas:
    GrossRevenues:
      type: object
      required:
      - gross_revenues
      properties:
        gross_revenues:
          type: array
          items:
            $ref: '#/components/schemas/GrossRevenueObject'
    InvoiceCollectionObject:
      type: object
      required:
      - month
      - payment_status
      - invoices_count
      - amount_cents
      - currency
      properties:
        month:
          type: string
          description: Identifies the month of the invoice issuing date.
          example: '2023-11-01T00:00:00.000Z'
        payment_status:
          type:
          - string
          - 'null'
          enum:
          - pending
          - succeeded
          - failed
          - null
          description: The payment status of the finalized invoices counted in this row. It is `null` for a month without finalized invoices.
          example: succeeded
        invoices_count:
          type: integer
          description: The number of finalized invoices issued during the month with this payment status.
          example: 10
        amount_cents:
          type: integer
          description: The total amount of the finalized invoices counted in this row, expressed in cents.
          example: 50000
        currency:
          oneOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
          description: The currency of the finalized invoices counted in this row. Format must be ISO 4217. It is `null` for a month without finalized invoices.
          example: USD
    OverdueBalanceObject:
      type: object
      required:
      - month
      - amount_cents
      - currency
      - lago_invoice_ids
      - billing_entity_id
      properties:
        month:
          type: string
          description: Identifies the month of the payment due date of the overdue invoices.
          example: '2023-11-01T00:00:00.000Z'
        amount_cents:
          type: integer
          description: The amount still due for this month, expressed in cents. It is the total of the overdue invoices minus the amounts already paid and minus the credits applied by finalized credit notes.
          example: 50000
        currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the overdue invoices. Format must be ISO 4217.
          example: USD
        lago_invoice_ids:
          type: array
          items:
            type: string
            format: uuid
          description: Unique identifiers of the overdue invoices included in this amount, created by Lago.
          example:
          - 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
        billing_entity_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the billing entity the overdue balance is attributed to, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
