          type: string
          format: date-time
          description: The month the invoiced usage is reported for, returned as the first instant of that month in UTC.
          example: '2023-11-01T00:00:00.000Z'
        code:
          type: string
          description: The code of the billable metric the usage fees were charged for.
          example: code1
        amount_cents:
          type: integer
          description: The total invoiced usage for the month and the billable metric, expressed in cents. It excludes taxes and is net of coupons.
          example: 50000
        currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of revenue analytics. Format must be ISO 4217.
          example: USD
    ApiErrorUnauthorized:
      type: object
      required:
      - status
      - error
      properties:
        status:
          type: integer
          format: int32
          example: 401
        error:
          type: string
          example: Unauthorized
    UsageObject:
      type: object
      required:
      - organization_id
      - amount_cents
      - amount_currency
      - is_billable_metric_deleted
      properties:
        organization_id:
          type: string
          format: uuid
          description: The unique identifier of the organization for which the usage analytics is calculated.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        start_of_period_dt:
          type: string
          format: date
          description: The start date of the period for which the usage analytics is calculated.
          example: '2023-11-01'
        end_of_period_dt:
          type: string
          format: date
          description: The end date of the period for which the usage analytics is calculated.
          example: '2023-11-30'
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of usage analytics. Format must be ISO 4217.
          example: USD
        amount_cents:
          type: integer
          description: The total amount for usages for a period, expressed in cents.
          example: 50000
        billable_metric_code:
          type: string
          description: The code of the usage-based billable metrics.
          example: code1
        units:
          type: string
          description: The total number of units for the usage-based billable metrics.
          pattern: ^[0-9]+.?[0-9]*$
          example: '1.0'
        is_billable_metric_deleted:
          type: boolean
          description: Indicates whether the billable metric associated with the usage has been deleted. It is set on every entry of the response.
          example: false
    GrossRevenueObject:
      type: object
      required:
      - month
      - amount_cents
      - currency
      - invoices_count
      - billing_entity_id
      properties:
        month:
          type: string
          format: date-time
          description: The month the revenue is reported for, returned as the first instant of that month in UTC.
          example: '2023-11-01T00:00:00.000Z'
        amount_cents:
          type: integer
          description: The total amount of revenue for a period, expressed in cents.
          example: 50000
        currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of revenue analytics. Format must be ISO 4217.
          example: USD
        invoices_count:
          type: integer
          description: The number of `finalized` invoices issued during the month. Fees paid in advance that are not attached to an invoice are not counted.
          example: 10
        billing_entity_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the billing entity the revenue is attributed to, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    MrrObject:
      type: object
      required:
      - month
      - amount_cents
      - currency
      properties:
        month:
          type: string
          format: date-time
          description: The month the MRR is reported for, returned as the first instant of that month in UTC.
          example: '2023-11-01T00:00:00.000Z'
        amount_cents:
          type:
          - integer
          - 'null'
          description: The total amount of MRR, expressed in cents. It is `null` for a month with no subscription fee.
          example: 50000
        currency:
          oneOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
          description: The currency of MRR analytics. Format must be ISO 4217. It is `null` for a month with no subscription fee.
          example: USD
    InvoicedUsages:
      type: object
      required:
      - invoiced_usages
      properties:
        invoiced_usages:
          type: array
          items:
            $ref: '#/components/schemas/InvoicedUsageObject'
  parameters:
    months:
      name: months
      in: query
      description: Show data only for given number of months.
      required: false
      explode: true
      schema:
        type: integer
        example: 12
    billing_entity_code:
      name: billing_entity_code
      in: query
      description: Restrict the analytics to a single billing entity, identified by its code. An unknown code is ignored and the analytics cover the whole organization.
      required: false
      explode: true
      schema:
        type: string
        example: acme_corp
  responses:
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorForbidden'
    Unauthorized:
      description: Unauthorized error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorUnauthorized'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
