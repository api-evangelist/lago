              select_options:
              - google
              - okta
          description: Privileges associated with this feature. Each privilege must have a value assigned.
    CustomerViesCheckObject:
      allOf:
      - $ref: '#/components/schemas/CustomerBaseObject'
      - type: object
        properties:
          vies_check:
            type: object
            description: Result of the VIES lookup. When VIES answers with a match, the object also carries the details returned by VIES, such as the country code and the VAT number.
            properties:
              valid:
                type: boolean
                description: Whether VIES recognises the tax identification number of the customer as a valid VAT number.
                example: true
              valid_format:
                type: boolean
                description: Whether the tax identification number of the customer has the format of a VAT number. Sent when VIES returned no match or could not be reached.
                example: true
              error:
                type: string
                description: Message returned when the VIES service could not be reached. Sent only in that case.
                example: 'The VIES web service returned the error: rate limit exceeded'
    AppliedUsageThresholdObject:
      type: object
      required:
      - lifetime_usage_amount_cents
      - created_at
      - usage_threshold
      properties:
        lifetime_usage_amount_cents:
          type: integer
          description: The amount of usage in cents that has been accumulated over the lifetime of the subscription.
          example: 2000
        created_at:
          type: string
          format: date-time
          description: The date and time when the lifetime usage was computed. It is expressed in UTC format according to the ISO 8601 datetime standard.
          example: '2025-03-31T12:31:44Z'
        usage_threshold:
          $ref: '#/components/schemas/UsageThresholdObject'
    OrderExecutionModeEnumOrNull:
      type:
      - string
      - 'null'
      description: "How the order is carried out. It is `null` while the order has neither been scheduled nor executed. It can be any of the following values:\n  - `execute_in_lago`: Lago applies the quoted deal itself, creating the subscriptions, coupons, wallets or one-off invoice it describes.\n  - `order_only`: Lago records the order without applying it, leaving the execution to your own systems.\n"
      enum:
      - null
      - execute_in_lago
      - order_only
      example: execute_in_lago
    QuoteVersionVoidReasonEnum:
      type:
      - string
      - 'null'
      description: "The reason why the quote version was voided. It is `null` unless the `status` is `voided`. It can be any of the following values:\n  - `manual`: voided explicitly, through the API or the Lago user interface.\n  - `superseded`: voided because the version was cloned into a new draft.\n  - `cascade_of_expired`: voided because the order form generated from the version expired.\n  - `cascade_of_voided`: voided because the order form generated from the version was voided.\n"
      enum:
      - null
      - manual
      - superseded
      - cascade_of_expired
      - cascade_of_voided
      example: manual
    BillableMetricObject:
      type: object
      required:
      - lago_id
      - name
      - code
      - aggregation_type
      - recurring
      - created_at
      - filters
      properties:
        lago_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier of the billable metric created by Lago.
        name:
          type: string
          example: Storage
          description: Name of the billable metric.
        code:
          type: string
          example: storage
          description: Unique code used to identify the billable metric associated with the API request. This code associates each event with the correct metric.
        description:
          type:
          - string
          - 'null'
          example: GB of storage used in my application
          description: Internal description of the billable metric.
        recurring:
          type: boolean
          example: false
          description: 'Defines if the billable metric is persisted billing period over billing period.


            - If set to `true`: the accumulated number of units calculated from the previous billing period is persisted to the next billing period.

            - If set to `false`: the accumulated number of units is reset to 0 at the end of the billing period.

            - If not defined in the request, default value is `false`.'
        rounding_function:
          type:
          - string
          - 'null'
          enum:
          - ceil
          - floor
          - round
          - null
          example: round
          description: Refers to the numeric value or mathematical expression that will be rounded based on the calculated number of billing units. Possible values are `round`, `ceil` and `floor`.
        rounding_precision:
          type:
          - integer
          - 'null'
          example: 2
          description: Specifies the number of decimal places to which the `rounding_function` will be rounded. It can be a positive or negative value.
        created_at:
          type: string
          format: date-time
          example: '2022-09-14T16:35:31Z'
          description: Creation date of the billable metric.
        expression:
          type:
          - string
          - 'null'
          example: round((event.properties.ended_at - event.properties.started_at) * event.properties.units)
          description: Expression used to calculate the event units. The expression is evaluated for each event and the result is then used to calculate the total aggregated units.
        field_name:
          type:
          - string
          - 'null'
          example: gb
          description: Property of the billable metric used for aggregating usage data. This field is not required for `count_agg`.
        aggregation_type:
          type: string
          description: Aggregation method used to compute usage for this billable metric.
          example: sum_agg
          enum:
          - count_agg
          - sum_agg
          - max_agg
          - unique_count_agg
          - weighted_sum_agg
          - latest_agg
        weighted_interval:
          type:
          - string
          - 'null'
          enum:
          - seconds
          - null
          example: seconds
          description: Parameter exclusively utilized in conjunction with the `weighted_sum_agg` aggregation type. It serves to adjust the aggregation result by assigning weights and proration to the result based on time intervals.
        filters:
          type: array
          items:
            $ref: '#/components/schemas/BillableMetricFilterObject'
    TriggeredAlertObject:
      type: object
      required:
      - lago_id
      - lago_organization_id
      - lago_alert_id
      - lago_subscription_id
      - external_subscription_id
      - lago_wallet_id
      - external_customer_id
      - billable_metric_code
      - alert_type
      - alert_code
      - alert_name
      - current_value
      - previous_value
      - triggered_at
      - crossed_thresholds
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the triggered alert, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_organization_id:
          type: string
          format: uuid
          description: Unique identifier of the organization, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_alert_id:
          type: string
          format: uuid
          description: Unique identifier of the alert, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_subscription_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier of the subscription, created by Lago. Null when the alert is attached to a wallet.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_subscription_id:
          type:
          - string
          - 'null'
          description: The subscription external unique identifier (provided by your own application). Null when the alert is attached to a wallet.
          example: sub_1234567890
        lago_wallet_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier of the wallet, created by Lago. Null when the alert is attached to a subscription.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_customer_id:
          type: string
          description: The customer external unique identifier (provided by your own application).
          example: cust_1234567890
        billable_metric_code:
          type:
          - string
          - 'null'
          description: The code of the billable metric associated with the alert. Only for alerts based on a billable metric.
          example: storage_usage
        alert_type:
          type: string
          description: The type of alert triggered.
          enum:
          - current_usage_amount
          - billable_metric_current_usage_amount
          - billable_metric_current_usage_units
          - lifetime_usage_amount
          - billable_metric_lifetime_usage_units
          - wallet_balance_amount
          - wallet_credits_balance
          - wallet_ongoing_balance_amount
          - wallet_credits_ongoing_balance
          example: billable_metric_current_usage_amount
        alert_code:
          type: string
          description: Unique code used to identify the alert triggered.
          example: storage_threshold_alert
        alert_name:
          type:
          - string
          - 'null'
          description: The name of the alert triggered.
          example: Storage Usage Alert
        current_value:
          type: string
          description: When the system checked if this alert should be triggered, this value was retrieved and checked against the thresholds crossed since the previous value. Returned as a string formatted as a BigDecimal.
          example: '1200.0'
        previous_value:
          type: string
          description: During the previous run, this value was retrieved. Returned as a string formatted as a BigDecimal.
          example: '900.0'
        triggered_at:
          type: string
          format: date-time
          description: The date and time in UTC (ISO 8601) when the system triggered the alert.
          example: '2025-05-19T10:04:21Z'
        crossed_thresholds:
          type: array
          description: Array of thresholds crossed. All the recurring threshold values are present.
          items:
            $ref: '#/components/schemas/AlertThresholdObject'
    PaymentRequestPaymentFailureObject:
      type: object
      required:
      - lago_payment_request_id
      - lago_invoice_ids
      - lago_customer_id
      - external_customer_id
      - payment_provider
      properties:
        lago_payment_request_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the payment request within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the payment request record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_invoice_ids:
          type: array
          items:
            type: string
            format: uuid
          description: List of unique identifiers assigned to the invoices within the Lago application. These IDs are exclusively created by Lago and serve as unique identifiers for the invoices records within the Lago system.
          example:
          - 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_customer_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_customer_id:
          type: string
          description: The customer external unique identifier (provided by your own application)
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
        provider_customer_id:
          type: string
          description: Unique identifier of the customer within the payment provider
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
        payment_provider:
          type: string
          enum:
          - adyen
          - cashfree
          - gocardless
          - moneyhash
          - stripe
          description: The type of payment provider
          example: stripe
        payment_provider_code:
          type: string
          description: Code of the payment provider
          example: Stripe Prod
        provider_error:
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
    EventObject:
      type: object
      required:
      - transaction_id
      - lago_customer_id
      - code
      - timestamp
      - lago_subscription_id
      - external_subscription_id
      properties:
        lago_id:
          type:
          - string
          - 'null'
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the event within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the event's record within the Lago system. It is an opaque identifier and is not guaranteed to be a UUID; on organizations using the ClickHouse events store it is a composite string.
        transaction_id:
          type: string
          example: transaction_1234567890
          description: This field represents a unique identifier for the event. It is crucial for ensuring idempotency, meaning that each event can be uniquely identified and processed without causing any unintended side effects.
        lago_customer_id:
          type:
          - string
          - 'null'
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system
        code:
          type: string
          example: storage
          description: The code that identifies a targeted billable metric. It is essential that this code matches the `code` property of one of your active billable metrics. If the provided code does not correspond to any active billable metric, it will be ignored during the process.
        timestamp:
          type: string
          format: date-time
          example: '2022-04-29T08:59:51.123Z'
          description: The date and time at which the event occurred, in ISO 8601 format with millisecond precision and expressed in Coordinated Universal Time (UTC). When no timestamp is sent on the event, it is set to the time of event reception.
        precise_total_amount_cents:
          type:
          - string
          - 'null'
          example: '1234.56'
          description: The precise total amount that was sent in the event payload. This field is used by the `dynamic` pricing model.
        properties:
          type: object
          description: This field represents additional properties associated with the event, which are utilized in the calculation of the final fee. This object becomes mandatory when the targeted billable metric employs a `sum_agg`, `max_agg`, or `unique_count_agg` aggregation method. However, when using a simple `count_agg`, this object is not required.
          properties:
            operation_type:
              type:
              - string
              - 'null'
              description: The `operation_type` field is only necessary when adding or removing a specific unit when the targeted billable metric adopts a `unique_count_agg` aggregation method. In other cases, the `operation_type` field is not required. The valid values for the `operation_type` field are `add` or `remove`, which indicate whether the unit is being added or removed from the unique count aggregation, respectively.
              enum:
              - add
              - remove
          additionalProperties:
            oneOf:
            - type: string
            - type: integer
            - type: number
          example:
            gb: 10
        lago_subscription_id:
          type:
          - string
          - 'null'
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the subscription within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the subscription's record within the Lago system
        external_subscription_id:
          type: string
          example: sub_1234567890
          description: The unique identifier of the subscription within your application, as sent on the event. It is the value Lago uses to attach the event to a subscription.
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-04-29T08:59:51Z'
          description: The creation date of the event's record in the Lago application, presented in the ISO 8601 datetime format, specifically in Coordinated Universal Time (UTC). It provides the precise timestamp of when the event's record was created within the Lago application
    OrderObject:
