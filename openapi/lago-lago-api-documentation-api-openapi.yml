        lago_customer_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_customer_id:
          type: string
          description: The customer external unique identifier (provided by your own application)
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
        provider_customer_id:
          type:
          - string
          - 'null'
          description: Unique identifier of the customer within the payment provider. It is `null` when the payment failed before the payment provider was called.
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
        payment_provider:
          type:
          - string
          - 'null'
          enum:
          - adyen
          - cashfree
          - gocardless
          - moneyhash
          - stripe
          - null
          description: The payment provider of the customer. It is `null` when the customer has no payment provider.
          example: stripe
        payment_provider_code:
          type:
          - string
          - 'null'
          description: Code of the payment provider connection of the customer. It is `null` when the customer has no payment provider.
          example: stripe-eu-1
        provider_error:
          description: The error returned by the payment provider. It is `null` when the payment failed before the payment provider was called.
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: true
            properties:
              message:
                type:
                - string
                - 'null'
                description: The error message returned by the payment provider.
                example: Your card was declined.
              error_code:
                type:
                - string
                - 'null'
                description: The error code returned by the payment provider.
                example: card_declined
        error_details:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Extra details about the failure. It carries `code` set to `customer_must_have_payment_provider` when a payment is retried for a customer without a payment provider, and the details of the provider exception when one was raised. It is `null` when the failure carries no extra details.
          example:
            code: customer_must_have_payment_provider
    WalletTransactionObject:
      type: object
      required:
      - lago_id
      - lago_wallet_id
      - lago_invoice_id
      - lago_credit_note_id
      - lago_voided_invoice_id
      - billing_entity_code
      - status
      - source
      - transaction_status
      - transaction_type
      - credit_amount
      - amount
      - remaining_amount_cents
      - remaining_credit_amount
      - priority
      - invoice_requires_successful_payment
      - settled_at
      - failed_at
      - created_at
      - metadata
      - name
      - payment_method
      - purchase_order_number
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the wallet transaction within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the wallet transaction's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_wallet_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the wallet within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the wallet's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        billing_entity_code:
          type: string
          example: default
          description: The code of the billing entity associated with the wallet transaction. Falls back to the wallet's billing entity when the transaction does not carry one.
        lago_invoice_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier assigned to the invoice associated with this wallet transaction. This ID is exclusively created by Lago and serves as a unique identifier for the invoice's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_credit_note_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier of the credit note associated with this wallet transaction. This ID is exclusively created by Lago and serves as a unique identifier for the invoice's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_voided_invoice_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier of the invoice that was voided and triggered the creation of this inbound wallet transaction. Only present for inbound transactions on traceable wallets that were created as a result of an invoice void.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        status:
          type: string
          enum:
          - pending
          - settled
          - failed
          description: The status of the wallet transaction. Possible values are `pending`, `settled` or `failed`.
          example: settled
        source:
          type: string
          enum:
          - manual
          - interval
          - threshold
          description: The source field represents the origin or trigger of the wallet transaction. Possible values are `manual`, `interval`, `threshold`
          example: manual
        transaction_status:
          type: string
          enum:
          - purchased
          - granted
          - voided
          - invoiced
          description: The transaction status of the wallet transaction. Possible values are `purchased` (with pending or settled status), `granted` (without invoice_id), `voided` or `invoiced`.
          example: purchased
        transaction_type:
          type: string
          enum:
          - inbound
          - outbound
          description: The type of transaction. Possible values are `inbound` (increasing the balance) or `outbound` (decreasing the balance).
          example: inbound
        amount:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          description: The amount of credits based on the rate and the currency.
          example: '10.0'
        credit_amount:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          description: The number of credits used in the wallet transaction.
          example: '100.0'
        invoice_requires_successful_payment:
          type: boolean
          description: A boolean setting that, when set to true, delays issuing an invoice for a wallet top-up until a successful payment is made; if false, the invoice is issued immediately upon wallet top-up, regardless of the payment status. Default value of false.
          example: false
        metadata:
          type: array
          description: This field allows you to store a list of key-value pairs that hold additional information or custom attributes related to the data.
          items:
            type: object
            properties:
              key:
                type: string
                description: The unique identifier for the attribute.
              value:
                type: string
                description: The value associated with the key.
          example:
          - key: example key
            value: example value
          - key: another key
            value: another value
        remaining_amount_cents:
          type:
          - integer
          - 'null'
          description: The remaining unconsumed amount of an inbound wallet transaction, expressed in cents. Only present for inbound transactions on traceable wallets. Tracks how much of the original credited amount has not yet been consumed by outbound transactions.
          example: 5000
        remaining_credit_amount:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+.?[0-9]*$
          description: The remaining unconsumed amount of an inbound wallet transaction, expressed in credits. Only present for inbound transactions on traceable wallets.
          example: '5.0'
        priority:
          type: integer
          description: The priority of the wallet transaction, used to determine the order in which inbound transactions are consumed. Lower values are consumed first.
          example: 50
        settled_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date when wallet transaction is settled, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
          example: '2022-04-29T08:59:51Z'
        failed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date when the wallet transaction failed, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
          example: '2022-04-29T08:59:51Z'
        created_at:
          type: string
          format: date-time
          description: The date of the wallet transaction creation, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
          example: '2022-04-29T08:59:51Z'
        name:
          type:
          - string
          - 'null'
          description: The name of the wallet transaction. It will appear on the invoice as the label for the fee. If not set, the label on the invoice will fallback to either `Prepaid credits - {{wallet_name}}` if the wallet name is set, or `Prepaid credits`.
          example: Tokens for models 'high-fidelity-boost'
        applied_invoice_custom_sections:
          description: The invoice custom sections applied to invoices generated by this wallet transaction.
          type: array
          items:
            $ref: '#/components/schemas/AppliedInvoiceCustomSectionObject'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodReference'
          description: The payment method assigned to this wallet transaction for processing the payment.
        purchase_order_number:
          type:
          - string
          - 'null'
          example: PO-123
          description: The purchase order number associated with this wallet transaction. It will be added to invoices generated for the resulting wallet top-up. If not set, falls back to the wallet's `purchase_order_number`.
    SubscriptionObject:
      type: object
      required:
      - activated_at
      - activation_rules
      - billing_time
      - canceled_at
      - cancellation_reason
      - consolidate_invoice
      - created_at
      - current_billing_period_ending_at
      - current_billing_period_started_at
      - downgrade_plan_date
      - ending_at
      - external_customer_id
      - external_id
      - lago_customer_id
      - lago_id
      - name
      - next_plan_code
      - on_termination_credit_note
      - on_termination_invoice
      - payment_method
      - plan_amount_cents
      - plan_amount_currency
      - plan_code
      - previous_plan_code
      - progressive_billing_disabled
      - purchase_order_number
      - started_at
      - status
      - subscription_at
      - terminated_at
      - trial_ended_at
      properties:
        lago_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the subscription within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the subscription's record within the Lago system
        external_id:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
          description: The subscription external unique identifier (provided by your own application).
        lago_customer_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system
        external_customer_id:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
          description: The customer external unique identifier (provided by your own application).
        billing_entity_code:
          type: string
          example: default
          description: The code of the billing entity associated with the subscription.
        billing_time:
          type: string
          description: The billing time for the subscription, which can be set as either `anniversary` or `calendar`. If not explicitly provided, it will default to `calendar`. The billing time determines the timing of recurring billing cycles for the subscription. By specifying `anniversary`, the billing cycle will be based on the specific date the subscription started (billed fully), while `calendar` sets the billing cycle at the first day of the week/month/year (billed with proration).
          example: anniversary
          enum:
          - calendar
          - anniversary
        name:
          type:
          - string
          - 'null'
          example: Repository A
          description: The display name of the subscription on an invoice. This field allows for customization of the subscription's name for billing purposes, especially useful when a single customer has multiple subscriptions using the same plan.
        plan_code:
          type: string
          example: premium
          description: The unique code representing the plan to be attached to the customer. This code must correspond to the `code` property of one of the active plans.
        plan_amount_cents:
          type: integer
          description: The base cost of the related plan, excluding any applicable taxes, that is billed on a recurring basis.
          example: 10000
        plan_amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the related plan. It indicates the monetary unit in which the plan's cost, including taxes and usage-based charges, is expressed.
          example: USD
        status:
          type: string
          description: 'The status of the subscription, which can have the following values:

            - `active`: the subscription is currently active and applied to the customer.

            - `canceled`: the subscription has been stopped before its activation. This can occur when two consecutive downgrades have been applied to a customer, when a subscription with a pending status is terminated, or when a payment-gated subscription fails to be paid (or its activation rule expires) before activation. When caused by payment gating, the `cancellation_reason` field is set.

            - `incomplete`: the subscription was created with a payment activation rule and is waiting for the gating payment to succeed before it becomes `active`. It is automatically `canceled` if the payment fails or the activation rule expires.

            - `pending`: a previous subscription has been downgraded, and the current one is awaiting automatic activation at the end of the billing period.

            - `terminated`: the subscription is no longer active.'
          example: active
          enum:
          - active
          - canceled
          - incomplete
          - pending
          - terminated
        created_at:
          type: string
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The creation date of the subscription, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC). This date provides a timestamp indicating when the subscription was initially created.
        canceled_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-09-14T16:35:31Z'
          description: The cancellation date of the subscription. This field is not null when the subscription is `canceled`. This date should be provided in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The effective start date of the subscription. This field can be null if the subscription is `pending` or `canceled`. This date should be provided in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
        ending_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-10-08T00:00:00Z'
          description: The effective end date of the subscription. If this field is set to null, the subscription will automatically renew. This date should be provided in ISO 8601 datetime format, and use Coordinated Universal Time (UTC).
        subscription_at:
          type: string
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The anniversary date and time of the initial subscription. This date serves as the basis for billing subscriptions with `anniversary` billing time. The `anniversary_date` should be provided in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
        terminated_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-09-14T16:35:31Z'
          description: The termination date of the subscription. This field is not null when the subscription is `terminated`. This date should be provided in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC)
        previous_plan_code:
          type:
          - string
          - 'null'
          example: null
          description: The code identifying the previous plan associated with this subscription.
        next_plan_code:
          type:
          - string
          - 'null'
          example: null
          description: The code identifying the next plan in the case of a downgrade.
        downgrade_plan_date:
          type:
          - string
          - 'null'
          format: date
          example: '2022-04-30'
          description: The date when the plan will be downgraded, represented in ISO 8601 date format.
        trial_ended_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The date when the free trial is ended, represented in ISO 8601 date format.
        current_billing_period_started_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The date and time when the current billing period started, represented in ISO 8601 date format.
        current_billing_period_ending_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-09-08T00:00:00Z'
          description: The date and time when the current billing period ends, represented in ISO 8601 date format.
        on_termination_credit_note:
          type:
          - string
          - 'null'
          description: 'When a pay-in-advance subscription is terminated before the end of its billing period, we generate a credit note for the unused subscription time by default.

            This field allows you to control the behavior of the credit note generation:


            - `credit`: A credit note is generated for the unused subscription time. The unused amount is credited back to the customer.

            - `refund`: A credit note is generated for the unused subscription time. If the invoice is paid or partially paid, the unused paid amount is refunded; any unpaid unused amount is credited back to the customer.

            - `offset`: A credit note is generated for the unused subscription time. If the invoice is paid or partially paid, the unused paid amount is refunded; any unpaid unused amount is applied to the invoice reducing its amount due.

            - `skip`: No credit note is generated for the unused subscription time.


            _Note: This field is only applicable to pay-in-advance plans and will be `null` for pay-in-arrears plans._

            '
          example: credit
          enum:
          - credit
          - refund
          - offset
          - skip
        on_termination_invoice:
          type:
          - string
          example: generate
          enum:
          - generate
          - skip
          default: generate
          description: 'When a subscription is terminated before the end of its billing period, we generate an invoice for the unbilled usage.

            This field allows you to control the behavior of the invoice generation:


            - `generate`: An invoice is generated for the unbilled usage.

            - `skip`: No invoice is generated for the unbilled usage.

            '
        applied_invoice_custom_sections:
          description: The invoice custom sections applied to invoices generated by this subscription. Only returned when creating, retrieving, updating or terminating a subscription, not when listing subscriptions and not in subscription webhooks.
          type: array
          items:
            $ref: '#/components/schemas/AppliedInvoiceCustomSectionObject'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodReference'
          description: The payment method assigned to this subscription for processing payments.
        consolidate_invoice:
          type: boolean
          default: true
          example: true
          description: 'Controls whether this subscription is eligible to be grouped with other subscriptions of the same customer on a consolidated recurring invoice.


            - `true` (default): the subscription is included in the customer''s standard invoice grouping (by billing entity, currency and payment method).

            - `false`: the subscription is excluded from consolidation and always billed on its own dedicated invoice, regardless of other grouping criteria.

            '
        progressive_billing_disabled:
          type: boolean
          default: false
          example: false
          description: 'Indicates whether progressive billing is switched off for this subscription, regardless of any usage thresholds defined on the plan (including thresholds inherited from a parent plan when the subscription runs on a plan override).


            When `true`, no progressive billing invoice is issued for this subscription.

            '
        cancellation_reason:
          type:
          - string
          - 'null'
          example: payment_failed
          enum:
          - payment_failed
          - timeout
          - manual
          description: 'The reason a payment-gated subscription was canceled while still `incomplete`. Null unless the subscription was canceled before activation.


            - `payment_failed`: the gating payment failed.

            - `timeout`: the activation rule expired before the payment succeeded.

            - `manual`: the incomplete subscription was canceled on demand, via a terminate request with `status=incomplete`.

            '
        activated_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: 'The date and time when a payment-gated subscription was activated (i.e. moved from `incomplete` to `active` once the gating payment succeeded), represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC). Null while the subscription is still `incomplete`.

            '
        activation_rules:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionActivationRuleObject'
          description: 'The activation rules attached to the subscription. A payment activation rule gates activation on a successful first payment, keeping the subscription in the `incomplete` state until the payment succeeds or the rule expires.

            '
        purchase_order_number:
          type:
          - string
          - 'null'
          example: PO-123
          description: The purchase order number associated with the subscription. It will be added to invoices generated for this subscription.
    ChargeModelEnum:
      type: string
      description: "Specifies the pricing model used for the calculation of the final fee. It can be any of the following values:\n  - [`dynamic`](https://docs.getlago.com/guide/plans/charges/charge-models/dynamic)\n  - [`graduated_percentage`](https://docs.getlago.com/guide/plans/charges/charge-models/graduated-percentage)\n  - [`graduated`](https://docs.getlago.com/guide/plans/charges/charge-models/graduated)\n  - [`package`](https://docs.getlago.com/guide/plans/charges/charge-models/package)\n  - [`percentage`](https://docs.getlago.com/guide/plans/charges/charge-models/percentage)\n  - [`standard`](https://docs.getlago.com/guide/plans/charges/charge-models/standard)\n  - [`volume`](https://docs.getlago.com/guide/plans/charges/charge-models/volume)\n"
      enum:
      - dynamic
      - graduated
      - graduated_percentage
      - package
      - percentage
      - standard
      - volume
    OrderFormObject:
      type: object
      required:
      - lago_id
      - number
      - status
      - void_reason
      - expires_at
      - signed_at
      - voided_at
      - signed_document_url
      - lago_organization_id
      - lago_customer_id
      - lago_quote_id
      - lago_quote_version_id
      - created_at
      - updated_at
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the order form, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        number:
          type: string
          description: The unique number assigned to the order form by Lago.
          example: OF-2026-0001
        status:
          $ref: '#/components/schemas/OrderFormStatusEnum'
        void_reason:
          $ref: '#/components/schemas/OrderFormVoidReasonEnum'
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time in UTC (ISO 8601) after which the order form is meant to expire. It is `null` when the order form never expires. It is validated when the quote is approved, where a value on or after the day the quoted deal stops being executable is rejected rather than clamped. Expiry is then swept hourly and compared by calendar date, so signing keeps succeeding until the sweep moves the order form to `expired`.
          example: '2026-06-30T23:59:59Z'
        signed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time in UTC (ISO 8601) when the order form was marked as signed. It is `null` unless the `status` is `signed`.
          example: '2026-04-29T08:59:51Z'
        voided_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time in UTC (ISO 8601) when the order form stopped being actionable. It is set both when the order form is voided and when it expires, and is `null` otherwise.
          example: '2026-04-29T08:59:51Z'
        signed_document_url:
          type:
          - string
          - 'null'
          format: uri
          description: The URL of the signed document attached to the order form. It is `null` when no document was uploaded.
          example: https://api.getlago.com/rails/active_storage/blobs/redirect/eyJfcmFpbHMi/OF-2026-0001
        lago_organization_id:
          type: string
          format: uuid
          description: Unique identifier of the organization, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_customer_id:
          type: string
          format: uuid
          description: Unique identifier of the customer the order form is addressed to, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_quote_id:
          type: string
          format: uuid
          description: Unique identifier of the quote the order form comes from, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_quote_version_id:
          type: string
          format: uuid
          description: Unique identifier of the approved quote version the order form was generated from, created by Lago. A quote version carries at most one order form.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        created_at:
          type: string
          format: date-time
          description: The date and time in UTC (ISO 8601) when the order form was created.
          example: '2026-04-29T08:59:51Z'
        updated_at:
          type: string
          format: date-time
          description: The date and time in UTC (ISO 8601) when the order form was last updated.
          example: '2026-04-29T08:59:51Z'
