    PlanEntitlement:
      type: object
      required:
      - entitlement
      properties:
        entitlement:
          $ref: '#/components/schemas/PlanEntitlementObject'
  parameters:
    webhook_signature:
      name: X-Lago-Signature
      in: header
      description: 'Signature of the webhook payload. The format depends on `X-Lago-Signature-Algorithm`:

        `hmac` is the Base64 encoding of an HMAC-SHA256 digest of the payload,

        `jwt` is an RS256 JSON Web Token (a string starting with `eyJ`).'
      required: true
      schema:
        type: string
        example: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
    webhook_signature_algorithm:
      name: X-Lago-Signature-Algorithm
      in: header
      description: Algorithm used to generate the signature
      required: true
      schema:
        type: string
        enum:
        - jwt
        - hmac
        example: hmac
    webhook_unique_key:
      name: X-Lago-Unique-Key
      in: header
      description: Unique id of the webhook. It can be used for idempotency
      required: true
      schema:
        type: string
        format: uuid
        example: 1a901a90-1a90-1a90-1a90-1a901a901a90
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
