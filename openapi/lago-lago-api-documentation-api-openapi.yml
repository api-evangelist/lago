    CreditNoteObject:
      type: object
      required:
      - lago_id
      - sequential_id
      - billing_entity_code
      - number
      - lago_invoice_id
      - invoice_number
      - purchase_order_number
      - issuing_date
      - credit_status
      - refund_status
      - reason
      - description
      - currency
      - total_amount_cents
      - precise_total_amount_cents
      - credit_amount_cents
      - refund_amount_cents
      - offset_amount_cents
      - balance_amount_cents
      - taxes_amount_cents
      - precise_taxes_amount_cents
      - taxes_rate
      - sub_total_excluding_taxes_amount_cents
      - coupons_adjustment_amount_cents
      - created_at
      - updated_at
      - file_url
      - xml_url
      - self_billed
      properties:
        lago_id:
          type: string
          format: uuid
          description: The credit note unique identifier, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        billing_entity_code:
          type: string
          example: acme_corp
          description: The unique code of the billing entity associated with the credit note.
        sequential_id:
          type: integer
          description: The sequential identifier of the credit note, specifically scoped on the associated invoice. It provides a unique numerical identifier for the credit note within the context of the invoice.
          example: 2
        number:
          type: string
          description: The credit note unique number.
          example: LAG-1234-CN2
        lago_invoice_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the invoice that the credit note belongs to
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        invoice_number:
          type: string
          description: The invoice unique number, related to the credit note.
          example: LAG-1234
        purchase_order_number:
          type:
          - string
          - 'null'
          example: PO-123
          description: The purchase order number of the invoice the credit note belongs to.
        issuing_date:
          type: string
          format: date
          description: The date of creation of the credit note. It follows the ISO 8601 date format and provides the specific date when the credit note was created.
          example: '2022-12-06'
        credit_status:
          type:
          - string
          - 'null'
          enum:
          - available
          - consumed
          - voided
          - null
          description: 'The status of the credit portion of the credit note. It indicates the current state or condition of the credit amount associated with the credit note. The possible values for this field are:


            - `available`: this status indicates that an amount remains available for future usage. The credit can be applied towards future transactions or invoices.

            - `consumed`: this status indicates that the credit amount has been fully consumed. The remaining amount is 0, indicating that the credit has been utilized in its entirety.

            - `voided`: this status indicates that the remaining amount of the credit cannot be used any further. The credit has been voided and is no longer available for application or redemption.'
          example: available
        refund_status:
          type:
          - string
          - 'null'
          enum:
          - pending
          - succeeded
          - failed
          - null
          description: 'The status of the refund portion of the credit note. It indicates the current state or condition of the refund associated with the credit note. The possible values for this field are:


            - `pending`: this status indicates that the refund is pending execution. The refund request has been initiated but has not been processed or completed yet.

            - `succeeded`: this status indicates that the refund has been successfully executed. The refund amount has been processed and returned to the customer or the designated recipient.

            - `failed`: this status indicates that the refund failed to execute. The refund request encountered an error or unsuccessful processing, and the refund amount could not be returned.'
          example: pending
        reason:
          type: string
          enum:
          - duplicated_charge
          - product_unsatisfactory
          - order_change
          - order_cancellation
          - fraudulent_charge
          - other
          description: 'The reason of the credit note creation.

            Possible values are `duplicated_charge`, `product_unsatisfactory`, `order_change`, `order_cancellation`, `fraudulent_charge` or `other`.'
          example: other
        description:
          type:
          - string
          - 'null'
          description: The description of the credit note.
          example: Free text
        currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the credit note.
          example: EUR
        total_amount_cents:
          type: integer
          description: The total amount of the credit note, expressed in cents.
          example: 120
        precise_total_amount_cents:
          type: string
          description: The total amount of the credit note, expressed in cents, with precision.
          example: '120.0001'
        taxes_amount_cents:
          type: integer
          description: The tax amount of the credit note, expressed in cents.
          example: 20
        precise_taxes_amount_cents:
          type: string
          description: The tax amount of the credit note, expressed in cents, with precision.
          example: '20.0001'
        taxes_rate:
          type: number
          description: The tax rate associated with this specific credit note.
          example: 20
        sub_total_excluding_taxes_amount_cents:
          type: integer
          description: The subtotal of the credit note excluding any applicable taxes, expressed in cents.
          example: 100
        balance_amount_cents:
          type: integer
          description: The remaining credit note amount, expressed in cents.
          example: 100
        credit_amount_cents:
          type: integer
          description: The credited amount of the credit note, expressed in cents.
          example: 100
        refund_amount_cents:
          type: integer
          description: The refunded amount of the credit note, expressed in cents.
          example: 0
        offset_amount_cents:
          type: integer
          description: The offset amount (deducted from the invoice balance) of the credit note, expressed in cents.
          example: 0
        coupons_adjustment_amount_cents:
          type: integer
          description: The pro-rated amount of the coupons applied to the source invoice.
          example: 20
        created_at:
          type: string
          format: date-time
          description: The date when the credit note was created. It is expressed in Coordinated Universal Time (UTC).
          example: '2022-09-14T16:35:31Z'
        updated_at:
          type: string
          format: date-time
          description: The date when the credit note was last updated. It is expressed in Coordinated Universal Time (UTC).
          example: '2022-09-14T16:35:31Z'
        file_url:
          type:
          - string
          - 'null'
          description: The PDF file of the credit note. It is `null` while no PDF has been generated.
          example: https://getlago.com/credit_note/file
        xml_url:
          type:
          - string
          - 'null'
          description: The e-invoicing XML file of the credit note. It is `null` while no XML file has been generated.
          example: https://getlago.com/credit_note/xml
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteItemObject'
          description: Array of credit note's items.
        applied_taxes:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteAppliedTaxObject'
        self_billed:
          type: boolean
          example: false
          description: Indicates if the credit note belongs to self-billed invoice. Self-billing is a process where an organization creates the invoice on behalf of the partner.
        customer:
          $ref: '#/components/schemas/CustomerObject'
        metadata:
          $ref: '#/components/schemas/MetadataObject'
        error_details:
          type: array
          description: The errors raised while the credit note was issued. When the key is present it is always an array, empty when no error was raised.
          items:
            $ref: '#/components/schemas/CreditNoteErrorDetailsObject'
    CustomerObject:
      allOf:
      - $ref: '#/components/schemas/CustomerBaseObject'
      - type: object
        properties:
          integration_customers:
            type: array
            items:
              $ref: '#/components/schemas/IntegrationCustomer'
    SubscriptionActivationRuleObject:
      type: object
      required:
      - lago_id
      - type
      - timeout_hours
      - status
      - expires_at
      - created_at
      - updated_at
      properties:
        lago_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the activation rule within the Lago application. This ID is exclusively created by Lago.
        type:
          type: string
          description: The type of the activation rule. Only `payment` is currently supported. A `payment` rule gates the subscription activation on a successful payment of the first invoice.
          example: payment
          enum:
          - payment
        timeout_hours:
          type: integer
          description: The number of hours the subscription stays in the `incomplete` state waiting for the payment to succeed before it is automatically canceled.
          example: 48
        status:
          type: string
          description: 'The evaluation status of the activation rule:

            - `inactive`: the rule has not been evaluated yet.

            - `pending`: the rule is applicable and is waiting to be satisfied (e.g. waiting for the payment).

            - `satisfied`: the rule has been satisfied and no longer blocks activation.

            - `declined`: the rule was applicable but was declined.

            - `failed`: the rule could not be satisfied (e.g. the payment failed).

            - `expired`: the rule was not satisfied before its timeout elapsed.

            - `not_applicable`: the rule did not apply to this subscription.'
          example: pending
          enum:
          - inactive
          - pending
          - satisfied
          - declined
          - failed
          - expired
          - not_applicable
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-08-10T00:00:00Z'
          description: The date and time when the rule expires, after which an unsatisfied rule causes the subscription to be canceled. Represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC). Null until the rule starts being evaluated.
        created_at:
          type: string
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The creation date of the activation rule, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
        updated_at:
          type: string
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The last update date of the activation rule, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
