openapi: 3.2.0
info:
  title: Lago API Documentation API
  description: Lago API allows your application to push customer information and metrics (events) from your application to the billing application.
  version: 1.55.0
  license:
    name: AGPLv3
    url: https://github.com/getlago/lago-openapi/blob/main/LICENSE
  contact:
    email: tech@getlago.com
servers:
- url: https://api.getlago.com/api/v1
  description: US Lago cluster
- url: https://api.eu.getlago.com/api/v1
  description: EU Lago cluster
security:
- bearerAuth: []
tags:
- name: Lago API Documentation
paths: {}
webhooks:
  add_on_created:
    post:
      operationId: addOnCreated
      summary: A new add-on has been created
      parameters:
      - $ref: '#/components/parameters/webhook_signature'
      - $ref: '#/components/parameters/webhook_signature_algorithm'
      - $ref: '#/components/parameters/webhook_unique_key'
      requestBody:
        description: Details of the new add-on
        content:
          application/json:
            schema:
              type: object
              required:
              - webhook_type
              - object_type
              - organization_id
              - add_on
              properties:
                webhook_type:
                  type: string
                  enum:
                  - add_on.created
                object_type:
                  type: string
                  enum:
                  - add_on
                organization_id:
                  type: string
                  format: uuid
                  description: Unique identifier of the organization, created by Lago.
                  example: 1a901a90-1a90-1a90-1a90-1a901a901a90
                add_on:
                  $ref: '#/components/schemas/AddOnObject'
      responses:
        '200':
          description: Return a 200 status to indicate that the data was received successfully
      tags:
      - Lago API Documentation
