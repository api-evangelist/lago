components:
  schemas:
    AlertThresholdObject:
      allOf:
      - $ref: '#/components/schemas/AlertThresholdBaseObject'
      - type: object
        required:
        - code
        - value
        - recurring
        properties:
          value:
            type: string
            pattern: ^-?[0-9]+(\.[0-9]+)?$
            description: 'A value that should trigger this alert, formatted as a BigDecimal.


              The unit depends on the alert type: `billable_metric_current_usage_units` and `billable_metric_lifetime_usage_units` are expressed in units, `wallet_credits_balance` and `wallet_credits_ongoing_balance` in credits, and all other types in cents.'
            example: '99.0'
    CreditNoteAppliedTaxObject:
      allOf:
      - $ref: '#/components/schemas/BaseAppliedTax'
      type: object
      properties:
        lago_credit_note_id:
          type: string
          format: uuid
          description: Unique identifier of the credit note, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        base_amount_cents:
          type: integer
          example: 100
    ApplicableUsageThreshold:
      type: object
      required:
      - threshold_display_name
      - amount_cents
      - recurring
      properties:
        threshold_display_name:
          type:
          - string
          - 'null'
          description: The display name of the usage threshold.
          example: Threshold 1
        amount_cents:
          type: integer
          description: The amount to reach to trigger a `progressive_billing` invoice.
          example: 10000
        recurring:
          type: boolean
          description: This field when set to `true` indicates that a `progressive_billing` invoice will be created every time the lifetime usage increases by the specified amount.
          example: true
    CreditNoteItemObject:
      type: object
      required:
      - lago_id
      - amount_cents
      - precise_amount_cents
      - amount_currency
      - fee
      properties:
        lago_id:
          type: string
          format: uuid
          description: The credit note's item unique identifier, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        amount_cents:
          type: integer
          description: The credit note's item amount, expressed in cents.
          example: 100
        precise_amount_cents:
          type: string
          description: The credit note's item amount, expressed in cents, with precision.
          example: '100.0001'
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The credit note's item currency.
          example: EUR
        fee:
          $ref: '#/components/schemas/FeeObject'
          description: The fee object related to the credit note item.
    AlertThresholdBaseObject:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: Code identifying the threshold inside the alert. You set it when you create or update the alert.
          example: warn
        recurring:
          type: boolean
          default: false
          description: This field when set to `true` indicates that the alert will be retriggered when this threshold is reached after the last non-recurring threshold. Only one recurring threshold per alert allowed.
          example: false
    PresentationBreakdownsObject:
      type: array
      description: Array of usage breakdowns split by presentation group keys without affecting pricing or aggregation.
      items:
        type: object
        properties:
          presentation_by:
            type: object
            description: Key value list of event properties used for presentation grouping.
            additionalProperties:
              type: string
          units:
            type: string
            example: '9.0'
            description: The number of units consumed for a specific presentation group.
    CreditNoteErrorDetailsObject:
      type: object
      required:
      - lago_id
      - error_code
      - details
      properties:
        lago_id:
          type: string
          format: uuid
          description: The credit note error details unique identifier, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        error_code:
          type: string
          enum:
          - not_provided
          - tax_error
          - tax_voiding_error
          - invoice_generation_error
          description: The type of the error.
          example: tax_error
        details:
          type: object
          description: The details of the error.
    PlanEntitlementObject:
      type: object
      required:
      - code
      - name
      - description
      - privileges
      properties:
        code:
          type: string
          example: seats
          description: Unique code used to identify the feature. Max 255 characters.
        name:
          type:
          - string
          - 'null'
          example: Number of seats
          description: Name of the feature. Max 255 characters.
        description:
          type:
          - string
          - 'null'
          example: Number of users of the account
          description: Description of the feature. Max 600 characters.
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/PlanEntitlementPrivilegeObject'
          example:
          - code: max
            name: Maximum
            value_type: integer
            config: {}
            value: 10
          - code: max_admins
            name: Max Admins
            value_type: integer
            config: {}
            value: 5
          - code: root
            name: Allow root user
            value_type: boolean
            config: {}
            value: true
          - code: provider
            name: SSO Provider
            value_type: select
