    BillingPeriodObject:
      type: object
      required:
      - lago_subscription_id
      - external_subscription_id
      - lago_plan_id
      - subscription_from_datetime
      - subscription_to_datetime
      - charges_from_datetime
      - charges_to_datetime
      - invoicing_reason
      properties:
        lago_subscription_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the subscription, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_subscription_id:
          type: string
          description: Unique identifier assigned to the subscription in your application.
          example: external_id
        lago_plan_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the plan, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        subscription_from_datetime:
          type: string
          format: date-time
          description: The beginning date of the subscription billing period. This field indicates the start date of the billing period associated with the subscription fee.
          example: '2022-04-29T08:59:51Z'
        subscription_to_datetime:
          type: string
          format: date-time
          description: The ending date of the subscription billing period. This field indicates the end date of the billing period associated with the subscription fee.
          example: '2022-05-29T08:59:51Z'
        charges_from_datetime:
          type: string
          format: date-time
          description: The beginning date of the period that covers the charge fees. It is applicable only to the `charge` fees attached to the subscription. This field indicates the start date of the billing period or subscription period associated with the fees.
          example: '2022-04-29T08:59:51Z'
        charges_to_datetime:
          type: string
          format: date-time
          description: The ending date of the period that covers the charge fees. It is applicable only to the `charge` fees attached to the subscription. This field indicates the end date of the billing period or subscription period associated with the fees.
          example: '2022-05-29T08:59:51Z'
        fixed_charges_from_datetime:
          type:
          - string
          - 'null'
          format: date-time
          description: The beginning date of the period that covers the fixed charge fees. It is `null` when the billing period carries no fixed charge, for example on an `advance_charges` invoice.
          example: '2022-04-29T08:59:51Z'
        fixed_charges_to_datetime:
          type:
          - string
          - 'null'
          format: date-time
          description: The ending date of the period that covers the fixed charge fees. It is `null` when the billing period carries no fixed charge, for example on an `advance_charges` invoice.
          example: '2022-05-29T08:59:51Z'
        invoicing_reason:
          type: string
          enum:
          - subscription_starting
          - subscription_periodic
          - subscription_terminating
          - in_advance_charge
          - in_advance_charge_periodic
          - progressive_billing
          description: The reason explaining why this subscription appears on the invoice.
          example: subscription_starting
    WalletTransactionObjectExtended:
      allOf:
      - $ref: '#/components/schemas/WalletTransactionObject'
      - type: object
        required:
        - wallet
        properties:
          wallet:
            $ref: '#/components/schemas/WalletObject'
    InvoicePaymentDisputeLostObject:
      type: object
      required:
      - invoice
      properties:
        invoice:
          $ref: '#/components/schemas/InvoiceObject'
          description: The invoice whose payment dispute was lost.
        provider_error:
          type: string
          description: The dispute reason reported by the payment provider. This key is omitted when the dispute is marked as lost without a reason, which is the case when the dispute is lost through the API endpoint.
          example: fraudulent
    CustomerCheckoutUrl:
      type: object
      required:
      - lago_customer_id
      - external_customer_id
      - payment_provider
      properties:
        lago_customer_id:
          type: string
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system
        external_customer_id:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
          description: The customer external unique identifier (provided by your own application)
        payment_provider:
          type: string
          example: stripe
          description: The Payment Provider name linked to the Customer.
        payment_provider_code:
          type: string
          description: Code of the payment provider
          example: Stripe Prod
        checkout_url:
          type: string
          example: https://foo.bar
          description: The new generated Payment Provider Checkout URL for the Customer.
    QuoteVersionStatusEnum:
      type: string
      description: "The status of the quote version. It can be any of the following values:\n  - `draft`: the version is still editable.\n  - `approved`: the version has been approved and an order form has been generated from it.\n  - `voided`: the version is no longer actionable.\n\nA quote has at most one version in `draft` or `approved` status at any time; all the other versions are `voided`.\n"
      enum:
      - draft
      - approved
      - voided
      example: draft
    InvoiceCustomSectionObject:
      type: object
      required:
      - lago_id
      - name
      - code
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier for the invoice custom section in the Lago application, generated by Lago to ensure record uniqueness within the system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        name:
          type: string
          description: Name of the invoice custom section.
          example: EU Bank Details
        code:
          type: string
          description: Unique code identifying the invoice custom section for the API request.
          example: eu_bank_details
        description:
          type: string
          description: Internal description of the invoice custom section.
          example: This section contains the bank details for EU customers.
        details:
          type: string
          description: The value shown on the invoice PDF.
          example: 'Bank Name: Lago Bank, IBAN: FR7630004000031234567890143'
        display_name:
          type: string
          description: The name of the invoice custom section displayed on the invoice.
          example: 'Bank Details:'
        applied_to_organization:
          type: boolean
          deprecated: true
          description: '**Deprecated.** This field will be removed in a future version. When set to true, it applies the invoice custom section to the organization''s default billing entity. To apply or remove an invoice custom section from any billing entity (including the default one), please use the `PUT /billing_entities/:code` endpoint instead.'
          example: true
        organization_id:
          type: string
          format: uuid
          description: Unique identifier for the organization associated with the invoice custom section.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        created_at:
          type: string
          format: date-time
          description: Creation date of the tax.
          example: '2023-07-06T14:35:58Z'
    PaymentProviderErrorObject:
      type: object
      required:
      - lago_payment_provider_id
      - payment_provider_name
      - payment_provider_code
      - provider_error
      - source
      - action
      properties:
        lago_payment_provider_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the payment provider within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the payment provider's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        payment_provider_name:
          type: string
          description: The name of the payment provider connection.
          example: Stripe Prod
        payment_provider_code:
          type: string
          description: Code of the payment provider connection.
          example: stripe
        source:
          type: string
          enum:
          - stripe
          description: The payment provider that raised the error.
          example: stripe
        action:
          type: string
          enum:
          - payment_provider.register_webhook
          description: The action that was being performed when the error occurred.
          example: payment_provider.register_webhook
        provider_error:
          description: The error returned by the payment provider. It carries a `message` and a `code` key.
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
    InvoiceBaseObject:
      type: object
      required:
      - lago_id
      - billing_entity_code
      - sequential_id
      - number
      - purchase_order_number
      - issuing_date
      - payment_dispute_lost_at
      - payment_due_date
      - payment_overdue
      - net_payment_term
      - invoice_type
      - status
      - payment_status
      - currency
      - fees_amount_cents
      - coupons_amount_cents
      - credit_notes_amount_cents
      - sub_total_excluding_taxes_amount_cents
      - taxes_amount_cents
      - sub_total_including_taxes_amount_cents
      - prepaid_credit_amount_cents
      - prepaid_granted_credit_amount_cents
      - prepaid_purchased_credit_amount_cents
      - progressive_billing_credit_amount_cents
      - total_amount_cents
      - total_paid_amount_cents
      - total_offsetted_credit_note_amount_cents
      - total_due_amount_cents
      - version_number
      - self_billed
      - file_url
      - xml_url
      - web_url
      - created_at
      - updated_at
      - voided_at
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the invoice within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the invoice's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        billing_entity_code:
          type: string
          example: acme_corp
          description: The unique code of the billing entity the invoice was issued from.
        sequential_id:
          type:
          - integer
          - 'null'
          description: This ID helps in uniquely identifying and organizing the invoices associated with a specific customer. It provides a sequential numbering system specific to the customer, allowing for easy tracking and management of invoices within the customer's context. It is assigned when the invoice is finalized, so it is `null` on draft invoices.
          example: 2
        number:
          type: string
          description: The unique number assigned to the invoice. This number serves as a distinct identifier for the invoice and helps in differentiating it from other invoices in the system.
          example: LAG-1234-001-002
        purchase_order_number:
          type:
          - string
          - 'null'
          example: PO-123
          description: The purchase order number associated with the invoice. It is inherited from the subscription, wallet or wallet transaction the invoice was generated for.
        issuing_date:
          type: string
          format: date
          description: The date when the invoice was issued. It is provided in the ISO 8601 date format.
          example: '2022-04-30'
        payment_dispute_lost_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date when the payment dispute was lost. It is expressed in Coordinated Universal Time (UTC). It is `null` until a dispute is lost on the invoice.
          example: '2022-09-14T16:35:31Z'
        payment_due_date:
          type:
          - string
          - 'null'
          format: date
          description: The payment due date for the invoice, specified in the ISO 8601 date format.
          example: '2022-04-30'
        payment_overdue:
          type: boolean
          description: Specifies if the payment is considered as overdue.
          example: true
        net_payment_term:
          type: integer
          example: 30
          description: The net payment term, expressed in days, specifies the duration within which a customer is expected to remit payment after the invoice is finalized.
        invoice_type:
          type: string
          enum:
          - subscription
          - add_on
          - credit
          - one_off
          - advance_charges
          - progressive_billing
          description: The type of invoice issued. Possible values are `subscription`, `add_on`, `credit`, `one_off`, `advance_charges` or `progressive_billing`.
          example: subscription
        status:
          type: string
          enum:
          - draft
          - finalized
          - voided
          - failed
          - pending
          - deleted
          description: 'The status of the invoice. It indicates the current state of the invoice and can have following values:

            - `draft`: the invoice is in the draft state, waiting for the end of the grace period to be finalized. During this period, events can still be ingested and added to the invoice.

            - `finalized`: the invoice has been issued and finalized. In this state, events cannot be ingested or added to the invoice anymore.

            - `voided`: the invoice has been issued and subsequently voided. In this state, events cannot be ingested or added to the invoice anymore.

            - `pending`: the invoice remains pending until the taxes are fetched from the external provider.

            - `failed`: during an attempt of finalization of the invoice, an error happened. This invoice will have an array of error_details, explaining, in which part of the system an error happened and how it''s possible to fix it. This invoice can''t be edited or updated, only retried. This action will discard current error_details and will create new ones if the finalization failed again.

            - `deleted`: the draft invoice has been permanently deleted. This status is only returned by the delete endpoint and its webhook; a deleted invoice is no longer retrievable afterwards.'
          example: finalized
        payment_status:
          type: string
          enum:
          - pending
          - succeeded
          - failed
          description: 'The status of the payment associated with the invoice. It can have one of the following values:

            - `pending`: the payment is pending, waiting for processing by the payment provider, or the invoice has been issued and its payment status has not been updated through the update endpoint.

            - `succeeded`: the payment of the invoice has been successfully processed.

            - `failed`: the payment of the invoice has failed or encountered an error during processing.'
          example: succeeded
        currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the invoice issued.
          example: EUR
        fees_amount_cents:
          type: integer
          description: The total sum of fees amount in cents. It calculates the cumulative amount of all the fees associated with the invoice, providing a consolidated value.
          example: 100
        coupons_amount_cents:
          type: integer
          description: The total sum of all coupons discounted on the invoice. It calculates the cumulative discount amount applied by coupons, expressed in cents.
          example: 10
        credit_notes_amount_cents:
          type: integer
          description: The total sum of all credit notes discounted on the invoice. It calculates the cumulative discount amount applied by credit notes, expressed in cents.
          example: 10
        sub_total_excluding_taxes_amount_cents:
          type: integer
          description: 'Subtotal amount, excluding taxes, expressed in cents.

            This field depends on the version number. Here are the definitions based on the version:

            - Version 1: is equal to the sum of `fees_amount_cents`, minus `coupons_amount_cents`, and minus `prepaid_credit_amount_cents`.

            - Version 2: is equal to the `fees_amount_cents`.

            - Version 3 & 4: is equal to the `fees_amount_cents`, minus `coupons_amount_cents`.'
          example: 100
        taxes_amount_cents:
          type: integer
          description: The sum of tax amount associated with the invoice, expressed in cents.
          example: 20
        sub_total_including_taxes_amount_cents:
          type: integer
          description: 'Subtotal amount, including taxes, expressed in cents.

            This field depends on the version number. Here are the definitions based on the version:

            - Version 1: is equal to the `total_amount_cents`.

            - Version 2: is equal to the sum of `fees_amount_cents` and `taxes_amount_cents`.

            - Version 3 & 4: is equal to the sum of `sub_total_excluding_taxes_amount_cents` and `taxes_amount_cents`.'
          example: 120
        prepaid_credit_amount_cents:
          type: integer
          description: The total sum of all prepaid credits discounted on the invoice. It calculates the cumulative discount amount applied by prepaid credits, expressed in cents.
          example: 0
        prepaid_granted_credit_amount_cents:
          type:
          - integer
          - 'null'
          description: The portion of prepaid credits discounted on the invoice that originated from granted (free) credits, expressed in cents. Only populated for invoices associated with traceable wallets.
          example: 0
        prepaid_purchased_credit_amount_cents:
          type:
          - integer
          - 'null'
          description: The portion of prepaid credits discounted on the invoice that originated from purchased (paid) credits, expressed in cents. Only populated for invoices associated with traceable wallets.
          example: 0
        progressive_billing_credit_amount_cents:
          type: integer
          description: The usage already billed in previous invoices. Only apply to `progressive_billing` and `subscription` invoices.
          example: 0
        total_amount_cents:
          type: integer
          description: The sum of the amount and taxes amount on the invoice, expressed in cents. It calculates the total financial value of the invoice, including both the original amount and any applicable taxes.
          example: 100
        total_paid_amount_cents:
          type: integer
          description: The amount already paid on the invoice, expressed in cents.
          example: 40
        total_offsetted_credit_note_amount_cents:
          type: integer
          description: The amount of the invoice settled by finalized credit notes, expressed in cents.
          example: 10
        total_due_amount_cents:
          type: integer
          description: The amount still due on the invoice, expressed in cents. It is equal to `total_amount_cents` minus `total_paid_amount_cents` and `total_offsetted_credit_note_amount_cents`, and is `0` for voided invoices.
          example: 50
        version_number:
          type: integer
          example: 3
          description: The version of the invoice calculation rules applied to this invoice. It determines how the subtotals are computed.
        self_billed:
          type: boolean
          example: false
          description: Indicates if the invoice is self-billed. Self-billing is a process where an organization creates the invoice on behalf of the partner. This field specifies whether the invoice is self-billed or not.
        file_url:
          type:
          - string
          - 'null'
          format: uri
          description: Contains the URL that provides direct access to the invoice PDF file. You can use this URL to download or view the PDF document of the invoice. It is `null` while no PDF has been generated, which is the case for draft invoices.
          example: https://getlago.com/invoice/file
        xml_url:
          type:
          - string
          - 'null'
          format: uri
          description: Contains the URL that provides direct access to the e-invoicing XML file. It is `null` while no XML file has been generated for the invoice.
          example: https://getlago.com/invoice/xml
        web_url:
          type:
          - string
          - 'null'
          format: uri
          description: Contains the URL to the invoice page in the Lago dashboard. It is `null` for invoices that are not visible in the dashboard (for example while still generating). Use it to link users directly to the invoice overview page.
          example: https://app.getlago.com/acme/customer/1a901a90-1a90-1a90-1a90-1a901a901a90/invoice/2b012b01-2b01-2b01-2b01-2b012b012b01/overview
        created_at:
          type: string
          format: date-time
          example: '2022-04-29T08:59:51Z'
          description: The date of the invoice creation, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC). It provides a standardized and internationally recognized timestamp for when the invoice object was created.
        updated_at:
          type: string
          format: date-time
          example: '2022-04-29T08:59:51Z'
          description: The date of the invoice update, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC). It provides a standardized and internationally recognized timestamp for when the invoice object was last updated.
        voided_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-04-29T08:59:51Z'
          description: The date when the invoice was voided, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC). It is `null` for invoices that have not been voided.
    AppliedInvoiceCustomSectionObject:
      type: object
      required:
      - lago_id
      - created_at
      - invoice_custom_section
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the applied invoice custom section in the Lago application.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        created_at:
          type: string
          format: date-time
          description: The date of the applied invoice custom section creation, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
          example: '2023-07-06T14:35:58Z'
        invoice_custom_section_id:
          deprecated: true
          type: string
          format: uuid
          description: '**Deprecated.** Unique identifier of the invoice custom section that was applied.'
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        invoice_custom_section:
          $ref: '#/components/schemas/InvoiceCustomSectionObject'
    WalletObject:
      type: object
      required:
      - lago_id
      - lago_customer_id
      - external_customer_id
      - billing_entity_code
      - status
      - currency
      - name
      - code
      - purchase_order_number
      - rate_amount
      - credits_balance
      - credits_ongoing_balance
      - credits_ongoing_usage_balance
      - balance_cents
      - ongoing_balance_cents
      - ongoing_usage_balance_cents
      - consumed_credits
      - created_at
      - expiration_at
      - last_balance_sync_at
      - last_consumed_credit_at
      - terminated_at
      - invoice_requires_successful_payment
      - paid_top_up_min_amount_cents
      - paid_top_up_max_amount_cents
      - priority
      - payment_method
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the wallet within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the wallet's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_customer_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_customer_id:
          type: string
          description: The customer external unique identifier (provided by your own application)
          example: hooli_1234
        billing_entity_code:
          type: string
          example: default
          description: The code of the billing entity associated with the wallet.
        status:
          type: string
          enum:
          - active
          - terminated
          description: The status of the wallet. Possible values are `active` or `terminated`.
          example: active
        currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the wallet.
          example: USD
        name:
          type:
          - string
          - 'null'
          description: The name of the wallet.
          example: Prepaid
        code:
          type:
          - string
          - 'null'
          description: The code of the wallet.
          example: prepaid
        priority:
          type: integer
          minimum: 1
          maximum: 50
          description: 'Wallet priority for ordering when a customer has multiple wallets. Allowed values: 1-50, where 1 is highest priority and 50 is lowest. Defaults to 50. Wallets with the same priority are applied by expiration date, soonest first, with wallets without an expiration date last, then by creation date, oldest first.'
          example: 50
        rate_amount:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          description: The rate of conversion between credits and the amount in the specified currency. It indicates the ratio or factor used to convert credits into the corresponding monetary value in the currency of the transaction.
          example: '1.5'
        credits_balance:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          description: The current wallet balance expressed in credits. This reflects the available balance after all transactions are settled.
          example: '28.0'
        balance_cents:
          type: integer
          description: The current wallet balance expressed in cents. This reflects the available balance after all transactions are settled.
          example: 1000
        consumed_credits:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          description: The number of consumed credits.
          example: '2.0'
        created_at:
          type: string
          format: date-time
          description: The date of the wallet creation, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
          example: '2022-04-29T08:59:51Z'
        expiration_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time that determines when the wallet will expire. It follows the ISO 8601 datetime format and is expressed in Coordinated Universal Time (UTC).
          example: null
        last_balance_sync_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time of the last balance top-up. It follows the ISO 8601 datetime format and is expressed in Coordinated Universal Time (UTC).
          example: '2022-04-29T08:59:51Z'
        last_consumed_credit_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time of the last credits consumption. It follows the ISO 8601 datetime format and is expressed in Coordinated Universal Time (UTC).
          example: '2022-04-29T08:59:51Z'
        terminated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date of termination of the wallet. It follows the ISO 8601 datetime format and is expressed in Coordinated Universal Time (UTC).
          example: '2022-09-14T16:35:31Z'
        invoice_requires_successful_payment:
          type: boolean
          description: A boolean setting that, when set to true, delays issuing an invoice for a wallet top-up until a successful payment is made; if false, the invoice is issued immediately upon wallet top-up, regardless of the payment status. Default value of false.
          example: false
        applies_to:
          type: object
          description: Set wallet limitations to fee types.
          properties:
            fee_types:
              type: array
              items:
                $ref: '#/components/schemas/WalletFeeTypeEnum'
              description: An array of fee types to which the wallet is applicable. By specifying the fee types in this field, you can restrict the wallet's usage to specific fee types only.
              example:
              - charge
            billable_metric_codes:
              type: array
              items:
                type: string
              description: An array of billable metric codes to which the wallet is applicable. By specifying the billable metric codes in this field, you can restrict the wallet's usage to specific metrics only.
              example:
              - bm1
        recurring_transaction_rules:
          description: List of recurring transaction rules. Currently, we only allow one recurring rule per wallet.
          type: array
          items:
            $ref: '#/components/schemas/WalletRecurringTransactionRule'
        ongoing_balance_cents:
          type: integer
          description: The ongoing wallet balance expressed in cents. This represents the `balance_cents` minus the `ongoing_usage_balance_cents`, showing the real time balance after accounting for current usage including taxes.
          example: 800
        ongoing_usage_balance_cents:
          type: integer
          description: The ongoing usage balance of the wallet, expressed in cents. This reflects all current usage and draft invoices including taxes.
          example: 200
        credits_ongoing_balance:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          description: The ongoing wallet balance expressed in credits. This represents the `credits_balance` minus the `credits_ongoing_usage_balance`, showing the real time balance after accounting for current usage including taxes.
          example: '8.0'
        credits_ongoing_usage_balance:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          description: The ongoing usage balance of the wallet, expressed in credits. This reflects all current usage and draft invoices including taxes.
          example: '2.0'
        paid_top_up_min_amount_cents:
          type:
          - integer
          - 'null'
          description: Minimum amount of cents that can be top-up with a single paid transaction.
          example: 100
        paid_top_up_max_amount_cents:
          type:
          - integer
          - 'null'
          description: Maximum amount of cents that can be top-up with a single paid transaction.
          example: 1000
        applied_invoice_custom_sections:
          description: The invoice custom sections applied to invoices generated by this wallet.
          type: array
          items:
            $ref: '#/components/schemas/AppliedInvoiceCustomSectionObject'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodReference'
          description: The payment method assigned to this wallet for processing top-up payments.
        purchase_order_number:
          type:
          - string
          - 'null'
          example: PO-123
          description: The purchase order number associated with the wallet. It will be added to invoices generated for wallet top-ups, unless a more specific purchase order number is set on the wallet transaction or recurring transaction rule that triggered the top-up.
        metadata:
          $ref: '#/components/schemas/MetadataObject'
    PaymentReceiptObject:
      type: object
      required:
      - lago_id
      - created_at
      - number
      - file_url
      - xml_url
      - payment
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the payment receipt, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        created_at:
          type: string
          format: date-time
          description: The date and time when the payment receipt was created. It is expressed in UTC format according to the ISO 8601 datetime standard. This field provides the timestamp for the exact moment when the payment receipt was initially created.
          example: '2022-04-29T08:59:51Z'
        number:
          type: string
          description: The unique number assigned to the payment receipt.
          example: LAG-1234-001-002
        file_url:
          type:
          - string
          - 'null'
          description: The PDF file of the payment receipt. It is `null` while no PDF has been generated.
          example: https://getlago.com/payment_receipt/file
        xml_url:
          type:
          - string
          - 'null'
          description: The e-invoicing XML file of the payment receipt. It is `null` while no XML file has been generated.
          example: https://getlago.com/payment_receipt/xml
        payment:
          $ref: '#/components/schemas/PaymentObject'
    QuoteVersionObject:
      type: object
      required:
      - lago_id
      - lago_quote_id
      - lago_organization_id
      - version
      - status
      - currency
      - billing_entity_code
      - void_reason
      - approved_at
      - voided_at
      - created_at
      - updated_at
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the quote version, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_quote_id:
          type: string
          format: uuid
          description: Unique identifier of the quote the version belongs to, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_organization_id:
          type: string
          format: uuid
          description: Unique identifier of the organization, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        version:
          type: integer
          description: The number of the version within the quote. It starts at 1 and increases by 1 for every new version created by cloning.
          example: 1
        status:
          $ref: '#/components/schemas/QuoteVersionStatusEnum'
        currency:
          $ref: '#/components/schemas/CurrencyOrNull'
          description: The currency the version is quoted in.
        billing_entity_code:
          type:
          - string
          - 'null'
          description: 'Unique code identifying the billing entity that issues the deal. It is resolved rather than stored: the version''s own entity when it names one, then the entity of the subscription being amended for a `subscription_amendment` quote, then the customer''s own. It is `null` when none of them resolves. An amendment cannot name an entity itself, since the subscription it restates is already bound to one, and naming one on an amendment is rejected.'
          example: acme_corp
        void_reason:
          $ref: '#/components/schemas/QuoteVersionVoidReasonEnum'
        approved_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time in UTC (ISO 8601) when the version was approved. It is `null` unless the `status` is `approved`.
          example: '2026-04-29T08:59:51Z'
        voided_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time in UTC (ISO 8601) when the version was voided. It is `null` unless the `status` is `voided`.
          example: '2026-04-29T08:59:51Z'
        created_at:
          type: string
          format: date-time
          description: The date and time in UTC (ISO 8601) when the version was created.
          example: '2026-04-29T08:59:51Z'
        updated_at:
          type: string
          format: date-time
          description: The date and time in UTC (ISO 8601) when the version was last updated.
          example: '2026-04-29T08:59:51Z'
    FeaturePrivilegeObject:
      type: object
      required:
      - code
      - name
      - value_type
      - config
      properties:
        code:
          type: string
          example: max
          description: Unique code for the privilege.
        name:
          type:
          - string
          - 'null'
          example: Maximum
          description: Display name for the privilege.
        value_type:
          type: string
          enum:
          - integer
          - boolean
          - string
          - select
          example: integer
          description: Data type of the privilege value. It defaults to `string`.
        config:
          type: object
          description: Extra configuration of the privilege. It is empty unless the value type is `select`.
          properties:
            select_options:
              type: array
              items:
                type: string
              example:
              - google
              - okta
              description: The values the privilege accepts. It is only sent when the value type is `select`.
    CreditNotePaymentProviderRefundError:
      type: object
      required:
      - lago_credit_note_id
      - lago_customer_id
      - external_customer_id
      - payment_provider
      properties:
        lago_credit_note_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the credit note within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the credit note record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_customer_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_customer_id:
          type: string
          description: The customer external unique identifier (provided by your own application)
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
        provider_customer_id:
          type: string
          description: Unique identifier of the customer within the payment provider
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
        payment_provider:
          type: string
          enum:
          - adyen
          - cashfree
          - gocardless
          - stripe
          description: The type of payment provider code
          example: stripe
        payment_provider_code:
          type: string
          description: Code of the payment provider
          example: Stripe Prod
        provider_error:
          oneOf:
          - type: string
          - type: object
            additionalProperties: true
    PaymentObject:
      type: object
      required:
      - lago_id
      - lago_customer_id
      - external_customer_id
      - invoice_ids
      - invoice_numbers
      - lago_payable_id
      - payable_type
      - amount_cents
      - amount_currency
      - status
      - payment_status
      - type
      - reference
      - payment_provider_code
      - payment_provider_type
      - external_payment_id
      - provider_payment_id
      - provider_customer_id
      - next_action
      - created_at
      properties:
        lago_id:
          type: string
          format: uuid
          description: The unique identifier of the payment, created by Lago.
          example: 4cf085a7-c196-4f07-a543-97c50ec6e8b2
        lago_customer_id:
          type: string
          format: uuid
          description: Unique identifier of the customer, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_customer_id:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
          description: The customer external unique identifier (provided by your own application).
        invoice_ids:
          type: array
          description: List of invoice IDs associated with the payment.
          items:
            type: string
            format: uuid
            example: 486b147a-02a1-4ccf-8603-f3541fc25e7a
        invoice_numbers:
          type: array
          description: List of invoice numbers associated with the payment.
          items:
            type: string
            example: HOO-202D-005-001
        lago_payable_id:
          type: string
          format: uuid
          description: The unique identifier of the paid resource, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        payable_type:
          type: string
          enum:
          - Invoice
          - PaymentRequest
          description: The type of the paid resource, associated with the `lago_payable_id`.
          example: Invoice
        amount_cents:
          type: integer
          description: The amount of the payment in cents.
          example: 1099
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the payment amount.
          example: USD
        status:
          type: string
          description: The status of the payment within the payment provider. It differs from one payment provider to another. It is always `succeeded` for a manual payment.
          example: Completed
        payment_status:
          type: string
          description: The payment status, normalized by Lago so that it is the same for every payment provider.
          enum:
          - succeeded
          - failed
          - pending
          - processing
          example: succeeded
        type:
          type: string
          description: The type of payment.
          enum:
          - manual
          - provider
          example: manual
        reference:
          type:
          - string
          - 'null'
          description: Reference for the payment. Set on manual payments only; it is always `null` for payments collected through a payment provider.
          example: ref1
        payment_provider_code:
          type:
          - string
          - 'null'
          description: Code of the payment provider. It is `null` for manual payments, which are not attached to a payment provider.
          example: stripe_prod
        payment_provider_type:
          type:
          - string
          - 'null'
          enum:
          - null
          - adyen
          - cashfree
          - gocardless
          - stripe
          - flutterwave
          - moneyhash
          description: The type of payment provider. It is `null` for manual payments, which are not attached to a payment provider.
          example: stripe
        external_payment_id:
          type:
          - string
          - 'null'
          deprecated: true
          description: '**Deprecated.** Use `provider_payment_id` instead. It holds the same value.'
          example: pi_5eb0285741bc6ba
        provider_payment_id:
          type:
          - string
          - 'null'
          description: Unique identifier of the payment within the payment provider (if applicable).
          example: pi_5eb0285741bc6ba
        provider_customer_id:
          type:
          - string
          - 'null'
          description: Unique identifier of the customer within the payment provider. It is `null` for manual payments.
          example: cus_5eb0285bcf941bc6ba
        next_action:
          type: object
          additionalProperties: true
          description: The next action to be taken by the customer to complete the payment. Should usually be empty, except when receiving the `payment.requires_action` webhook.
          example:
            type: redirect_to_url
            redirect_to_url:
              url: https://hooks.stripe.com/3d_secure_2/hosted?merchant=acct_AAA&payment_intent=pi_BBB&payment_intent_client_secret=pi_BBB&publishable_key=pk_test_CCC
              return_url: https://app.example.com
        created_at:
          type: string
          format: date-time
          description: Timestamp when the payment was created in Lago's database, not on the payment provider.
          example: '2025-01-21T00:10:29Z'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodObject'
          description: The payment method used for the payment. It is only sent on the `payment.succeeded` webhook, and only when a payment method is attached to the payment.
    AddOnObject:
