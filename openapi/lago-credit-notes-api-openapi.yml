    CreditNoteEstimated:
      type: object
      required:
      - estimated_credit_note
      properties:
        estimated_credit_note:
          type: object
          required:
          - lago_invoice_id
          - invoice_number
          - currency
          - taxes_amount_cents
          - precise_taxes_amount_cents
          - sub_total_excluding_taxes_amount_cents
          - max_creditable_amount_cents
          - max_refundable_amount_cents
          - max_offsettable_amount_cents
          - coupons_adjustment_amount_cents
          - precise_coupons_adjustment_amount_cents
          - taxes_rate
          - items
          properties:
            lago_invoice_id:
              type: string
              format: uuid
              description: Unique identifier assigned to the invoice that the credit note belongs to
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
            invoice_number:
              type: string
              description: The invoice unique number, related to the credit note.
              example: LAG-1234
            currency:
              $ref: '#/components/schemas/Currency'
              description: The currency of the credit note.
              example: EUR
            taxes_amount_cents:
              type: integer
              description: The tax amount of the credit note, expressed in cents.
              example: 20
            precise_taxes_amount_cents:
              type: string
              description: The precise tax amount of the credit note, expressed in cents with decimal precision.
              example: '20.1'
            taxes_rate:
              type: number
              description: The tax rate associated with this specific credit note.
              example: 20
            sub_total_excluding_taxes_amount_cents:
              type: integer
              description: The subtotal of the credit note excluding any applicable taxes, expressed in cents.
              example: 100
            max_creditable_amount_cents:
              type: integer
              description: The maximum amount that can be credited to the customer balance for the requested items, taxes included, expressed in cents.
              example: 100
            max_refundable_amount_cents:
              type: integer
              description: The maximum amount that can be refunded for the requested items, expressed in cents. It is capped by the amount the customer already paid on the invoice, so it is lower than `max_creditable_amount_cents` on an unpaid invoice.
              example: 0
            max_offsettable_amount_cents:
              type: integer
              description: The maximum amount that can be deducted from the invoice balance for the requested items, expressed in cents.
              example: 0
            coupons_adjustment_amount_cents:
              type: integer
              description: The pro-rated amount of the coupons applied to the source invoice.
              example: 20
            precise_coupons_adjustment_amount_cents:
              type: string
              description: The precise pro-rated amount with decimal precision of the coupons applied to the source invoice.
              example: '20.1'
            items:
              type: array
              items:
                type: object
                required:
                - amount_cents
                - lago_fee_id
                properties:
                  amount_cents:
                    type: integer
                    description: The credit note's item amount, expressed in cents.
                    example: 100
                  lago_fee_id:
                    type:
                    - string
                    - 'null'
                    format: uuid
                    description: Unique identifier assigned to the fee within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the fee's record within the Lago system.
                    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              description: Array of credit note's items.
            applied_taxes:
              type: array
              items:
                type: object
                properties:
                  lago_tax_id:
                    type: string
                    format: uuid
                    description: Unique identifier of the tax, created by Lago.
                    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
                  tax_name:
                    type: string
                    description: Name of the tax.
                    example: TVA
                  tax_code:
                    type: string
                    description: Unique code used to identify the tax associated with the API request.
                    example: french_standard_vat
                  tax_rate:
                    type: number
                    description: The percentage rate of the tax
                    example: 20
                  tax_description:
                    type: string
                    description: Internal description of the tax
                    example: French standard VAT
                  base_amount_cents:
                    type: integer
                    example: 100
                  amount_cents:
                    type: integer
                    description: Amount of the tax
                    example: 2000
                  amount_currency:
                    $ref: '#/components/schemas/Currency'
                    description: Currency of the tax
                    example: USD
    PresentationBreakdownsObject:
      type: array
      description: Array of usage breakdowns split by presentation group keys without affecting pricing or aggregation.
      items:
        type: object
        properties:
          presentation_by:
            type: object
            description: Key value list of event properties used for presentation grouping.
            additionalProperties:
              type: string
          units:
            type: string
            example: '9.0'
            description: The number of units consumed for a specific presentation group.
    CreditNoteErrorDetailsObject:
      type: object
      required:
      - lago_id
      - error_code
      - details
      properties:
        lago_id:
          type: string
          format: uuid
          description: The credit note error details unique identifier, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        error_code:
          type: string
          enum:
          - not_provided
          - tax_error
          - tax_voiding_error
          - invoice_generation_error
          description: The type of the error.
          example: tax_error
        details:
          type: object
          description: The details of the error.
    CreditNoteObject:
      type: object
      required:
      - lago_id
      - sequential_id
      - billing_entity_code
      - number
      - lago_invoice_id
      - invoice_number
      - purchase_order_number
      - issuing_date
      - credit_status
      - refund_status
      - reason
      - description
      - currency
      - total_amount_cents
      - precise_total_amount_cents
      - credit_amount_cents
      - refund_amount_cents
      - offset_amount_cents
      - balance_amount_cents
      - taxes_amount_cents
      - precise_taxes_amount_cents
      - taxes_rate
      - sub_total_excluding_taxes_amount_cents
      - coupons_adjustment_amount_cents
      - created_at
      - updated_at
      - file_url
      - xml_url
      - self_billed
      properties:
        lago_id:
          type: string
          format: uuid
          description: The credit note unique identifier, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        billing_entity_code:
          type: string
          example: acme_corp
          description: The unique code of the billing entity associated with the credit note.
        sequential_id:
          type: integer
          description: The sequential identifier of the credit note, specifically scoped on the associated invoice. It provides a unique numerical identifier for the credit note within the context of the invoice.
          example: 2
        number:
          type: string
          description: The credit note unique number.
          example: LAG-1234-CN2
        lago_invoice_id:
          type: string
          format: uuid
          description: Unique identifier assigned to the invoice that the credit note belongs to
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        invoice_number:
          type: string
          description: The invoice unique number, related to the credit note.
          example: LAG-1234
        purchase_order_number:
          type:
          - string
          - 'null'
          example: PO-123
          description: The purchase order number of the invoice the credit note belongs to.
        issuing_date:
          type: string
          format: date
          description: The date of creation of the credit note. It follows the ISO 8601 date format and provides the specific date when the credit note was created.
          example: '2022-12-06'
        credit_status:
          type:
          - string
          - 'null'
          enum:
          - available
          - consumed
          - voided
          - null
          description: 'The status of the credit portion of the credit note. It indicates the current state or condition of the credit amount associated with the credit note. The possible values for this field are:


            - `available`: this status indicates that an amount remains available for future usage. The credit can be applied towards future transactions or invoices.

            - `consumed`: this status indicates that the credit amount has been fully consumed. The remaining amount is 0, indicating that the credit has been utilized in its entirety.

            - `voided`: this status indicates that the remaining amount of the credit cannot be used any further. The credit has been voided and is no longer available for application or redemption.'
          example: available
        refund_status:
          type:
          - string
          - 'null'
          enum:
          - pending
          - succeeded
          - failed
          - null
          description: 'The status of the refund portion of the credit note. It indicates the current state or condition of the refund associated with the credit note. The possible values for this field are:


            - `pending`: this status indicates that the refund is pending execution. The refund request has been initiated but has not been processed or completed yet.

            - `succeeded`: this status indicates that the refund has been successfully executed. The refund amount has been processed and returned to the customer or the designated recipient.

            - `failed`: this status indicates that the refund failed to execute. The refund request encountered an error or unsuccessful processing, and the refund amount could not be returned.'
          example: pending
        reason:
          type: string
          enum:
          - duplicated_charge
          - product_unsatisfactory
          - order_change
          - order_cancellation
          - fraudulent_charge
          - other
          description: 'The reason of the credit note creation.

            Possible values are `duplicated_charge`, `product_unsatisfactory`, `order_change`, `order_cancellation`, `fraudulent_charge` or `other`.'
          example: other
        description:
          type:
          - string
          - 'null'
          description: The description of the credit note.
          example: Free text
        currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the credit note.
          example: EUR
        total_amount_cents:
          type: integer
          description: The total amount of the credit note, expressed in cents.
          example: 120
        precise_total_amount_cents:
          type: string
          description: The total amount of the credit note, expressed in cents, with precision.
          example: '120.0001'
        taxes_amount_cents:
          type: integer
          description: The tax amount of the credit note, expressed in cents.
          example: 20
        precise_taxes_amount_cents:
          type: string
          description: The tax amount of the credit note, expressed in cents, with precision.
          example: '20.0001'
        taxes_rate:
          type: number
          description: The tax rate associated with this specific credit note.
          example: 20
        sub_total_excluding_taxes_amount_cents:
          type: integer
          description: The subtotal of the credit note excluding any applicable taxes, expressed in cents.
          example: 100
        balance_amount_cents:
          type: integer
          description: The remaining credit note amount, expressed in cents.
          example: 100
        credit_amount_cents:
          type: integer
          description: The credited amount of the credit note, expressed in cents.
          example: 100
        refund_amount_cents:
          type: integer
          description: The refunded amount of the credit note, expressed in cents.
          example: 0
        offset_amount_cents:
          type: integer
          description: The offset amount (deducted from the invoice balance) of the credit note, expressed in cents.
          example: 0
        coupons_adjustment_amount_cents:
          type: integer
          description: The pro-rated amount of the coupons applied to the source invoice.
          example: 20
        created_at:
          type: string
          format: date-time
          description: The date when the credit note was created. It is expressed in Coordinated Universal Time (UTC).
          example: '2022-09-14T16:35:31Z'
        updated_at:
          type: string
          format: date-time
          description: The date when the credit note was last updated. It is expressed in Coordinated Universal Time (UTC).
          example: '2022-09-14T16:35:31Z'
        file_url:
          type:
          - string
          - 'null'
          description: The PDF file of the credit note. It is `null` while no PDF has been generated.
          example: https://getlago.com/credit_note/file
        xml_url:
          type:
          - string
          - 'null'
          description: The e-invoicing XML file of the credit note. It is `null` while no XML file has been generated.
          example: https://getlago.com/credit_note/xml
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteItemObject'
          description: Array of credit note's items.
        applied_taxes:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteAppliedTaxObject'
        self_billed:
          type: boolean
          example: false
          description: Indicates if the credit note belongs to self-billed invoice. Self-billing is a process where an organization creates the invoice on behalf of the partner.
        customer:
          $ref: '#/components/schemas/CustomerObject'
        metadata:
          $ref: '#/components/schemas/MetadataObject'
        error_details:
          type: array
          description: The errors raised while the credit note was issued. When the key is present it is always an array, empty when no error was raised.
          items:
            $ref: '#/components/schemas/CreditNoteErrorDetailsObject'
    CreditNotesPaginated:
