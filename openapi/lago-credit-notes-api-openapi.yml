          description: The credit note's item amount, expressed in cents, with precision.
          example: '100.0001'
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The credit note's item currency.
          example: EUR
        fee:
          $ref: '#/components/schemas/FeeObject'
          description: The fee object related to the credit note item.
    IntegrationCustomer:
      type: object
      required:
      - lago_id
      - type
      - external_customer_id
      - integration_code
      - code
      - is_default
      - category
      description: Configuration specific to the accounting and tax integrations. This object contains settings and parameters necessary for syncing documents and payments.
      properties:
        lago_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: A unique identifier for the integration customer object in the Lago application.
        type:
          type: string
          example: netsuite
          description: 'The integration type used for accounting, tax and CRM syncs.

            Accepted values: `netsuite`, `anrok`, `avalara`, `xero`, `hubspot`, `salesforce`.'
          enum:
          - netsuite
          - anrok
          - avalara
          - xero
          - hubspot
          - salesforce
        integration_code:
          type: string
          example: netsuite-eu-1
          description: Unique code used to identify an integration connection.
        code:
          type:
          - string
          - 'null'
          example: netsuite-eu-1
          description: Unique code identifying this integration customer. It defaults to the code of the integration connection.
        is_default:
          type: boolean
          example: true
          description: Whether this integration customer is the default one of its category for the customer.
        category:
          type:
          - string
          - 'null'
          example: accounting
          description: 'The category of the integration connection. It is derived from the integration type.

            Accepted values: `payment`, `tax`, `accounting`, `crm`.'
          enum:
          - payment
          - tax
          - accounting
          - crm
          - null
        external_customer_id:
          type:
          - string
          - 'null'
          example: cus_12345
          description: The customer ID within the integration's system. It is `null` when the customer has not been created in the integration's system yet.
        sync_with_provider:
          type:
          - boolean
          - 'null'
          example: true
          description: Set this field to `true` if you want to create a customer record in the integration's system. This option is applicable only when the `external_customer_id` is null and the `sync_with_provider` field is set to `true`. By default, the value is set to `false`
        subsidiary_id:
          type: string
          example: '2'
          description: This optional field is needed only when working with `netsuite` connection.
        targeted_object:
          type:
          - string
          - 'null'
          example: contacts
          description: This optional field is present only when working with `hubspot` connection.
        email:
          type:
          - string
          - 'null'
          example: dinesh@piedpiper.example
          description: This optional field is present only when working with `hubspot` connection.
