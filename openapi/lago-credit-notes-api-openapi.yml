openapi: 3.2.0
info:
  title: Lago API documentation Credit Notes API
  description: Lago API allows your application to push customer information and metrics (events) from your application to the billing application.
  version: 1.55.0
  license:
    name: AGPLv3
    url: https://github.com/getlago/lago-openapi/blob/main/LICENSE
  contact:
    email: tech@getlago.com
servers:
- url: https://api.getlago.com/api/v1
  description: US Lago cluster
- url: https://api.eu.getlago.com/api/v1
  description: EU Lago cluster
security:
- bearerAuth: []
tags:
- name: credit_notes
  description: Everything about Credit notes collection
  externalDocs:
    description: Find out more
    url: https://getlago.com/docs/api-reference/credit-notes/credit-note-object
paths:
  /credit_notes:
    post:
      tags:
      - credit_notes
      summary: Create a credit note
      description: 'This endpoint creates a new credit note.

        This is a premium feature.'
      operationId: createCreditNote
      requestBody:
        description: Credit note payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditNoteCreateInput'
        required: true
      responses:
        '200':
          description: Credit note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteExtended'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - credit_notes
      summary: List all credit notes
      description: This endpoint lists all existing credit notes.
      operationId: findAllCreditNotes
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/external_customer_id'
      - name: issuing_date_from
        in: query
        description: Filter credit notes starting from a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-07-08'
      - name: issuing_date_to
        in: query
        description: Filter credit notes up to a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-08-09'
      - name: search_term
        in: query
        description: Search credit notes by id, number, customer name, customer external_id or customer email.
        required: false
        explode: true
        schema:
          type: string
          example: Jane
      - name: currency
        in: query
        description: Filter credit notes by currency. Possible values ISO 4217 currency codes.
        required: false
        explode: true
        schema:
          type: string
          example: EUR
      - name: reason
        in: query
        description: Filter credit notes by reasons. Possible values are `product_unsatisfactory`, `order_change`, `order_cancellation`, `fraudulent_charge`, `duplicated_charge` or `other`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - product_unsatisfactory
          - order_change
          - order_cancellation
          - fraudulent_charge
          - duplicated_charge
          - other
      - name: credit_status
        in: query
        description: Filter credit notes by credit status. Possible values are `available`, `consumed` or `voided`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - available
          - consumed
          - voided
      - name: refund_status
        in: query
        description: Filter credit notes by refund status. Possible values are `pending`, `succeeded` or `failed`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - pending
          - succeeded
          - failed
      - name: invoice_number
        in: query
        description: Filter credit notes by their related invoice number.
        required: false
        explode: true
        schema:
          type: string
          example: INV-001-002
      - $ref: '#/components/parameters/purchase_order_number'
      - name: amount_from
        in: query
        description: Filter credit notes of at least a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 9000
      - name: amount_to
        in: query
        description: Filter credit notes up to a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 100000
      - name: types[]
        in: query
        description: Filter credit notes by the kind of amount they carry. `credit` matches credit notes with a credited amount, `refund` those with a refunded amount and `offset` those with an amount deducted from the invoice balance. A credit note can match several types.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - credit
            - refund
            - offset
          example:
          - credit
          - refund
      - name: self_billed
        in: query
        description: Filter credit notes belonging to a self billed invoice. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: billing_entity_codes[]
        in: query
        description: Filter credit notes by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      responses:
        '200':
          description: Credit notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNotesPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /credit_notes/{lago_id}:
    parameters:
    - name: lago_id
      in: path
      description: The credit note unique identifier, created by Lago.
      required: true
      schema:
        type: string
        example: '12345'
    put:
      tags:
      - credit_notes
      summary: Update a credit note
      description: This endpoint updates an existing credit note.
      operationId: updateCreditNote
      requestBody:
        description: Credit note update payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditNoteUpdateInput'
        required: true
      responses:
        '200':
          description: Credit note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteExtended'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - credit_notes
      summary: Retrieve a credit note
      description: This endpoint retrieves an existing credit note.
      operationId: findCreditNote
      responses:
        '200':
          description: Credit note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteExtended'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /credit_notes/{lago_id}/download:
    post:
      tags:
      - credit_notes
      summary: Download a credit note PDF
      description: 'This endpoint downloads the PDF of an existing credit note. Only `finalized` credit notes can be downloaded; any other credit note returns a `404` error.

        When the PDF has already been generated, the credit note object is returned and its `file_url` points to the document. When it has not been generated yet, the response is a `200` with an empty body and the generation starts in the background. Call the endpoint again to get the credit note object with its `file_url`.'
      parameters:
      - name: lago_id
        in: path
        description: The credit note unique identifier, created by Lago.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      operationId: downloadCreditNote
      responses:
        '200':
          description: Credit note PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /credit_notes/estimate:
    post:
      tags:
      - credit_notes
      summary: Estimate amounts for a new credit note
      description: 'This endpoint allows you to retrieve amounts for a new credit note creation.

        This is a premium feature.'
      requestBody:
        description: Credit note estimate payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditNoteEstimateInput'
        required: true
      operationId: estimateCreditNote
      responses:
        '200':
          description: Credit note amounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteEstimated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /credit_notes/{lago_id}/void:
    put:
      tags:
      - credit_notes
      summary: Void available credit
      description: This endpoint voids the available credit linked to a specific credit note.
      parameters:
      - name: lago_id
        in: path
        description: The credit note unique identifier, created by Lago.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      operationId: voidCreditNote
      responses:
        '200':
          description: Credit note voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteExtended'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
  /credit_notes/{lago_id}/metadata:
    post:
      tags:
      - credit_notes
      summary: Replace credit note metadata
      description: 'This endpoint replaces all existing metadata on a credit note with the provided key-value pairs.

        Any existing metadata keys not included in the request will be removed.'
      parameters:
      - name: lago_id
        in: path
        description: The credit note unique identifier, created by Lago.
        required: true
        schema:
          type: string
          format: uuid
          example: 1f615414-ceb0-11f0-94bf-0f2d5b311aba
      operationId: replaceCreditNoteMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditNoteMetadataResponse'
      responses:
        '200':
          description: Credit note metadata replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags:
      - credit_notes
      summary: Merge credit note metadata
      description: 'This endpoint merges the provided metadata with existing metadata on the credit note.

        Existing keys not in the request are preserved. New keys are added, existing keys are updated.'
      parameters:
      - name: lago_id
        in: path
        description: The credit note unique identifier, created by Lago.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      operationId: mergeCreditNoteMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditNoteMetadataResponse'
      responses:
        '200':
          description: Credit note metadata merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - credit_notes
      summary: Delete all credit note metadata
      description: This endpoint removes all metadata from a credit note.
      parameters:
      - name: lago_id
        in: path
        description: The credit note unique identifier, created by Lago.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      operationId: deleteAllCreditNoteMetadata
      responses:
        '200':
          description: Credit note metadata deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /credit_notes/{lago_id}/metadata/{key}:
    delete:
      tags:
      - credit_notes
      summary: Delete a metadata key
      description: This endpoint removes a single metadata key from a credit note.
      parameters:
      - name: lago_id
        in: path
        description: The credit note unique identifier, created by Lago.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      - name: key
        in: path
        description: The metadata key to delete.
        required: true
        schema:
          type: string
          example: external_id
      operationId: deleteCreditNoteMetadataKey
      responses:
        '200':
          description: Metadata key deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNoteMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/credit_notes:
    get:
      tags:
      - credit_notes
      summary: List all customer's credit notes
      description: This endpoint lists all existing credit notes for a customer.
      operationId: findAllCustomerCreditNotes
      parameters:
      - $ref: '#/components/parameters/external_customer_id_path'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: issuing_date_from
        in: query
        description: Filter credit notes starting from a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-07-08'
      - name: issuing_date_to
        in: query
        description: Filter credit notes up to a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-08-09'
      - name: search_term
        in: query
        description: Search credit notes by id, number, customer name, customer external_id or customer email.
        required: false
        explode: true
        schema:
          type: string
          example: Jane
      - name: currency
        in: query
        description: Filter credit notes by currency. Possible values ISO 4217 currency codes.
        required: false
        explode: true
        schema:
          type: string
          example: EUR
      - name: reason
        in: query
        description: Filter credit notes by reasons. Possible values are `product_unsatisfactory`, `order_change`, `order_cancellation`, `fraudulent_charge`, `duplicated_charge` or `other`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - product_unsatisfactory
          - order_change
          - order_cancellation
          - fraudulent_charge
          - duplicated_charge
          - other
      - name: credit_status
        in: query
        description: Filter credit notes by credit status. Possible values are `available`, `consumed` or `voided`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - available
          - consumed
          - voided
      - name: refund_status
        in: query
        description: Filter credit notes by refund status. Possible values are `pending`, `succeeded` or `failed`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - pending
          - succeeded
          - failed
      - name: invoice_number
        in: query
        description: Filter credit notes by their related invoice number.
        required: false
        explode: true
        schema:
          type: string
          example: INV-001-002
      - $ref: '#/components/parameters/purchase_order_number'
      - name: amount_from
        in: query
        description: Filter credit notes of at least a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 9000
      - name: amount_to
        in: query
        description: Filter credit notes up to a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 100000
      - name: types[]
        in: query
        description: Filter credit notes by the kind of amount they carry. `credit` matches credit notes with a credited amount, `refund` those with a refunded amount and `offset` those with an amount deducted from the invoice balance. A credit note can match several types.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - credit
            - refund
            - offset
          example:
          - credit
          - refund
      - name: self_billed
        in: query
        description: Filter credit notes belonging to a self billed invoice. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: billing_entity_codes[]
        in: query
        description: Filter credit notes by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      responses:
        '200':
          description: Credit notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNotesPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
