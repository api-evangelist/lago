openapi: 3.2.0
info:
  title: Lago API documentation Payment Requests API
  description: Lago API allows your application to push customer information and metrics (events) from your application to the billing application.
  version: 1.55.0
  license:
    name: AGPLv3
    url: https://github.com/getlago/lago-openapi/blob/main/LICENSE
  contact:
    email: tech@getlago.com
servers:
- url: https://api.getlago.com/api/v1
  description: US Lago cluster
- url: https://api.eu.getlago.com/api/v1
  description: EU Lago cluster
security:
- bearerAuth: []
tags:
- name: payment_requests
  description: Everything about PaymentRequests
  externalDocs:
    description: Find out more
    url: https://getlago.com/docs/api-reference/payment-requests/payment-request-object
paths:
  /customers/{external_customer_id}/payment_requests:
    get:
      tags:
      - payment_requests
      summary: List all customer's payment requests
      description: This endpoint is used to list all existing payment requests of a customer.
      operationId: findAllCustomerPaymentRequests
      parameters:
      - $ref: '#/components/parameters/external_customer_id_path'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/currency'
      - $ref: '#/components/parameters/payment_status'
      - name: billing_entity_codes[]
        in: query
        description: Filter payment requests by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      responses:
        '200':
          description: Payment requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /payment_requests:
    post:
      tags:
      - payment_requests
      summary: Create a payment request
      description: This endpoint is used to create a payment request to collect the payment of the overdue invoices of a customer.
      operationId: createPaymentRequest
      requestBody:
        description: Payment request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequestCreateInput'
        required: true
      responses:
        '200':
          description: Payment request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - payment_requests
      summary: List all payment requests
      description: This endpoint is used to list all existing payment requests.
      operationId: findAllPaymentRequests
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/currency'
      - $ref: '#/components/parameters/external_customer_id'
      - $ref: '#/components/parameters/payment_status'
      - name: billing_entity_codes[]
        in: query
        description: Filter payment requests by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      responses:
        '200':
          description: Payment requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /payment_requests/{lago_id}:
    parameters:
    - name: lago_id
      in: path
      description: Unique identifier of the payment request.
      required: true
      schema:
        type: string
        format: uuid
        example: f4a842d6-4bde-11ec-81d3-0242ac130003
    get:
      tags:
      - payment_requests
      summary: Retrieve a payment request
      description: This endpoint retrieves a specific payment request by its ID.
      operationId: findPaymentRequest
      responses:
        '200':
          description: Payment request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
