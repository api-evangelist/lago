        code:
          type: string
          description: Unique code used to identify the tax associated with the API request.
          example: french_standard_vat
        description:
          type:
          - string
          - 'null'
          description: Internal description of the tax.
          example: French standard VAT
        rate:
          type: number
          description: The percentage rate of the tax.
          example: 20
        applied_to_organization:
          type: boolean
          deprecated: true
          description: '**Deprecated.** This field will be removed in a future version. When set to true, it applies the tax to the organization''s default billing entity. To apply or remove a tax from any billing entity (including the default one), please use the `PUT /billing_entities/:code` endpoint instead.'
          example: true
        applied_to_billing_entities_codes:
          type: array
          items:
            type: string
          description: The codes of the billing entities the tax is applied to, sorted alphabetically. It is empty when the tax is only attached to customers. This field is only returned by the tax endpoints, not by taxes nested in another object.
          example:
          - acme_corp
          - foo_bar
        created_at:
          type: string
          format: date-time
          description: Creation date of the tax.
          example: '2023-07-06T14:35:58Z'
    PaymentMethodReference:
      type: object
      description: Reference to a specific payment method for processing the payment.
      properties:
        payment_method_type:
          type: string
          enum:
          - provider
          - manual
          description: The type of payment method to use.
          example: provider
        payment_method_id:
          type: string
          format: uuid
          description: The unique identifier of the payment method (required when using a specific provider payment method).
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    CustomerProjectedChargeGroupedUsageObject:
      type: array
      description: Array of aggregated fees, grouped by the event properties defined in a `standard` charge model.
      items:
        type: object
        required:
        - amount_cents
        - projected_amount_cents
        - events_count
        - units
        - projected_units
        - grouped_by
        properties:
          amount_cents:
            type: integer
            example: 1000
            description: The amount in cents, tax excluded, consumed for a specific group related to a charge item.
          projected_amount_cents:
            type: integer
            example: 2000
            description: The projected amount in cents, tax excluded, that can be consumed for a specific group related to a charge item.
          events_count:
            type: integer
            example: 10
            description: The quantity of usage events that have been recorded for a particular charge during the specified time period. These events may also be referred to as the number of transactions in some contexts.
          units:
            type: string
            pattern: ^[0-9]+.?[0-9]*$
            example: '0.9'
            description: The number of units consumed for a specific group related to a charge item.
          projected_units:
            type: string
            pattern: ^[0-9]+.?[0-9]*$
            example: '1.8'
            description: The projected number of units that can be consumed for a specific group related to a charge item.
          pricing_unit_details:
            $ref: '#/components/schemas/UsagePricingUnitDetailsObject'
          grouped_by:
            type: object
            description: Key value list of event properties aggregated by the charge model
            additionalProperties:
              type: string
          filters:
            $ref: '#/components/schemas/CustomerProjectedChargeFiltersUsageObject'
          presentation_breakdowns:
            $ref: '#/components/schemas/PresentationBreakdownsObject'
          projected_presentation_breakdowns:
            $ref: '#/components/schemas/PresentationBreakdownsObject'
    CustomerChargeUsageObject:
      type: object
      required:
      - units
      - total_aggregated_units
      - events_count
      - amount_cents
      - amount_currency
      - charge
      - billable_metric
      properties:
        units:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          example: '1.0'
          description: The number of units consumed by the customer for a specific charge item.
        total_aggregated_units:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          example: '1.0'
          description: The total number of units consumed by the customer for a specific charge item, aggregated across all usage events.
        events_count:
          type: integer
          example: 10
          description: The quantity of usage events that have been recorded for a particular charge during the specified time period. These events may also be referred to as the number of transactions in some contexts.
        amount_cents:
          type: integer
          example: 123
          description: The amount in cents, tax excluded, consumed by the customer for a specific charge item.
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of a usage item consumed by the customer.
          example: EUR
        pricing_unit_details:
          $ref: '#/components/schemas/UsagePricingUnitDetailsObject'
        charge:
          type: object
          description: Object listing all the properties for a specific charge item.
          required:
          - lago_id
          - code
          - charge_model
          properties:
            lago_id:
              type: string
              format: uuid
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              description: Unique identifier assigned to the charge within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the charge's record within the Lago system.
            code:
              type: string
              example: storage
              description: The code of the charge, unique within the plan.
            charge_model:
              $ref: '#/components/schemas/ChargeModelEnum'
            invoice_display_name:
              type:
              - string
              - 'null'
              description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the name of the actual charge will be used as the default display name.
              example: Setup
        billable_metric:
          type: object
          description: The related billable metric object.
          required:
          - lago_id
          - name
          - code
          - aggregation_type
          properties:
            lago_id:
              type: string
              format: uuid
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              description: Unique identifier assigned to the billable metric within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the billable metric's record within the Lago system.
            name:
              type: string
              example: Storage
              description: The name of the billable metric used for this charge.
            code:
              type: string
              example: storage
              description: The code of the billable metric used for this charge.
            aggregation_type:
              type: string
              description: The aggregation type of the billable metric used for this charge.
              enum:
              - count_agg
              - sum_agg
              - max_agg
              - unique_count_agg
              - weighted_sum_agg
              - latest_agg
              example: sum_agg
        filters:
          $ref: '#/components/schemas/CustomerChargeFiltersUsageObject'
        grouped_usage:
          $ref: '#/components/schemas/CustomerChargeGroupedUsageObject'
        presentation_breakdowns:
          $ref: '#/components/schemas/PresentationBreakdownsObject'
