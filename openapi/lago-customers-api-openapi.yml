openapi: 3.2.0
info:
  title: Lago API documentation Customers API
  description: Lago API allows your application to push customer information and metrics (events) from your application to the billing application.
  version: 1.55.0
  license:
    name: AGPLv3
    url: https://github.com/getlago/lago-openapi/blob/main/LICENSE
  contact:
    email: tech@getlago.com
servers:
- url: https://api.getlago.com/api/v1
  description: US Lago cluster
- url: https://api.eu.getlago.com/api/v1
  description: EU Lago cluster
security:
- bearerAuth: []
tags:
- name: Customers
  description: Everything about Customer collection
  externalDocs:
    description: Find out more
    url: https://getlago.com/docs/api-reference/customers/object
paths:
  /customers:
    post:
      tags:
      - Customers
      summary: Create a customer
      description: This endpoint creates a customer. When a customer with the same `external_id` already exists, it is updated instead, and only the fields present in the payload are changed.
      operationId: createCustomer
      requestBody:
        description: Customer payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateInput'
        required: true
      responses:
        '200':
          description: Customer created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - Customers
      summary: List all customers
      description: This endpoint retrieves all existing customers.
      operationId: findAllCustomers
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: external_id
        in: query
        description: Filter customers by external ID.
        required: false
        schema:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
      - name: account_type[]
        in: query
        description: Filter customers by account type.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - customer
            - partner
          example:
          - customer
          - partner
      - name: billing_entity_codes[]
        in: query
        description: Filter customers by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      - name: search_term
        in: query
        description: Filter customers by search term. This will filter all customers whose name, firstname, lastname, legal name, external id or email contain the search term.
        required: false
        schema:
          type: string
          example: John Doe
      - name: countries[]
        in: query
        description: Filter customers by countries. Possible values are the ISO 3166-1 alpha-2 codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Country'
          example:
          - US
          - FR
      - name: states[]
        in: query
        description: Filter customers by states.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - CA
          - Paris
      - name: zipcodes[]
        in: query
        description: Filter customers by zipcodes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - '10115'
          - '75001'
      - name: currencies[]
        in: query
        description: Filter customers by currencies.
        required: false
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/Currency'
          example:
          - USD
          - EUR
      - name: has_tax_identification_number
        in: query
        description: Filter customers by whether they have a tax identification number or not.
        required: false
        schema:
          type: boolean
          example: true
      - name: metadata[key]
        in: query
        description: Filter customers by metadata. Replace `key` with the actual metadata key you want to match, and provide the corresponding value. Providing empty value will search for customers without given metadata key. For example, `metadata[is_synced]=true&metadata[last_synced_at]=`.
        required: false
        explode: true
        schema:
          type: string
          example: value
      - name: customer_type
        in: query
        description: Filter customers by customer type.
        required: false
        schema:
          type: string
          enum:
          - company
          - individual
          example: company
      - name: has_customer_type
        in: query
        description: Filter customers by whether they have a customer type or not.
        required: false
        schema:
          type: boolean
          example: true
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomersPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}:
    parameters:
    - name: external_customer_id
      in: path
      description: The customer external unique identifier (provided by your own application)
      required: true
      schema:
        type: string
        example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
    get:
      tags:
      - Customers
      summary: Retrieve a customer
      description: This endpoint retrieves an existing customer.
      operationId: findCustomer
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Customers
      summary: Delete a customer
      description: This endpoint deletes an existing customer.
      operationId: destroyCustomer
      responses:
        '200':
          description: Customer deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/applied_coupons:
    get:
      tags:
      - Customers
      summary: List all customer's applied coupons
      description: This endpoint is used to list all applied coupons for a customer.
      operationId: findAllCustomerAppliedCoupons
      parameters:
      - $ref: '#/components/parameters/external_customer_id_path'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: status
        in: query
        description: The status of the coupon. Can be either `active` or `terminated`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - active
          - terminated
          example: active
      - name: coupon_code[]
        in: query
        description: The code of the coupon applied to the customer. Use it to filter applied coupons by their code.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - BLACK_FRIDAY_2024
          - CHRISTMAS_2024
      responses:
        '200':
          description: Applied Coupons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppliedCouponsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/applied_coupons/{applied_coupon_id}:
    delete:
      tags:
      - Customers
      summary: Delete an applied coupon
      description: This endpoint is used to delete a specific coupon that has been applied to a customer.
      parameters:
      - $ref: '#/components/parameters/external_customer_id_path'
      - name: applied_coupon_id
        in: path
        description: Unique identifier of the applied coupon, created by Lago.
        required: true
        explode: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      operationId: deleteAppliedCoupon
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppliedCoupon'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/credit_notes:
    get:
      tags:
      - Customers
      summary: List all customer's credit notes
      description: This endpoint lists all existing credit notes for a customer.
      operationId: findAllCustomerCreditNotes
      parameters:
      - $ref: '#/components/parameters/external_customer_id_path'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: issuing_date_from
        in: query
        description: Filter credit notes starting from a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-07-08'
      - name: issuing_date_to
        in: query
        description: Filter credit notes up to a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-08-09'
      - name: search_term
        in: query
        description: Search credit notes by id, number, customer name, customer external_id or customer email.
        required: false
        explode: true
        schema:
          type: string
          example: Jane
      - name: currency
        in: query
        description: Filter credit notes by currency. Possible values ISO 4217 currency codes.
        required: false
        explode: true
        schema:
          type: string
          example: EUR
      - name: reason
        in: query
        description: Filter credit notes by reasons. Possible values are `product_unsatisfactory`, `order_change`, `order_cancellation`, `fraudulent_charge`, `duplicated_charge` or `other`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - product_unsatisfactory
          - order_change
          - order_cancellation
          - fraudulent_charge
          - duplicated_charge
          - other
      - name: credit_status
        in: query
        description: Filter credit notes by credit status. Possible values are `available`, `consumed` or `voided`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - available
          - consumed
          - voided
      - name: refund_status
        in: query
        description: Filter credit notes by refund status. Possible values are `pending`, `succeeded` or `failed`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - pending
          - succeeded
          - failed
      - name: invoice_number
        in: query
        description: Filter credit notes by their related invoice number.
        required: false
        explode: true
        schema:
          type: string
          example: INV-001-002
      - $ref: '#/components/parameters/purchase_order_number'
      - name: amount_from
        in: query
        description: Filter credit notes of at least a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 9000
      - name: amount_to
        in: query
        description: Filter credit notes up to a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 100000
      - name: types[]
        in: query
        description: Filter credit notes by the kind of amount they carry. `credit` matches credit notes with a credited amount, `refund` those with a refunded amount and `offset` those with an amount deducted from the invoice balance. A credit note can match several types.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - credit
            - refund
            - offset
          example:
          - credit
          - refund
      - name: self_billed
        in: query
        description: Filter credit notes belonging to a self billed invoice. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: billing_entity_codes[]
        in: query
        description: Filter credit notes by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      responses:
        '200':
          description: Credit notes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNotesPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/invoices:
    get:
      tags:
      - Customers
      summary: List all customer's invoices
      description: This endpoint is used for retrieving all invoices of a customer.
      operationId: findAllCustomerInvoices
      parameters:
      - $ref: '#/components/parameters/external_customer_id_path'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: amount_from
        in: query
        description: Filter invoices of at least a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 9000
      - name: amount_to
        in: query
        description: Filter invoices up to a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 100000
      - name: issuing_date_from
        in: query
        description: Filter invoices starting from a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-07-08'
      - name: issuing_date_to
        in: query
        description: Filter invoices up to a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-08-09'
      - name: status
        in: query
        description: Filter invoices by status. Possible values are `draft`, `failed`, `finalized`, `pending` and `voided`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - draft
          - finalized
          - failed
          - pending
          - voided
      - name: statuses[]
        in: query
        description: Filter invoices by statuses. Possible values are `draft`, `failed`, `finalized`, `pending` and `voided`.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - draft
            - finalized
            - failed
            - pending
            - voided
      - name: payment_status
        in: query
        description: Filter invoices by payment status. Possible values are `pending`, `failed` or `succeeded`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - pending
          - failed
          - succeeded
      - name: payment_statuses[]
        in: query
        description: Filter invoices by payment statuses. Possible values are `pending`, `failed` or `succeeded`.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - pending
            - failed
            - succeeded
      - name: payment_overdue
        in: query
        description: Filter invoices by payment_overdue. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: search_term
        in: query
        description: Search the customer's invoices by id or number. Customer attributes are not searched here, because the list is already scoped to one customer.
        required: false
        explode: true
        schema:
          type: string
          example: Jane
      - name: payment_dispute_lost
        in: query
        description: Filter invoices with a payment dispute lost. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: invoice_type
        in: query
        description: Filter invoices by invoice type. Possible values are `subscription`, `add_on`, `credit`, `one_off`, `advance_charges` or `progressive_billing`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - subscription
          - add_on
          - credit
          - one_off
          - advance_charges
          - progressive_billing
      - name: self_billed
        in: query
        description: Filter invoices by self billed. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: currency
        in: query
        description: Filter invoices by currency. Possible values ISO 4217 currency codes.
        required: false
        explode: true
        schema:
          type: string
          example: EUR
      - name: partially_paid
        in: query
        description: Filter invoices that are partially paid. When `true`, only invoices with a non-zero amount paid that is below the total due are returned. When `false`, those invoices are excluded.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: settlements[]
        in: query
        description: Filter invoices settled by at least one of the given settlement types. `payment` matches invoices settled by a payment, `credit_note` matches invoices settled by a credit note.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - payment
            - credit_note
          example:
          - payment
          - credit_note
      - name: billing_entity_codes[]
        in: query
        description: Filter invoices by billing entity codes. Possible values are the billing entity codes you have created.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - acme_corp
          - foo_bar
      - name: metadata[key]
        in: query
        description: Filter invoices by metadata. Replace `key` with the actual metadata key you want to match, and provide the corresponding value. Providing empty value will search for invoice without given metadata key. For example, `metadata[color]=blue`.
        required: false
        explode: true
        schema:
          type: string
          example: someValue
      - $ref: '#/components/parameters/purchase_order_number'
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicesPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /customers/{external_customer_id}/payments:
    get:
      tags:
      - Customers
      summary: List all customer's payments
      description: This endpoint is used to list all payments of a customer
      operationId: findAllCustomerPayments
      parameters:
      - $ref: '#/components/parameters/external_customer_id_path'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: invoice_id
        in: query
        description: Unique identifier assigned to the invoice within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the invoice's record within the Lago system.
        required: false
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /customers/{external_customer_id}/payment_requests:
    get:
      tags:
      - Customers
      summary: List all customer's payment requests
      description: This endpoint is used to list all existing payment requests of a customer.
      operationId: findAllCustomerPaymentRequests
      parameters:
      - $ref: '#/components/parameters/external_customer_id_path'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/currency'
      - $ref: '#/components/parameters/payment_status'
      - name: billing_entity_codes[]
        in: query
        description: Filter payment requests by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      responses:
        '200':
          description: Payment requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequestsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/portal_url:
    get:
      tags:
      - Customers
      summary: Get a customer portal URL
      description: 'Retrieves an embeddable link for displaying a customer portal.


        This endpoint allows you to fetch the URL that can be embedded to provide customers access to a dedicated portal.


        The portal lets the customer update their information and top up their wallets, so when API key permissions are enabled, the API key needs the `write` permission on `customer`.'
      parameters:
      - name: external_customer_id
        in: path
        description: External ID of the existing customer
        required: true
        schema:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
      operationId: getCustomerPortalUrl
      responses:
        '200':
          description: Portal URL
          content:
            application/json:
              schema:
                type: object
                required:
                - customer
                properties:
                  customer:
                    type: object
                    required:
                    - portal_url
                    properties:
                      portal_url:
                        type: string
                        example: https://app.lago.com/customer-portal/1234567890
                        description: An embeddable link for displaying a customer portal
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/subscriptions:
    get:
      tags:
      - Customers
      summary: List all customer's subscriptions
      description: This endpoint retrieves all active subscriptions for a customer.
      operationId: findAllCustomerSubscriptions
      parameters:
      - $ref: '#/components/parameters/external_customer_id_path'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/currency'
      - name: external_id
        in: query
        description: The subscription external unique identifier (provided by your own application).
        required: false
        schema:
          type: string
          example: subscription_premium
      - name: plan_code
        in: query
        description: The unique code representing the plan to be attached to the customer. This code must correspond to the code property of one of the active plans.
        required: false
        explode: true
        schema:
          type: string
          example: premium
      - name: overridden
        in: query
        description: When set, filters subscriptions by whether their plan is an override of a parent plan. `true` returns only subscriptions on overridden plans; `false` returns only those on standard (non-overridden) plans.
        required: false
        schema:
          type: boolean
          example: true
      - name: status[]
        in: query
        description: 'If the field is not defined, Lago will return only `active` subscriptions. However, if you wish to fetch subscriptions by different status you can define them in a status[] query param. Available filter values: `pending`, `canceled`, `terminated`, `active`, `incomplete`.'
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - pending
            - canceled
            - terminated
            - active
            - incomplete
          example:
          - active
          - pending
      - name: billing_entity_codes[]
        in: query
        description: Filter subscriptions by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      responses:
        '200':
          description: List of subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/current_usage:
    get:
      tags:
      - Customers
      summary: Retrieve customer current usage
      description: This endpoint enables the retrieval of the usage-based billing data for a customer within the current period.
      parameters:
      - name: external_customer_id
        in: path
        description: The customer external unique identifier (provided by your own application).
        required: true
        schema:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
      - name: external_subscription_id
        in: query
        description: The unique identifier of the subscription within your application.
        required: true
        explode: true
        schema:
          type: string
          example: sub_1234567890
      - name: apply_taxes
        in: query
        description: 'Optional flag to determine if taxes should be applied. Defaults to `true` if not provided or if null.

          '
        required: false
        schema:
          type: boolean
          default: true
          example: true
      - name: charge_id
        in: query
        description: Filter usage to a specific charge by its Lago ID (UUID). Replaces deprecated `filter_by_charge_id`.
        required: false
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      - name: charge_code
        in: query
        description: Filter usage to a specific charge by its code. Replaces deprecated `filter_by_charge_code`.
        required: false
        schema:
          type: string
          example: storage
      - name: billable_metric_code
        in: query
        description: Filter usage to a specific billable metric by its code.
        required: false
        schema:
          type: string
          example: storage
      - name: group
        in: query
        description: 'Filter usage by pricing group. Pass key/value pairs as query parameters, e.g. `group[cloud]=aws`. Replaces deprecated `filter_by_group`.

          '
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties:
            type: string
          example:
            cloud: aws
      - name: filter_by_charge_id
        in: query
        description: '**Deprecated.** Filter usage to a specific charge by its Lago ID (UUID).'
        required: false
        deprecated: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      - name: filter_by_charge_code
        in: query
        description: '**Deprecated.** Filter usage to a specific charge by its code.'
        required: false
        deprecated: true
        schema:
          type: string
          example: storage
      - name: filter_by_group
        in: query
        description: '**Deprecated.** Filter usage by pricing group. Pass key/value pairs as query parameters, e.g. `filter_by_group[cloud]=aws`.

          '
        required: false
        deprecated: true
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties:
            type: string
          example:
            cloud: aws
      - name: full_usage
        in: query
        description: 'When `true`, returns usage since the subscription started instead of the current billing period. It requires the granular lifetime usage add-on, at least one of `charge_id`, `charge_code`, `billable_metric_code` or `group` (or their deprecated `filter_by_*` equivalents), and a subscription without prorated charges. The request returns `405` when one of these conditions is not met.

          '
        required: false
        schema:
          type: boolean
          default: false
          example: true
      - name: filter_by_presentation
        in: query
        description: 'Filter `presentation_breakdowns` by a JSON-encoded array of presentation group key values. Only breakdowns matching the provided values will be returned. Pass an empty array to disable `presentation_breakdowns` entirely.

          '
        required: false
        schema:
          type: string
          example: '["engineering", "operations"]'
      operationId: findCustomerCurrentUsage
      responses:
        '200':
          description: Customer usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
  /customers/{external_customer_id}/projected_usage:
    get:
      tags:
      - Customers
      summary: Retrieve customer current and projected usage
      description: This endpoint enables the retrieval of the usage-based billing data for a customer within the current period. It also returns the projected usage for the current period based on the current usage.
      parameters:
      - name: external_customer_id
        in: path
        description: The customer external unique identifier (provided by your own application).
        required: true
        schema:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
      - name: external_subscription_id
        in: query
        description: The unique identifier of the subscription within your application.
        required: true
        explode: true
        schema:
          type: string
          example: sub_1234567890
      - name: apply_taxes
        in: query
        description: 'Optional flag to determine if taxes should be applied. Defaults to `true` if not provided or if null.

          '
        required: false
        schema:
          type: boolean
          default: true
          example: true
      - name: charge_id
        in: query
        description: Filter usage to a specific charge by its Lago ID (UUID).
        required: false
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      - name: charge_code
        in: query
        description: Filter usage to a specific charge by its code.
        required: false
        schema:
          type: string
          example: storage
      - name: billable_metric_code
        in: query
        description: Filter usage to a specific billable metric by its code.
        required: false
        schema:
          type: string
          example: storage
      - name: group
        in: query
        description: 'Filter usage by pricing group. Pass key/value pairs as query parameters, e.g. `group[cloud]=aws`.

          '
        required: false
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties:
            type: string
          example:
            cloud: aws
      - name: filter_by_presentation
        in: query
        description: 'Filter `presentation_breakdowns` by a JSON-encoded array of presentation group key values. Only breakdowns matching the provided values will be returned. Pass an empty array to disable `presentation_breakdowns` entirely.

          '
        required: false
        schema:
          type: string
          example: '["engineering", "operations"]'
      operationId: findCustomerProjectedUsage
      responses:
        '200':
          description: Customer usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProjectedUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
  /customers/{external_customer_id}/past_usage:
    get:
      tags:
      - Customers
      summary: Retrieve customer past usage
      description: This endpoint enables the retrieval of the usage-based billing data for a customer within past periods.
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: external_customer_id
        in: path
        description: The customer external unique identifier (provided by your own application).
        required: true
        schema:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
      - name: external_subscription_id
        in: query
        description: The unique identifier of the subscription within your application.
        required: true
        explode: true
        schema:
          type: string
          example: sub_1234567890
      - name: billable_metric_code
        in: query
        description: Billable metric code filter to apply to the charge usage
        required: false
        explode: true
        schema:
          type: string
          example: cpu
      - name: periods_count
        in: query
        description: Number of past billing period to returns in the result
        required: false
        explode: true
        schema:
          type: integer
          example: 5
      operationId: findAllCustomerPastUsage
      responses:
        '200':
          description: Customer past usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPastUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /customers/{external_customer_id}/checkout_url:
    post:
      tags:
      - Customers
      summary: Generate a Customer Payment Provider Checkout URL
      description: This endpoint regenerates the Payment Provider Checkout URL of a Customer.
      parameters:
      - name: external_customer_id
        in: path
        description: The customer external unique identifier (provided by your own application).
        required: true
        schema:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
      operationId: generateCustomerCheckoutURL
      responses:
        '200':
          description: Customer Checkout URL
          content:
            application/json:
              schema:
                type: object
                required:
                - customer
                properties:
                  customer:
                    $ref: '#/components/schemas/CustomerCheckoutUrl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  parameters:
    currency:
      name: currency
      in: query
      description: Filter the results by currency, expressed as an ISO 4217 code.
      required: false
      explode: true
      schema:
        type: string
        example: EUR
    purchase_order_number:
      name: purchase_order_number
      in: query
      description: Filter by the invoice purchase order number. The match is exact but case-insensitive.
      required: false
      explode: true
      schema:
        type: string
        example: PO-123
    payment_status:
      name: payment_status
      in: query
      description: Filter by payment status. Possible values are `pending`, `failed` or `succeeded`.
      required: false
      explode: true
      schema:
        type: string
        enum:
        - pending
        - failed
        - succeeded
        example: pending
    per_page:
      name: per_page
      in: query
      description: Number of records per page.
      required: false
      explode: true
      schema:
        type: integer
        example: 20
    external_customer_id_path:
      name: external_customer_id
      in: path
      description: The customer external unique identifier (provided by your own application)
      required: true
      schema:
        type: string
        example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
    page:
      name: page
      in: query
      description: Page number.
      required: false
      explode: true
      schema:
        type: integer
        example: 1
  schemas:
    CreditNoteAppliedTaxObject:
      allOf:
      - $ref: '#/components/schemas/BaseAppliedTax'
      type: object
      properties:
        lago_credit_note_id:
          type: string
          format: uuid
          description: Unique identifier of the credit note, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        base_amount_cents:
          type: integer
          example: 100
    CreditNoteItemObject:
      type: object
      required:
      - lago_id
      - amount_cents
      - precise_amount_cents
      - amount_currency
      - fee
      properties:
        lago_id:
          type: string
          format: uuid
          description: The credit note's item unique identifier, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        amount_cents:
          type: integer
          description: The credit note's item amount, expressed in cents.
          example: 100
        precise_amount_cents:
          type: string
          description: The credit note's item amount, expressed in cents, with precision.
          example: '100.0001'
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The credit note's item currency.
          example: EUR
        fee:
          $ref: '#/components/schemas/FeeObject'
          description: The fee object related to the credit note item.
    CustomerProjectedChargeUsageObject:
      type: object
      required:
      - units
      - projected_units
      - events_count
      - amount_cents
      - projected_amount_cents
      - amount_currency
      - charge
      - billable_metric
      - grouped_usage
      properties:
        units:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          example: '1.0'
          description: The number of units consumed by the customer for a specific charge item.
        projected_units:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          example: '2.0'
          description: The projected number of units that can be consumed by the customer for a specific charge item.
        events_count:
          type: integer
          example: 10
          description: The quantity of usage events that have been recorded for a particular charge during the specified time period. These events may also be referred to as the number of transactions in some contexts.
        amount_cents:
          type: integer
          example: 123
          description: The amount in cents, tax excluded, consumed by the customer for a specific charge item.
        projected_amount_cents:
          type: integer
          example: 256
          description: The projected amount in cents, tax excluded, that can be consumed by the customer for a specific charge item.
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of a usage item consumed by the customer.
          example: EUR
        pricing_unit_details:
          $ref: '#/components/schemas/UsagePricingUnitDetailsObject'
        charge:
          type: object
          description: Object listing all the properties for a specific charge item.
          required:
          - lago_id
          - charge_model
          properties:
            lago_id:
              type: string
              format: uuid
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              description: Unique identifier assigned to the charge within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the charge's record within the Lago system.
            charge_model:
              $ref: '#/components/schemas/ChargeModelEnum'
            invoice_display_name:
              type:
              - string
              - 'null'
              description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the name of the actual charge will be used as the default display name.
              example: Setup
        billable_metric:
          type: object
          description: The related billable metric object.
          required:
          - lago_id
          - name
          - code
          - aggregation_type
          properties:
            lago_id:
              type: string
              format: uuid
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              description: Unique identifier assigned to the billable metric within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the billable metric's record within the Lago system.
            name:
              type: string
              example: Storage
              description: The name of the billable metric used for this charge.
            code:
              type: string
              example: storage
              description: The code of the billable metric used for this charge.
            aggregation_type:
              type: string
              description: The aggregation type of the billable metric used for this charge.
              enum:
              - count_agg
              - sum_agg
              - max_agg
              - unique_count_agg
              - weighted_sum_agg
              - latest_agg
              example: sum_agg
        filters:
          $ref: '#/components/schemas/CustomerProjectedChargeFiltersUsageObject'
        grouped_usage:
          $ref: '#/components/schemas/CustomerProjectedChargeGroupedUsageObject'
        presentation_breakdowns:
          $ref: '#/components/schemas/PresentationBreakdownsObject'
        projected_presentation_breakdowns:
          $ref: '#/components/schemas/PresentationBreakdownsObject'
    PresentationBreakdownsObject:
      type: array
      description: Array of usage breakdowns split by presentation group keys without affecting pricing or aggregation.
      items:
        type: object
        properties:
          presentation_by:
            type: object
            description: Key value list of event properties used for presentation grouping.
            additionalProperties:
              type: string
          units:
            type: string
            example: '9.0'
            description: The number of units consumed for a specific presentation group.
    CreditNoteErrorDetailsObject:
      type: object
      required:
      - lago_id
      - error_code
      - details
      properties:
        lago_id:
          type: string
          format: uuid
          description: The credit note error details unique identifier, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        error_code:
          type: string
          enum:
          - not_provided
          - tax_error
          - tax_voiding_error
          - invoice_generation_error
          description: The type of the error.
          example: tax_error
        details:
          type: object
          description: The details of the error.
    AppliedUsageThresholdObject:
      type: object
      required:
      - lifetime_usage_amount_cents
      - created_at
      - usage_threshold
      properties:
        lifetime_usage_amount_cents:
          type: integer
          description: The amount of usage in cents that has been accumulated over the lifetime of the subscription.
          example: 2000
        created_at:
          type: string
          format: date-time
          description: The date and time when the lifetime usage was computed. It is expressed in UTC format according to the ISO 8601 datetime standard.
          example: '2025-03-31T12:31:44Z'
        usage_threshold:
          $ref: '#/components/schemas/UsageThresholdObject'
    AppliedCouponsPaginated:
      type: object
      required:
      - applied_coupons
      - meta
      properties:
        applied_coupons:
          type: array
          items:
            $ref: '#/components/schemas/AppliedCouponObjectExtended'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CustomerBaseObject:
      type: object
      required:
      - lago_id
      - sequential_id
      - slug
      - external_id
      - billing_entity_code
      - address_line1
      - address_line2
      - applicable_timezone
      - city
      - country
      - currency
      - email
      - legal_name
      - legal_number
      - logo_url
      - name
      - firstname
      - lastname
      - account_type
      - customer_type
      - phone
      - state
      - tax_identification_number
      - timezone
      - url
      - zipcode
      - net_payment_term
      - external_salesforce_id
      - created_at
      - updated_at
      - finalize_zero_amount_invoice
      - skip_invoice_custom_sections
      - billing_configuration
      - shipping_address
      - metadata
      properties:
        lago_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system
        sequential_id:
          type: integer
          example: 1
          description: The unique identifier assigned to the customer within the organization's scope. This identifier is used to track and reference the customer's order of creation within the organization's system. It ensures that each customer has a distinct `sequential_id` associated with them, allowing for easy identification and sorting based on the order of creation
        slug:
          type: string
          example: LAG-1234-001
          description: A concise and unique identifier for the customer, formed by combining the Organization's `name`, `id`, and customer's `sequential_id`
        external_id:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
          description: The customer external unique identifier (provided by your own application)
        billing_entity_code:
          type: string
          example: acme_corp
          description: The unique code of the billing entity associated with the customer.
        address_line1:
          type:
          - string
          - 'null'
          example: 5230 Penfield Ave
          description: The first line of the billing address
        address_line2:
          type:
          - string
          - 'null'
          example: null
          description: The second line of the billing address
        applicable_timezone:
          $ref: '#/components/schemas/Timezone'
          description: The customer's applicable timezone, used for billing purposes in their local time.
        city:
          type:
          - string
          - 'null'
          example: Woodland Hills
          description: The city of the customer's billing address
        country:
          $ref: '#/components/schemas/CountryOrNull'
          description: Country code of the customer's billing address. Format must be ISO 3166 (alpha-2)
          example: US
        currency:
          $ref: '#/components/schemas/CurrencyOrNull'
          example: USD
          description: Currency of the customer. Format must be ISO 4217
        email:
          type:
          - string
          - 'null'
          format: email
          example: dinesh@piedpiper.example
          description: The email of the customer
        legal_name:
          type:
          - string
          - 'null'
          example: Coleman-Blair
          description: The legal company name of the customer
        legal_number:
          type:
          - string
          - 'null'
          example: 49-008-2965
          description: The legal company number of the customer
        logo_url:
          type:
          - string
          - 'null'
          example: http://hooli.com/logo.png
          description: The logo URL of the customer
        name:
          type:
          - string
          - 'null'
          example: Gavin Belson
          description: The full name of the customer
        firstname:
          type:
          - string
          - 'null'
          example: Gavin
          description: First name of the customer
        lastname:
          type:
          - string
          - 'null'
          example: Belson
          description: Last name of the customer
        account_type:
          type: string
          enum:
          - customer
          - partner
          example: customer
          description: 'The type of the account. It can have one of the following values:

            - `customer`: the account is a customer.

            - `partner`: the account is a partner.'
        customer_type:
          type:
          - string
          - 'null'
          enum:
          - company
          - individual
          - null
          example: company
          description: 'The type of the customer. It can have one of the following values:

            - `company`: the customer is a company.

            - `individual`: the customer is an individual.'
        phone:
          type:
          - string
          - 'null'
          example: 1-171-883-3711 x245
          description: The phone number of the customer
        state:
          type:
          - string
          - 'null'
          example: CA
          description: The state of the customer's billing address
        tax_identification_number:
          type:
          - string
          - 'null'
          example: EU123456789
          description: The tax identification number of the customer
        timezone:
          $ref: '#/components/schemas/TimezoneOrNull'
          description: The customer's timezone, used for billing purposes in their local time. Overrides the organization's timezone
        url:
          type:
          - string
          - 'null'
          example: http://hooli.com
          description: The custom website URL of the customer
        zipcode:
          type:
          - string
          - 'null'
          example: '91364'
          description: The zipcode of the customer's billing address
        net_payment_term:
          type:
          - integer
          - 'null'
          example: 30
          description: The net payment term, expressed in days, specifies the duration within which a customer is expected to remit payment after the invoice is finalized.
        external_salesforce_id:
          type:
          - string
          - 'null'
          example: 0015p00001JQx1QAAT
          description: The customer ID within the Salesforce system
        created_at:
          type: string
          format: date-time
          example: '2022-04-29T08:59:51Z'
          description: The date of the customer creation, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC). The creation_date provides a standardized and internationally recognized timestamp for when the customer object was created
        updated_at:
          type: string
          format: date-time
          example: '2022-04-29T08:59:51Z'
          description: The date of the customer update, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC). The update_date provides a standardized and internationally recognized timestamp for when the customer object was updated
        finalize_zero_amount_invoice:
          type: string
          enum:
          - inherit
          - skip
          - finalize
          example: inherit
          description: 'Specifies how invoices with a zero total amount should be handled:

            - `inherit`: (Default) Follows the organization-level configuration.

            - `finalize`: Invoices are issued and finalized even if the total amount is zero.

            - `skip`: Invoices with a total amount of zero are not finalized.'
        skip_invoice_custom_sections:
          type: boolean
          example: false
          description: Set to true to exclude all invoice custom sections from PDF generation for this customer only.
        billing_configuration:
          $ref: '#/components/schemas/CustomerBillingConfiguration'
        shipping_address:
          $ref: '#/components/schemas/Address'
        metadata:
          type: array
          items:
            $ref: '#/components/schemas/CustomerMetadata'
    ApiErrorBadRequest:
      type: object
      required:
      - status
      - error
      properties:
        status:
          type: integer
          format: int32
          example: 400
        error:
          type: string
          example: Bad request
    AppliedCouponObject:
      type: object
      required:
      - lago_id
      - lago_coupon_id
      - coupon_code
      - coupon_name
      - external_customer_id
      - lago_customer_id
      - status
      - coupon_status
      - frequency
      - created_at
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the applied coupon, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_coupon_id:
          type: string
          format: uuid
          description: Unique identifier of the coupon, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        coupon_code:
          type: string
          description: Unique code used to identify the coupon.
          example: startup_deal
        coupon_name:
          type: string
          description: The name of the coupon.
          example: Startup Deal
        coupon_description:
          type:
          - string
          - 'null'
          description: The description of the parent coupon.
          example: I am a coupon description
        coupon_status:
          type: string
          enum:
          - active
          - terminated
          description: The status of the parent coupon. Can be either `active` or `terminated`.
          example: active
        coupon_deleted_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the parent coupon was deleted. If null, the coupon still exists. It is expressed in UTC format according to the ISO 8601 datetime standard.
          example: '2022-04-29T08:59:51Z'
        lago_customer_id:
          type: string
          format: uuid
          description: Unique identifier of the customer, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_customer_id:
          type: string
          description: The customer external unique identifier (provided by your own application)
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
        status:
          type: string
          enum:
          - active
          - terminated
          description: The status of the coupon. Can be either `active` or `terminated`.
          example: active
        amount_cents:
          type:
          - integer
          - 'null'
          description: The amount of the coupon in cents. It is set for a coupon with the `fixed_amount` type.
          example: 2000
        amount_cents_remaining:
          type:
          - integer
          - 'null'
          description: The remaining amount in cents for a `fixed_amount` coupon with a frequency set to `once`. This field indicates the remaining balance or value that can still be utilized from the coupon.
          example: 50
        amount_currency:
          $ref: '#/components/schemas/CurrencyOrNull'
          description: The currency of the coupon amount. It is set for a coupon with the `fixed_amount` type.
          example: EUR
        percentage_rate:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+.?[0-9]*$
          description: The percentage rate of the coupon. It is set for a coupon with the `percentage` type.
          example: null
        frequency:
          type: string
          enum:
          - once
          - recurring
          - forever
          description: 'The type of frequency for the coupon. It can have three possible values: `once`, `recurring` or `forever`.


            - If set to `once`, the coupon is applicable only for a single use.

            - If set to `recurring`, the coupon can be used multiple times for recurring billing periods.

            - If set to `forever`, the coupon has unlimited usage and can be applied indefinitely.'
          example: recurring
        frequency_duration:
          type:
          - integer
          - 'null'
          description: The number of billing periods to which the coupon applies. It is set when the frequency is `recurring`.
          example: 3
        frequency_duration_remaining:
          type:
          - integer
          - 'null'
          description: The remaining number of billing periods to which the coupon is applicable. This field determines the remaining usage or availability of the coupon based on the remaining billing periods.
          example: 1
        expiration_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time after which the coupon will stop applying to customer's invoices. Once the expiration date is reached, the coupon will no longer be applicable, and any further invoices generated for the customer will not include the coupon discount.
          example: '2022-04-29T08:59:51Z'
        created_at:
          type: string
          format: date-time
          description: The date and time when the coupon was assigned to a customer. It is expressed in UTC format according to the ISO 8601 datetime standard.
          example: '2022-04-29T08:59:51Z'
        terminated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: This field indicates the specific moment when the coupon amount is fully utilized or when the coupon is removed from the customer's coupon list. It is expressed in UTC format according to the ISO 8601 datetime standard.
          example: '2022-04-29T08:59:51Z'
    MetadataObject:
      type:
      - object
      - 'null'
      description: 'Custom metadata stored as key-value pairs.

        Keys are strings (max 100 characters), values can be strings (max 255 characters) or null.'
      additionalProperties:
        type:
        - string
        - 'null'
      example:
        external_id: ext-123
        synced_at: '2024-01-15'
        source: null
    PaymentMethodObject:
      type: object
      required:
      - lago_id
      - is_default
      - payment_provider_code
      - payment_provider_name
      - payment_provider_type
      - provider_method_id
      - created_at
      properties:
        lago_id:
          type: string
          format: uuid
          description: The unique identifier of the payment method, created by Lago.
          example: 4cf085a7-c196-4f07-a543-97c50ec6e8b2
        is_default:
          type: boolean
          description: Indicates whether this payment method is the default one for the customer.
          example: true
        payment_provider_code:
          type:
          - string
          - 'null'
          description: Code of the payment provider associated with this payment method.
          example: stripe_prod
        payment_provider_name:
          type:
          - string
          - 'null'
          description: Human-readable name of the payment provider.
          example: Stripe
        payment_provider_type:
          type:
          - string
          - 'null'
          description: The type of the payment provider. It is `null` when the payment method is no longer attached to a payment provider.
          enum:
          - null
          - adyen
          - cashfree
          - gocardless
          - stripe
          - flutterwave
          - moneyhash
          example: stripe
        provider_method_id:
          type: string
          description: Unique identifier of the payment method within the payment provider.
          example: pm_1N8ZQX2eZvKYlo2CkL9Y8XYZ
        created_at:
          type: string
          format: date-time
          description: Timestamp when the payment method was created in Lago's database.
          example: '2025-01-21T00:10:29Z'
    FeeObject:
      type: object
      required:
      - item
      - amount_cents
      - amount_currency
      - taxes_amount_cents
      - taxes_rate
      - total_amount_cents
      - total_amount_currency
      - pay_in_advance
      - invoiceable
      - units
      - total_aggregated_units
      - precise_unit_amount
      - sub_total_excluding_taxes_amount_cents
      - sub_total_excluding_taxes_precise_amount_cents
      - payment_status
      properties:
        lago_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier assigned to the fee within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the fee's record within the Lago system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_charge_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier assigned to the charge that the fee belongs to
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_charge_filter_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier assigned to the charge filter that the fee belongs to
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_fixed_charge_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier assigned to the fixed charge that the fee belongs to
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_invoice_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier assigned to the invoice that the fee belongs to
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_true_up_fee_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier assigned to the true-up fee when a minimum has been set to the charge. This identifier helps to distinguish and manage the true-up fee associated with the charge, which may be applicable when a minimum threshold or limit is set for the charge amount.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_true_up_parent_fee_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier assigned to the parent fee on which the true-up fee is assigned. This identifier establishes the relationship between the parent fee and the associated true-up fee.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_original_fee_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier assigned to the fee this fee was derived from. It is set on fees regenerated from an existing fee, and `null` otherwise.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_subscription_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier assigned to the subscription, created by Lago. This field is specifically displayed when the fee type is charge or subscription.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_customer_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier assigned to the customer, created by Lago. This field is specifically displayed when the fee type is charge or subscription.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_customer_id:
          type:
          - string
          - 'null'
          description: Unique identifier assigned to the customer in your application. This field is specifically displayed when the fee type is charge or subscription.
          example: external_id
        external_subscription_id:
          type:
          - string
          - 'null'
          description: Unique identifier assigned to the subscription in your application. This field is specifically displayed when the fee type is charge or subscription.
          example: external_id
        amount_cents:
          type: integer
          description: The cost of this specific fee, excluding any applicable taxes.
          example: 100
        precise_amount:
          type: string
          description: The cost of this specific fee, excluding any applicable taxes, with precision.
          example: '1.0001'
        precise_total_amount:
          type: string
          description: The cost of this specific fee, including any applicable taxes, with precision.
          example: '1.0212'
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of this specific fee. It indicates the monetary unit in which the fee's cost is expressed.
          example: EUR
        taxes_amount_cents:
          type: integer
          description: The cost of the tax associated with this specific fee.
          example: 20
        taxes_precise_amount:
          type: string
          description: The cost of the tax associated with this specific fee, with precision.
          example: '0.20123'
        taxes_rate:
          type: number
          description: The tax rate associated with this specific fee.
          example: 20
        units:
          type: string
          description: The number of units used to charge the customer. This field indicates the quantity or count of units consumed or utilized in the context of the charge. It helps in determining the basis for calculating the fee or cost associated with the usage of the service or product provided to the customer.
          example: '0.32'
        precise_unit_amount:
          type: string
          description: The unit amount of the fee per unit, with precision.
          example: '312.5'
        total_aggregated_units:
          type:
          - string
          - 'null'
          description: The total number of units that have been aggregated for this specific fee. It is `null` on fees that do not aggregate units, such as `subscription`, `add_on` and `credit` fees.
          example: '0.32'
        total_amount_cents:
          type: integer
          description: The cost of this specific fee, including any applicable taxes.
          example: 120
        total_amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of this specific fee, including any applicable taxes.
          example: EUR
        events_count:
          type:
          - integer
          - 'null'
          description: The number of events that have been sent and used to charge the customer. This field indicates the count or quantity of events that have been processed and considered in the charging process.
          example: 23
        pay_in_advance:
          type: boolean
          description: Flag that indicates whether the fee was paid in advance. It serves as a boolean value, where `true` represents that the fee was paid in advance (straightaway), and `false` indicates that the fee was not paid in arrears (at the end of the period).
          example: true
        invoiceable:
          type: boolean
          description: Flag that indicates whether the fee was included on the invoice. It serves as a boolean value, where `true` represents that the fee was included on the invoice, and `false` indicates that the fee was not included on the invoice.
          example: true
        from_date:
          type:
          - string
          - 'null'
          format: date-time
          description: The beginning date of the period that the fee covers. It is applicable only to `subscription`, `charge`, `fixed_charge` and `commitment` fees. This field indicates the start date of the billing period or subscription period associated with the fee.
          example: '2022-04-29T08:59:51Z'
        to_date:
          type:
          - string
          - 'null'
          format: date-time
          description: The ending date of the period that the fee covers. It is applicable only to `subscription`, `charge`, `fixed_charge` and `commitment` fees. This field indicates the end date of the billing period or subscription period associated with the fee.
          example: '2022-05-29T08:59:51Z'
        payment_status:
          type: string
          enum:
          - pending
          - succeeded
          - failed
          - refunded
          description: Indicates the payment status of the fee. It represents the current status of the payment associated with the fee. The possible values for this field are `pending`, `succeeded`, `failed` and `refunded`.
          example: pending
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the fee was created. It is provided in Coordinated Universal Time (UTC) format.
          example: '2022-08-24T14:58:59Z'
        succeeded_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the payment for the fee was successfully processed. It is provided in Coordinated Universal Time (UTC) format.
          example: '2022-08-24T14:58:59Z'
        failed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the payment for the fee failed to process. It is provided in Coordinated Universal Time (UTC) format.
          example: '2022-08-24T14:58:59Z'
        refunded_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the payment for the fee was refunded. It is provided in Coordinated Universal Time (UTC) format
          example: '2022-08-24T14:58:59Z'
        event_transaction_id:
          type:
          - string
          - 'null'
          description: Unique identifier assigned to the transaction. This field is specifically displayed when the fee type is `charge` and the payment for the fee is made in advance (`pay_in_advance` is set to `true`).
          example: transaction_1234567890
        description:
          type:
          - string
          - 'null'
          description: The description of the fee.
          example: Fee description
        precise_coupons_amount_cents:
          type: string
          description: The coupon amount applied to the fee, with precision.
          example: '0.0'
        sub_total_excluding_taxes_amount_cents:
          type: integer
          description: The sub total of the fee excluding taxes, in cents.
          example: 100
        sub_total_excluding_taxes_precise_amount_cents:
          type: string
          description: The sub total of the fee excluding taxes, with precision.
          example: '100.0'
        amount_details:
          $ref: '#/components/schemas/FeeAmountDetails'
          description: List of all unit amount details for calculating the fee.
        self_billed:
          type: boolean
          example: false
          description: Indicates if the fee belongs to self-billed invoice. Self-billing is a process where an organization creates the invoice on behalf of the partner.
        item:
          type: object
          description: Item attached to the fee
          required:
          - type
          - code
          - name
          - description
          - invoice_display_name
          - filters
          - filter_invoice_display_name
          - lago_item_id
          - item_type
          - grouped_by
          properties:
            type:
              type: string
              enum:
              - charge
              - fixed_charge
              - add_on
              - subscription
              - credit
              - commitment
              description: The fee type. Possible values are `add_on`, `charge`, `fixed_charge`, `credit`, `subscription` or `commitment`.
              example: subscription
            code:
              type: string
              description: 'The code of the fee item. The value depends on the type of the fee item:


                - If the fee item is a `charge`, it is the billable metric code.

                - If the fee item is an `add_on` or a `fixed_charge`, it is the add-on code.

                - If the fee item is a `credit`, it is always `"credit"`.

                - For all the other fee items, it is the subscription plan code.

                '
              example: startup
            name:
              type: string
              description: 'The name of the fee item. The value depends on the type of the fee item:


                - If the fee item is a `charge`, it is the billable metric name.

                - If the fee item is an `add_on`, it is the add-on name.

                - If the fee item is a `credit`, it is the wallet transaction name if set, or `"credit"` if not.

                - If the fee item is a `fixed_charge`, it is the fixed charge add-on name.

                - For all the other fee items, it is the subscription plan name.

                '
              example: Startup
            description:
              type:
              - string
              - 'null'
              description: 'The description of the fee item. The value depends on the type of the fee item:


                - If the fee item is a `charge`, it is the billable metric description.

                - If the fee item is an `add_on`, it is the add-on description.

                - If the fee item is a `credit`, it is always `"credit"`.

                - If the fee item is a `fixed_charge`, it is the fixed charge add-on description.

                - For all the other fee items, it is the subscription plan description.

                '
              example: Startup
            invoice_display_name:
              type: string
              description: 'Specifies the name that will be displayed on an invoice. If no value is set for this field, we''ll fallback to a value that depends on the type of the fee items:


                - If the fee item is a `charge`, we''ll fallback to the `invoice_display_name` of the `charge` or the billable metric name if no `invoice_display_name` is set.

                - If the fee item is an `add_on`, we''ll fallback to the `invoice_name` of the `add_on` or the `name` of the `add_on`.

                - If the fee item is a `credit`, we''ll fallback to the wallet transaction name if set, or `credit` if not.

                - If the fee item is a `fixed_charge`, we''ll fallback to the `invoice_display_name` of the `fixed_charge` or the `invoice_name` of the `fixed_charge_add_on` if no `invoice_display_name` is set.

                - For all the other fee items, we''ll fallback to the `invoice_display_name` of the subscription plan.

                '
              example: Setup Fee (SF1)
            filter_invoice_display_name:
              type:
              - string
              - 'null'
              description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the actual charge filter values will be used as the default display name.
              example: AWS eu-east-1
            filters:
              type:
              - object
              - 'null'
              description: Key value list of event properties
              additionalProperties:
                type: array
                items:
                  type: string
            lago_item_id:
              type: string
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              description: 'Unique identifier of the fee item, created by Lago. The object it points to is given by `item_type`:


                - If the fee item is a `charge`, it is the billable metric identifier.

                - If the fee item is an `add_on` or a `fixed_charge`, it is the add-on identifier.

                - If the fee item is a `credit`, it is the wallet transaction identifier.

                - For all the other fee items, it is the subscription identifier.

                '
              format: uuid
            item_type:
              type: string
              enum:
              - AddOn
              - BillableMetric
              - Subscription
              - WalletTransaction
              description: The type of the fee item. Possible values are `AddOn`, `BillableMetric`, `WalletTransaction`, `Subscription`.
              example: Subscription
            grouped_by:
              type: object
              description: Key value list of event properties aggregated by the charge model
              additionalProperties:
                type: string
        applied_taxes:
          type: array
          description: List of fee applied taxes
          items:
            $ref: '#/components/schemas/FeeAppliedTaxObject'
        pricing_unit_details:
          type:
          - object
          - 'null'
          description: Details about the pricing unit used and amounts for this fee.
          $ref: '#/components/schemas/PricingUnitDetailsObject'
        presentation_breakdowns:
          $ref: '#/components/schemas/PresentationBreakdownsObject'
    IntegrationCustomer:
      type: object
      required:
      - lago_id
      - type
      - external_customer_id
      - integration_code
      - code
      - is_default
      - category
      description: Configuration specific to the accounting and tax integrations. This object contains settings and parameters necessary for syncing documents and payments.
      properties:
        lago_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: A unique identifier for the integration customer object in the Lago application.
        type:
          type: string
          example: netsuite
          description: 'The integration type used for accounting, tax and CRM syncs.

            Accepted values: `netsuite`, `anrok`, `avalara`, `xero`, `hubspot`, `salesforce`.'
          enum:
          - netsuite
          - anrok
          - avalara
          - xero
          - hubspot
          - salesforce
        integration_code:
          type: string
          example: netsuite-eu-1
          description: Unique code used to identify an integration connection.
        code:
          type:
          - string
          - 'null'
          example: netsuite-eu-1
          description: Unique code identifying this integration customer. It defaults to the code of the integration connection.
        is_default:
          type: boolean
          example: true
          description: Whether this integration customer is the default one of its category for the customer.
        category:
          type:
          - string
          - 'null'
          example: accounting
          description: 'The category of the integration connection. It is derived from the integration type.

            Accepted values: `payment`, `tax`, `accounting`, `crm`.'
          enum:
          - payment
          - tax
          - accounting
          - crm
          - null
        external_customer_id:
          type:
          - string
          - 'null'
          example: cus_12345
          description: The customer ID within the integration's system. It is `null` when the customer has not been created in the integration's system yet.
        sync_with_provider:
          type:
          - boolean
          - 'null'
          example: true
          description: Set this field to `true` if you want to create a customer record in the integration's system. This option is applicable only when the `external_customer_id` is null and the `sync_with_provider` field is set to `true`. By default, the value is set to `false`
        subsidiary_id:
          type: string
          example: '2'
          description: This optional field is needed only when working with `netsuite` connection.
        targeted_object:
          type:
          - string
          - 'null'
          example: contacts
          description: This optional field is present only when working with `hubspot` connection.
        email:
          type:
          - string
          - 'null'
          example: dinesh@piedpiper.example
          description: This optional field is present only when working with `hubspot` connection.
    BaseAppliedTax:
      type: object
      required:
      - lago_id
      - lago_tax_id
      - tax_name
      - tax_code
      - tax_rate
      - tax_description
      - amount_cents
      - amount_currency
      - created_at
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the applied tax, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_tax_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier of the tax, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        tax_name:
          type: string
          description: Name of the tax.
          example: TVA
        tax_code:
          type: string
          description: Unique code used to identify the tax associated with the API request.
          example: french_standard_vat
        tax_rate:
          type: number
          description: The percentage rate of the tax
          example: 20
        tax_description:
          type:
          - string
          - 'null'
          description: Internal description of the tax
          example: French standard VAT
        amount_cents:
          type: integer
          description: Amount of the tax
          example: 2000
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: Currency of the tax
          example: USD
        created_at:
          type: string
          format: date-time
          description: The date and time when the applied tax was created. It is expressed in UTC format according to the ISO 8601 datetime standard. This field provides the timestamp for the exact moment when the applied tax was initially created.
          example: '2022-09-14T16:35:31Z'
    PaymentRequestsPaginated:
      type: object
      required:
      - payment_requests
      - meta
      properties:
        payment_requests:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRequestObject'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CustomerBillingConfiguration:
      type: object
      description: Configuration specific to the payment provider, utilized for billing the customer. This object contains settings and parameters necessary for processing payments and invoicing the customer.
      properties:
        invoice_grace_period:
          type:
          - integer
          - 'null'
          example: 3
          description: The grace period, expressed in days, for the invoice. This period refers to the additional time granted to the customer beyond the invoice due date to adjust usage and line items. It is null when the customer has no grace period of its own and falls back to the billing entity.
        subscription_invoice_issuing_date_anchor:
          type:
          - string
          - 'null'
          example: next_period_start
          description: Defines whether the issuing date follows the current billing period's end date or the next period starting date.
          enum:
          - current_period_end
          - next_period_start
          - null
          default: null
        subscription_invoice_issuing_date_adjustment:
          type:
          - string
          - 'null'
          example: keep_anchor
          description: The logic applied on top of the subscription_invoice_issuing_date_anchor rule. You can opt to use the invoice finalization date, that includes any configured grace period.
          enum:
          - align_with_finalization_date
          - keep_anchor
          - null
          default: null
        payment_provider:
          type:
          - string
          - 'null'
          example: stripe
          description: 'The payment provider utilized to initiate payments for invoices issued by Lago.

            Accepted values: `stripe`, `adyen`, `cashfree`, `flutterwave`, `gocardless`, `moneyhash` or null. This field is required if you intend to assign a `provider_customer_id`. Send null to detach the customer from its current payment provider.'
          enum:
          - stripe
          - adyen
          - cashfree
          - flutterwave
          - gocardless
          - moneyhash
          - null
        payment_provider_code:
          type:
          - string
          - 'null'
          example: stripe-eu-1
          description: Unique code used to identify a payment provider connection.
        provider_customer_id:
          type: string
          example: cus_12345
          description: The customer ID within the payment provider's system. If this field is not provided, Lago has the option to create a new customer record within the payment provider's system on behalf of the customer
        sync:
          type: boolean
          example: true
          description: Set this field to `true` if you want to create the customer in the payment provider synchronously with the customer creation process in Lago. This option is applicable only when the `provider_customer_id` is `null` and the customer is automatically created in the payment provider through Lago. By default, the value is set to `false`
        sync_with_provider:
          type: boolean
          example: true
          description: Set this field to `true` if you want to create a customer record in the payment provider's system. This option is applicable only when the `provider_customer_id` is null and the `sync_with_provider` field is set to `true`. By default, the value is set to `false`
        document_locale:
          type:
          - string
          - 'null'
          example: fr
          description: The document locale, specified in the ISO 639-1 format. This field represents the language or locale used for the documents issued by Lago
        provider_payment_methods:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Specifies the available payment methods that can be used for this customer when `payment_provider` is set to `stripe`. The `provider_payment_methods` field is an array that allows multiple payment options to be defined. If this field is not explicitly set, the payment methods will be set to `card`. For now, possible values are `card`, `sepa_debit`, `us_bank_account`, `bacs_debit`, `boleto`, `link`, `crypto` and `customer_balance`. Note that when `link` is selected, `card` should also be provided in the array. When `customer_balance` is selected, no other payment can be selected.
          example:
          - card
          - sepa_debit
          - us_bank_account
          - bacs_debit
          - link
          - boleto
          - crypto
          - customer_balance
    CustomerUsage:
      type: object
      required:
      - customer_usage
      properties:
        customer_usage:
          $ref: '#/components/schemas/CustomerUsageObject'
    CreditNotesPaginated:
      type: object
      required:
      - credit_notes
      - meta
      properties:
        credit_notes:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteObject'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    CustomerPastUsage:
      type: object
      required:
      - usage_periods
      - meta
      properties:
        usage_periods:
          type: array
          items:
            $ref: '#/components/schemas/CustomerUsageObject'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    Address:
      type: object
      description: The shipping address of the customer.
      properties:
        address_line1:
          type:
          - string
          - 'null'
          example: 5230 Penfield Ave
          description: The first line of the shipping address
        address_line2:
          type:
          - string
          - 'null'
          example: null
          description: The second line of the shipping address
        city:
          type:
          - string
          - 'null'
          example: Woodland Hills
          description: The city of the customer's shipping address
        country:
          $ref: '#/components/schemas/CountryOrNull'
          description: Country code of the customer's shipping address. Format must be ISO 3166 (alpha-2)
          example: US
        state:
          type:
          - string
          - 'null'
          example: CA
          description: The state of the customer's shipping address
        zipcode:
          type:
          - string
          - 'null'
          example: '91364'
          description: The zipcode of the customer's shipping address
    CustomerChargeFiltersUsageObject:
      type: array
      description: Array of filter object, representing multiple dimensions for a charge item.
      items:
        type: object
        required:
        - values
        - units
        - total_aggregated_units
        - events_count
        - amount_cents
        properties:
          units:
            type: string
            pattern: ^[0-9]+.?[0-9]*$
            example: '0.9'
            description: The number of units consumed for a specific charge filter related to a charge item.
          total_aggregated_units:
            type: string
            pattern: ^[0-9]+.?[0-9]*$
            example: '1.0'
            description: The total number of units consumed by the customer for a specific charge item, aggregated across all usage events.
          amount_cents:
            type: integer
            example: 1000
            description: The amount in cents, tax excluded, consumed for a specific charge filter related to a charge item.
          events_count:
            type: integer
            example: 10
            description: The quantity of usage events that have been recorded for a particular charge filter during the specified time period. These events may also be referred to as the number of transactions in some contexts.
          invoice_display_name:
            type:
            - string
            - 'null'
            description: Specifies the name that will be displayed on an invoice. It is `null` for the entry that holds the usage recorded outside of any charge filter.
            example: AWS eu-east-1
          pricing_unit_details:
            $ref: '#/components/schemas/UsagePricingUnitDetailsObject'
          values:
            type:
            - object
            - 'null'
            description: List of filter values applied to the usage. It is `null` for the entry that holds the usage recorded outside of any charge filter.
            additionalProperties:
              type: array
              items:
                type: string
            example:
              region:
              - us-east-1
          presentation_breakdowns:
            $ref: '#/components/schemas/PresentationBreakdownsObject'
    CustomerCreateInput:
      type: object
      required:
      - customer
      properties:
        customer:
          type: object
          required:
          - external_id
          properties:
            external_id:
              type: string
              example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
              description: The customer external unique identifier (provided by your own application)
            billing_entity_code:
              type:
              - string
              - 'null'
              example: acme_corp
              description: The unique code of the billing entity to associate with the customer. If not provided, the default billing entity will be used.
            address_line1:
              type:
              - string
              - 'null'
              example: 5230 Penfield Ave
              description: The first line of the billing address
            address_line2:
              type:
              - string
              - 'null'
              example: ''
              description: The second line of the billing address
            city:
              type:
              - string
              - 'null'
              example: Woodland Hills
              description: The city of the customer's billing address
            country:
              $ref: '#/components/schemas/CountryOrNull'
              description: Country code of the customer's billing address. Format must be ISO 3166 (alpha-2)
              example: US
            currency:
              $ref: '#/components/schemas/CurrencyOrNull'
              description: Currency of the customer. Format must be ISO 4217
            email:
              type:
              - string
              - 'null'
              format: email
              example: dinesh@piedpiper.example
              description: The email of the customer
            legal_name:
              type:
              - string
              - 'null'
              example: Coleman-Blair
              description: The legal company name of the customer
            legal_number:
              type:
              - string
              - 'null'
              example: 49-008-2965
              description: The legal company number of the customer
            logo_url:
              type:
              - string
              - 'null'
              example: http://hooli.com/logo.png
              description: The logo URL of the customer
            name:
              type:
              - string
              - 'null'
              maxLength: 255
              example: Gavin Belson
              description: The full name of the customer (255 characters max).
            firstname:
              type:
              - string
              - 'null'
              example: Gavin
              description: First name of the customer
            lastname:
              type:
              - string
              - 'null'
              example: Belson
              description: Last name of the customer
            account_type:
              type: string
              enum:
              - customer
              - partner
              example: customer
              description: 'The type of the account. It can have one of the following values:

                - `customer`: the account is a customer, default value.

                - `partner`: the account is a partner.


                This field is only applied when revenue share is enabled on your organization and the customer has no subscription, invoice, add-on, fixed-amount coupon or wallet yet; otherwise it is ignored.'
            customer_type:
              type:
              - string
              - 'null'
              enum:
              - company
              - individual
              - null
              example: company
              description: 'The type of the customer. It can have one of the following values:

                - `company`: the customer is a company.

                - `individual`: the customer is an individual.'
            phone:
              type:
              - string
              - 'null'
              example: 1-171-883-3711 x245
              description: The phone number of the customer
            state:
              type:
              - string
              - 'null'
              example: CA
              description: The state of the customer's billing address
            tax_codes:
              $ref: '#/components/schemas/TaxCodes'
            tax_identification_number:
              type:
              - string
              - 'null'
              example: EU123456789
              description: The tax identification number of the customer
            timezone:
              $ref: '#/components/schemas/TimezoneOrNull'
              description: The customer's timezone, used for billing purposes in their local time. Overrides the organization's timezone
            url:
              type:
              - string
              - 'null'
              example: http://hooli.com
              description: The custom website URL of the customer
            zipcode:
              type:
              - string
              - 'null'
              example: '91364'
              description: The zipcode of the customer's billing address
            net_payment_term:
              type:
              - integer
              - 'null'
              example: 30
              description: The net payment term, expressed in days, specifies the duration within which a customer is expected to remit payment after the invoice is finalized.
            external_salesforce_id:
              type:
              - string
              - 'null'
              example: 0015p00001JQx1QAAT
              description: The customer ID within the Salesforce system
            finalize_zero_amount_invoice:
              type: string
              enum:
              - inherit
              - skip
              - finalize
              example: inherit
              description: 'Specifies how invoices with a zero total amount should be handled:

                - `inherit`: (Default) Follows the organization-level configuration.

                - `finalize`: Invoices are issued and finalized even if the total amount is zero.

                - `skip`: Invoices with a total amount of zero are not finalized.'
            billing_configuration:
              $ref: '#/components/schemas/CustomerBillingConfiguration'
            shipping_address:
              $ref: '#/components/schemas/Address'
            integration_customers:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
                    description: A unique identifier for the integration customer object in the Lago application.
                  integration_type:
                    type: string
                    example: netsuite
                    description: 'The integration type used for accounting, tax and CRM syncs.

                      Accepted values: `netsuite`, `anrok`, `avalara`, `xero`, `hubspot`, `salesforce`.'
                    enum:
                    - netsuite
                    - anrok
                    - avalara
                    - xero
                    - hubspot
                    - salesforce
                  integration_code:
                    type: string
                    example: netsuite-eu-1
                    description: Unique code used to identify an integration connection.
                  code:
                    type: string
                    example: netsuite-eu-1
                    description: Unique code identifying this integration customer. If it is not provided, the code of the integration connection is used.
                  external_customer_id:
                    type: string
                    example: cus_12345
                    description: The customer ID within the integration's system. If this field is not provided, Lago has the option to create a new customer record within the integration's system on behalf of the customer.
                  sync_with_provider:
                    type: boolean
                    example: true
                    description: Set this field to `true` if you want to create a customer record in the integration's system. This option is applicable only when the `external_customer_id` is null and the `sync_with_provider` field is set to `true`. By default, the value is set to `false`
                  subsidiary_id:
                    type: string
                    example: '2'
                    description: This optional field is needed only when working with `netsuite` connection.
                  targeted_object:
                    type:
                    - string
                    - 'null'
                    example: contacts
                    description: This optional field is needed only when working with `hubspot` connection.
            metadata:
              type: array
              maxItems: 5
              description: Set of key-value pairs that you can attach to a customer. This can be useful for storing additional information about the customer in a structured format. A customer can hold up to 5 key-value pairs.
              items:
                type: object
                required:
                - key
                - value
                properties:
                  id:
                    type: string
                    format: uuid
                    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
                    description: Identifier for the metadata object, only required when updating a key-value pair
                  key:
                    type: string
                    maxLength: 20
                    example: Purchase Order
                    description: The metadata object key (20 characters max). It must be unique for the customer.
                  value:
                    type: string
                    maxLength: 100
                    example: '123456789'
                    description: The metadata object value (100 characters max).
                  display_in_invoice:
                    type: boolean
                    example: true
                    description: Determines whether the item or information should be displayed in the invoice. If set to true, the item or information will be included and visible in the generated invoice. If set to false, the item or information will be excluded and not displayed in the invoice.
            skip_invoice_custom_sections:
              type: boolean
              example: false
              description: Set to `true` to exclude all invoice custom sections from PDF generation for this customer only. False by default
            invoice_custom_section_codes:
              type: array
              items:
                type: string
              description: List of unique codes identifying the invoice custom sections.
              example:
              - eu_bank_details
    CustomerObjectExtended:
      allOf:
      - $ref: '#/components/schemas/CustomerObject'
      - type: object
        properties:
