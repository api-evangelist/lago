    CustomerUsageObject:
      type: object
      required:
      - from_datetime
      - to_datetime
      - issuing_date
      - lago_invoice_id
      - currency
      - amount_cents
      - taxes_amount_cents
      - total_amount_cents
      - charges_usage
      properties:
        from_datetime:
          type: string
          format: date-time
          description: The lower bound of the billing period, expressed in the ISO 8601 datetime format in Coordinated Universal Time (UTC).
          example: '2022-07-01T00:00:00Z'
        to_datetime:
          type: string
          format: date-time
          description: The upper bound of the billing period, expressed in the ISO 8601 datetime format in Coordinated Universal Time (UTC).
          example: '2022-07-31T23:59:59Z'
        issuing_date:
          type: string
          format: date
          description: The date of creation of the invoice.
          example: '2022-08-01'
        lago_invoice_id:
          type:
          - string
          - 'null'
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: A unique identifier associated with the invoice related to this particular usage record. It is `null` for the current usage, which is not attached to an invoice yet.
        currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the customer's current usage.
          example: EUR
        amount_cents:
          type: integer
          description: The amount in cents, tax excluded.
          example: 123
        taxes_amount_cents:
          type: integer
          description: The tax amount in cents.
          example: 200
        total_amount_cents:
          type: integer
          description: The total amount in cents, tax included.
          example: 123
        charges_usage:
          type: array
          description: Array of charges that comprise the current usage. It contains detailed information about individual charge items associated with the usage.
          items:
            $ref: '#/components/schemas/CustomerChargeUsageObject'
    ChargeModelEnum:
      type: string
      description: "Specifies the pricing model used for the calculation of the final fee. It can be any of the following values:\n  - [`dynamic`](https://docs.getlago.com/guide/plans/charges/charge-models/dynamic)\n  - [`graduated_percentage`](https://docs.getlago.com/guide/plans/charges/charge-models/graduated-percentage)\n  - [`graduated`](https://docs.getlago.com/guide/plans/charges/charge-models/graduated)\n  - [`package`](https://docs.getlago.com/guide/plans/charges/charge-models/package)\n  - [`percentage`](https://docs.getlago.com/guide/plans/charges/charge-models/percentage)\n  - [`standard`](https://docs.getlago.com/guide/plans/charges/charge-models/standard)\n  - [`volume`](https://docs.getlago.com/guide/plans/charges/charge-models/volume)\n"
      enum:
