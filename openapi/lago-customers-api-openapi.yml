    PaymentRequestObject:
      type: object
      required:
      - lago_id
      - email
      - amount_cents
      - amount_currency
      - payment_status
      - created_at
      - customer
      - invoices
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the payment request, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        email:
          type:
          - string
          - 'null'
          format: email
          example: dinesh@piedpiper.example
          description: The email address used for sending dunning notifications. It defaults to the customer's own email address, and is `null` when the customer has none.
        amount_cents:
          type: integer
          description: The amount the payment request collects, expressed in cents. It is the sum of the amounts still due on the invoices it covers, minus the credit notes offset against those invoices.
          example: 100
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the payment request.
          example: EUR
        payment_status:
          type: string
          enum:
          - pending
          - succeeded
          - failed
          description: 'The status of the payment associated with the payment request. It can have one of the following values:

            - `pending`: the payment has not been processed yet. A payment request starts with this status.

            - `succeeded`: the payment of the payment request has been successfully processed.

            - `failed`: the payment of the payment request has failed or encountered an error during processing.'
          example: succeeded
        created_at:
          type: string
          format: date-time
          description: The date and time when the payment request was created. It is expressed in UTC format according to the ISO 8601 datetime standard. This field provides the timestamp for the exact moment when the payment request was initially created.
          example: '2022-04-29T08:59:51Z'
        customer:
          $ref: '#/components/schemas/CustomerBaseObject'
          description: The customer on which the payment request applies. It refers to the customer account or entity associated with the payment request.
        invoices:
          type: array
          description: The overdue invoices the payment request collects the payment for.
          items:
            $ref: '#/components/schemas/InvoiceBaseObject'
    ApiErrorNotAllowed:
      type: object
      required:
      - status
      - error
      - code
      properties:
        status:
          type: integer
          format: int32
