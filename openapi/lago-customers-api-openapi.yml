    CustomerProjectedChargeFiltersUsageObject:
      type: array
      description: Array of filter object, representing multiple dimensions for a charge item.
      items:
        type: object
        required:
        - values
        - units
        - projected_units
        - events_count
        - amount_cents
        - projected_amount_cents
        properties:
          units:
            type: string
            pattern: ^[0-9]+.?[0-9]*$
            example: '0.9'
            description: The number of units consumed for a specific charge filter related to a charge item.
          projected_units:
            type: string
            pattern: ^[0-9]+.?[0-9]*$
            example: '1.8'
            description: The projected number of units that can be consumed for a specific charge filter related to a charge item.
          amount_cents:
            type: integer
            example: 1000
            description: The amount in cents, tax excluded, consumed for a specific charge filter related to a charge item.
          projected_amount_cents:
            type: integer
            example: 2000
            description: The projected amount in cents, tax excluded, that can be consumed for a specific charge filter related to a charge item.
          events_count:
            type: integer
            example: 10
            description: The quantity of usage events that have been recorded for a particular charge filter during the specified time period. These events may also be referred to as the number of transactions in some contexts.
          invoice_display_name:
            type:
            - string
            - 'null'
            description: Specifies the name that will be displayed on an invoice. It is `null` for the entry that holds the usage recorded outside of any charge filter.
            example: AWS eu-east-1
          pricing_unit_details:
            $ref: '#/components/schemas/UsagePricingUnitDetailsObject'
          values:
            type:
            - object
            - 'null'
            description: List of filter values applied to the usage. It is `null` for the entry that holds the usage recorded outside of any charge filter.
            additionalProperties:
              type: array
              items:
                type: string
            example:
              region:
              - us-east-1
          presentation_breakdowns:
            $ref: '#/components/schemas/PresentationBreakdownsObject'
          projected_presentation_breakdowns:
            $ref: '#/components/schemas/PresentationBreakdownsObject'
    CustomerCheckoutUrl:
      type: object
      required:
      - lago_customer_id
      - external_customer_id
      - payment_provider
      properties:
        lago_customer_id:
          type: string
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system
        external_customer_id:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
          description: The customer external unique identifier (provided by your own application)
        payment_provider:
          type: string
          example: stripe
          description: The Payment Provider name linked to the Customer.
        payment_provider_code:
          type: string
          description: Code of the payment provider
          example: Stripe Prod
        checkout_url:
          type: string
          example: https://foo.bar
          description: The new generated Payment Provider Checkout URL for the Customer.
