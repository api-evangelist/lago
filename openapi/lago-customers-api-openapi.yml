    SubscriptionObject:
      type: object
      required:
      - activated_at
      - activation_rules
      - billing_time
      - canceled_at
      - cancellation_reason
      - consolidate_invoice
      - created_at
      - current_billing_period_ending_at
      - current_billing_period_started_at
      - downgrade_plan_date
