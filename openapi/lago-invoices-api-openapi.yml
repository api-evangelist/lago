openapi: 3.2.0
info:
  title: Lago API documentation Invoices API
  description: Lago API allows your application to push customer information and metrics (events) from your application to the billing application.
  version: 1.55.0
  license:
    name: AGPLv3
    url: https://github.com/getlago/lago-openapi/blob/main/LICENSE
  contact:
    email: tech@getlago.com
servers:
- url: https://api.getlago.com/api/v1
  description: US Lago cluster
- url: https://api.eu.getlago.com/api/v1
  description: EU Lago cluster
security:
- bearerAuth: []
tags:
- name: Invoices
  description: Everything about Invoice collection
  externalDocs:
    description: Find out more
    url: https://getlago.com/docs/api-reference/invoices/invoice-object
paths:
  /customers/{external_customer_id}/invoices:
    get:
      tags:
      - Invoices
      summary: List all customer's invoices
      description: This endpoint is used for retrieving all invoices of a customer.
      operationId: findAllCustomerInvoices
      parameters:
      - $ref: '#/components/parameters/external_customer_id_path'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: amount_from
        in: query
        description: Filter invoices of at least a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 9000
      - name: amount_to
        in: query
        description: Filter invoices up to a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 100000
      - name: issuing_date_from
        in: query
        description: Filter invoices starting from a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-07-08'
      - name: issuing_date_to
        in: query
        description: Filter invoices up to a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-08-09'
      - name: status
        in: query
        description: Filter invoices by status. Possible values are `draft`, `failed`, `finalized`, `pending` and `voided`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - draft
          - finalized
          - failed
          - pending
          - voided
      - name: statuses[]
        in: query
        description: Filter invoices by statuses. Possible values are `draft`, `failed`, `finalized`, `pending` and `voided`.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - draft
            - finalized
            - failed
            - pending
            - voided
      - name: payment_status
        in: query
        description: Filter invoices by payment status. Possible values are `pending`, `failed` or `succeeded`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - pending
          - failed
          - succeeded
      - name: payment_statuses[]
        in: query
        description: Filter invoices by payment statuses. Possible values are `pending`, `failed` or `succeeded`.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - pending
            - failed
            - succeeded
      - name: payment_overdue
        in: query
        description: Filter invoices by payment_overdue. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: search_term
        in: query
        description: Search the customer's invoices by id or number. Customer attributes are not searched here, because the list is already scoped to one customer.
        required: false
        explode: true
        schema:
          type: string
          example: Jane
      - name: payment_dispute_lost
        in: query
        description: Filter invoices with a payment dispute lost. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: invoice_type
        in: query
        description: Filter invoices by invoice type. Possible values are `subscription`, `add_on`, `credit`, `one_off`, `advance_charges` or `progressive_billing`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - subscription
          - add_on
          - credit
          - one_off
          - advance_charges
          - progressive_billing
      - name: self_billed
        in: query
        description: Filter invoices by self billed. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: currency
        in: query
        description: Filter invoices by currency. Possible values ISO 4217 currency codes.
        required: false
        explode: true
        schema:
          type: string
          example: EUR
      - name: partially_paid
        in: query
        description: Filter invoices that are partially paid. When `true`, only invoices with a non-zero amount paid that is below the total due are returned. When `false`, those invoices are excluded.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: settlements[]
        in: query
        description: Filter invoices settled by at least one of the given settlement types. `payment` matches invoices settled by a payment, `credit_note` matches invoices settled by a credit note.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - payment
            - credit_note
          example:
          - payment
          - credit_note
      - name: billing_entity_codes[]
        in: query
        description: Filter invoices by billing entity codes. Possible values are the billing entity codes you have created.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - acme_corp
          - foo_bar
      - name: metadata[key]
        in: query
        description: Filter invoices by metadata. Replace `key` with the actual metadata key you want to match, and provide the corresponding value. Providing empty value will search for invoice without given metadata key. For example, `metadata[color]=blue`.
        required: false
        explode: true
        schema:
          type: string
          example: someValue
      - $ref: '#/components/parameters/purchase_order_number'
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicesPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /invoices:
    post:
      tags:
      - Invoices
      summary: Create a one-off invoice
      description: This endpoint is used for issuing a one-off invoice.
      operationId: createInvoice
      requestBody:
        description: Invoice payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceOneOffCreateInput'
        required: true
      responses:
        '200':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - Invoices
      summary: List all invoices
      description: This endpoint is used for retrieving all invoices.
      operationId: findAllInvoices
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/external_customer_id'
      - name: amount_from
        in: query
        description: Filter invoices of at least a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 9000
      - name: amount_to
        in: query
        description: Filter invoices up to a specific amount. This parameter must be defined in cents to ensure consistent handling for all currency types.
        required: false
        explode: true
        schema:
          type: integer
          example: 100000
      - name: issuing_date_from
        in: query
        description: Filter invoices starting from a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-07-08'
      - name: issuing_date_to
        in: query
        description: Filter invoices up to a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2022-08-09'
      - name: status
        in: query
        description: Filter invoices by status. Possible values are `draft`, `failed`, `finalized`, `pending` and `voided`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - draft
          - finalized
          - failed
          - pending
          - voided
      - name: statuses[]
        in: query
        description: Filter invoices by statuses. Possible values are `draft`, `failed`, `finalized`, `pending` and `voided`.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - draft
            - finalized
            - failed
            - pending
            - voided
      - name: payment_status
        in: query
        description: Filter invoices by payment status. Possible values are `pending`, `failed` or `succeeded`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - pending
          - failed
          - succeeded
      - name: payment_statuses[]
        in: query
        description: Filter invoices by payment statuses. Possible values are `pending`, `failed` or `succeeded`.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - pending
            - failed
            - succeeded
      - name: payment_overdue
        in: query
        description: Filter invoices by payment_overdue. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: search_term
        in: query
        description: Search invoices by id, number, purchase order number, or by the name, legal name, first name, last name, external_id or email of the customer.
        required: false
        explode: true
        schema:
          type: string
          example: Jane
      - name: currency
        in: query
        description: Filter invoices by currency. Possible values ISO 4217 currency codes.
        required: false
        explode: true
        schema:
          type: string
          example: EUR
      - name: payment_dispute_lost
        in: query
        description: Filter invoices with a payment dispute lost. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: partially_paid
        in: query
        description: Filter invoices that are partially paid. When `true`, only invoices with a non-zero amount paid that is below the total due are returned. When `false`, those invoices are excluded.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: settlements[]
        in: query
        description: Filter invoices settled by at least one of the given settlement types. `payment` matches invoices settled by a payment, `credit_note` matches invoices settled by a credit note.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - payment
            - credit_note
          example:
          - payment
          - credit_note
      - name: invoice_type
        in: query
        description: Filter invoices by invoice type. Possible values are `subscription`, `add_on`, `credit`, `one_off`, `advance_charges` or `progressive_billing`.
        required: false
        explode: true
        schema:
          type: string
          enum:
          - subscription
          - add_on
          - credit
          - one_off
          - advance_charges
          - progressive_billing
      - name: self_billed
        in: query
        description: Filter invoices by self billed. Possible values are `true` or `false`.
        required: false
        explode: true
        schema:
          type: boolean
          example: true
      - name: billing_entity_codes[]
        in: query
        description: Filter invoices by billing entity codes. Possible values are the billing entity codes you have created.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - acme_corp
          - foo_bar
      - name: metadata[key]
        in: query
        description: Filter invoices by metadata. Replace `key` with the actual metadata key you want to match, and provide the corresponding value. Providing empty value will search for invoice without given metadata key. For example, `metadata[color]=blue`.
        required: false
        explode: true
        schema:
          type: string
          example: someValue
      - $ref: '#/components/parameters/purchase_order_number'
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicesPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /invoices/{lago_id}:
    parameters:
    - $ref: '#/components/parameters/lago_invoice_id'
    put:
      tags:
      - Invoices
      summary: Update an invoice
      description: This endpoint is used for updating an existing invoice. A voided invoice cannot be updated and returns a `405` error.
      operationId: updateInvoice
      requestBody:
        description: Update an existing invoice
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceUpdateInput'
        required: true
      responses:
        '200':
          description: Invoice updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - Invoices
      summary: Retrieve an invoice
      description: This endpoint is used for retrieving a specific invoice that has been issued.
      operationId: findInvoice
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Invoices
      summary: Delete a draft invoice
      description: 'This endpoint is used for permanently deleting a `draft` invoice. Deleting a draft invoice removes it entirely: it never becomes accounts receivable, consumes no invoice number, and disappears from every list, export, and analytics surface. Only invoices in the `draft` status can be deleted; for a `finalized` invoice, void it instead.'
      operationId: deleteInvoice
      responses:
        '200':
          description: Invoice deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
  /invoices/{lago_id}/download:
    post:
      tags:
      - Invoices
      summary: Download an invoice PDF
      parameters:
      - $ref: '#/components/parameters/lago_invoice_id'
      description: 'This endpoint is used for downloading a specific invoice PDF document. Only `finalized` invoices can be downloaded; any other invoice returns a `404` error.

        When the PDF has already been generated, the invoice object is returned and its `file_url` points to the document. When it has not been generated yet, the response is a `200` with an empty body and the generation starts in the background. Call the endpoint again to get the invoice object with its `file_url`.'
      operationId: downloadInvoice
      responses:
        '200':
          description: Invoice PDF
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{lago_id}/finalize:
    put:
      tags:
      - Invoices
      summary: Finalize a draft invoice
      description: This endpoint is used for finalizing a draft invoice.
      parameters:
      - $ref: '#/components/parameters/lago_invoice_id'
      operationId: finalizeInvoice
      responses:
        '200':
          description: Invoice finalized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{lago_id}/lose_dispute:
    post:
      tags:
      - Invoices
      summary: Mark an invoice payment dispute as lost
      description: This endpoint is used for setting invoice's payment dispute as lost.
      parameters:
      - $ref: '#/components/parameters/lago_invoice_id'
      operationId: loseDisputeInvoice
      responses:
        '200':
          description: Invoice payment dispute lost
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
  /invoices/{lago_id}/refresh:
    put:
      tags:
      - Invoices
      summary: Refresh a draft invoice
      description: This endpoint is used for refreshing a draft invoice.
      parameters:
      - $ref: '#/components/parameters/lago_invoice_id'
      operationId: refreshInvoice
      responses:
        '200':
          description: Invoice refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{lago_id}/retry:
    post:
      tags:
      - Invoices
      summary: Retry generation of a failed invoice
      description: This endpoint is used for retrying to generate a failed invoice.
      parameters:
      - $ref: '#/components/parameters/lago_invoice_id'
      operationId: retryInvoice
      responses:
        '200':
          description: Invoice generation has been retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
  /invoices/{lago_id}/payment_url:
    post:
      tags:
      - Invoices
      summary: Generate a payment URL
      description: This endpoint generates a checkout link for a specific invoice.
      parameters:
      - $ref: '#/components/parameters/lago_invoice_id'
      operationId: invoicePaymentUrl
      responses:
        '200':
          description: Payment URL has been generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePaymentUrl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /invoices/preview:
    post:
      tags:
      - Invoices
      summary: Create an invoice preview
      description: This endpoint is used for generating invoice preview.
      operationId: invoicePreview
      requestBody:
        description: Invoice preview payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePreviewInput'
        required: true
      responses:
        '200':
          description: Invoice preview created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /invoices/{lago_id}/retry_payment:
    post:
      tags:
      - Invoices
      summary: Retry an invoice payment
      description: This endpoint resends an invoice for collection and retry a payment.
      parameters:
      - $ref: '#/components/parameters/lago_invoice_id'
      operationId: retryPayment
      requestBody:
        description: Payment method to use for the retry (optional)
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method:
                  $ref: '#/components/schemas/PaymentMethodReference'
      responses:
        '200':
          description: Invoice payment retried
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
  /invoices/{lago_id}/void:
    post:
      tags:
      - Invoices
      summary: Void an invoice
      description: 'This endpoint is used for voiding an invoice.

        • When no body parameters are provided, the invoice can be voided only if it is in a `finalized` status and its payment status is NOT `succeeded`.

        • When `generate_credit_note` is provided (optionally with `refund_amount` and/or `credit_amount`), this validation is bypassed: the invoice is forcibly voided and a credit note is generated. If the specified refund/credit amounts do not cover the full invoice total, the remainder is issued on a second credit note that is created and immediately voided.'
      parameters:
      - $ref: '#/components/parameters/lago_invoice_id'
      requestBody:
        description: Void invoice payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceVoidInput'
        required: false
      operationId: voidInvoice
      responses:
        '200':
          description: Invoice voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/NotAllowed'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
