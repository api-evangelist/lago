    InvoiceCustomSectionObject:
      type: object
      required:
      - lago_id
      - name
      - code
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier for the invoice custom section in the Lago application, generated by Lago to ensure record uniqueness within the system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        name:
          type: string
          description: Name of the invoice custom section.
          example: EU Bank Details
        code:
          type: string
          description: Unique code identifying the invoice custom section for the API request.
          example: eu_bank_details
        description:
          type: string
          description: Internal description of the invoice custom section.
          example: This section contains the bank details for EU customers.
        details:
          type: string
          description: The value shown on the invoice PDF.
          example: 'Bank Name: Lago Bank, IBAN: FR7630004000031234567890143'
        display_name:
          type: string
          description: The name of the invoice custom section displayed on the invoice.
          example: 'Bank Details:'
        applied_to_organization:
          type: boolean
          deprecated: true
          description: '**Deprecated.** This field will be removed in a future version. When set to true, it applies the invoice custom section to the organization''s default billing entity. To apply or remove an invoice custom section from any billing entity (including the default one), please use the `PUT /billing_entities/:code` endpoint instead.'
          example: true
        organization_id:
          type: string
          format: uuid
          description: Unique identifier for the organization associated with the invoice custom section.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        created_at:
          type: string
          format: date-time
          description: Creation date of the tax.
          example: '2023-07-06T14:35:58Z'
    BillingEntityObject:
      type: object
      description: Billing entity object
      required:
      - lago_id
      - code
      - name
      - default_currency
      - document_locale
      - document_numbering
      - document_number_prefix
      - finalize_zero_amount_invoice
      - invoice_footer
      - invoice_grace_period
      - subscription_invoice_issuing_date_anchor
      - subscription_invoice_issuing_date_adjustment
      - is_default
      - net_payment_term
      - address_line1
      - address_line2
      - phone
      - city
      - state
      - country
      - zipcode
      - email
      - legal_name
      - legal_number
      - tax_identification_number
      - timezone
      - email_settings
      - eu_tax_management
      - einvoicing
      - logo_url
      - created_at
      - updated_at
      properties:
        lago_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: A unique identifier for the billing entity in the Lago application
        code:
          type: string
          example: acme_corp
          description: The unique code of the billing entity
        name:
          type: string
          example: Acme Corp
          description: The name of the billing entity
        default_currency:
          $ref: '#/components/schemas/Currency'
          description: The default currency of the billing entity
          example: USD
        document_locale:
          type: string
          example: en
          description: The language of the documents generated for this billing entity, in the ISO 639-1 format.
        document_numbering:
          type: string
          enum:
          - per_customer
          - per_billing_entity
          description: 'The type of document numbering for this billing entity:

            - `per_customer`: document numbers are unique per customer

            - `per_billing_entity`: document numbers are unique per billing entity'
          example: per_customer
        document_number_prefix:
          type:
          - string
          - 'null'
          example: ABC-123
          description: The prefix used in document numbers for this billing entity. It is upper cased. When no prefix is given at creation, Lago builds one from the first three letters of the name and the last four characters of the identifier.
        finalize_zero_amount_invoice:
          type: boolean
          example: true
          description: Whether to finalize invoices with zero amount for this billing entity
        invoice_footer:
          type:
          - string
          - 'null'
          example: Thank you for your business
          description: The footer text to be displayed on invoices for this billing entity
        invoice_grace_period:
          type: integer
          example: 0
          description: The grace period (in days) for invoice finalization
        subscription_invoice_issuing_date_anchor:
          type: string
          description: Defines whether the issuing date follows the current billing period's end date or the next period starting date.
          enum:
          - current_period_end
          - next_period_start
          default: next_period_start
        subscription_invoice_issuing_date_adjustment:
          type: string
          description: The logic applied on top of the subscription_invoice_issuing_date_anchor rule. You can opt to use the invoice finalization date, that includes any configured grace period.
          enum:
          - align_with_finalization_date
          - keep_anchor
          default: align_with_finalization_date
        is_default:
          type: boolean
          example: false
          description: Whether this billing entity is the organization's default billing entity. The default billing entity is the oldest active one, and is used as a fallback whenever no billing entity is provided, for example when an invoice is created. This flag cannot be changed.
        net_payment_term:
          type: integer
          example: 0
          description: The net payment term (in days) for this billing entity
        address_line1:
          type:
          - string
          - 'null'
          example: 5230 Penfield Ave
          description: The first line of the billing address
        address_line2:
          type:
          - string
          - 'null'
          example: Suite 100
          description: The second line of the billing address
        phone:
          type:
          - string
          - 'null'
          example: 1-171-883-3711 x245
          description: The phone number of the billing entity
        city:
          type:
          - string
          - 'null'
          example: Woodland Hills
          description: The city of the billing address
        state:
          type:
          - string
          - 'null'
          example: CA
          description: The state of the billing address
        country:
          $ref: '#/components/schemas/CountryOrNull'
          description: The country code of the billing address
        zipcode:
          type:
          - string
          - 'null'
          example: '91364'
          description: The zipcode of the billing address
        email:
          type:
          - string
          - 'null'
          format: email
          example: billing@acme.com
          description: The email address of the billing entity
        legal_name:
          type:
          - string
          - 'null'
          example: Acme Corporation
          description: The legal name of the billing entity
        legal_number:
          type:
          - string
          - 'null'
          example: US123456789
          description: The legal registration number of the billing entity
        tax_identification_number:
          type:
          - string
          - 'null'
          example: EU123456789
          description: The tax identification number of the billing entity
        timezone:
          $ref: '#/components/schemas/Timezone'
          description: The timezone of the billing entity
          example: UTC
        email_settings:
          type: array
          items:
            type: string
            enum:
            - invoice.finalized
            - credit_note.created
            - payment_receipt.created
          description: The email notification settings for this billing entity
        eu_tax_management:
          type:
          - boolean
          - 'null'
          example: false
          description: Whether EU tax management is enabled for this billing entity. It can only be enabled when the billing entity country is in the European Union.
        einvoicing:
          type: boolean
          example: false
          description: Whether e-invoicing is enabled for this billing entity. It can only be enabled when the billing entity country is `FR` or `DE`.
        logo_url:
          type:
          - string
          - 'null'
          format: uri
          example: https://getlago.com/logo.png
          description: The URL of the billing entity's logo
        created_at:
          type: string
          format: date-time
          example: '2022-04-29T08:59:51Z'
          description: The date and time when the billing entity was created
        updated_at:
          type: string
          format: date-time
          example: '2022-04-29T08:59:51Z'
          description: The date and time when the billing entity was last updated
    TaxCodes:
      type: array
      items:
        type: string
      description: List of unique code used to identify the taxes.
      example:
      - french_standard_vat
    BillingEntityCreateInput:
      type: object
      description: Billing entity create input
      required:
      - billing_entity
      properties:
        billing_entity:
          type: object
          required:
          - code
          - name
          properties:
            code:
              type: string
              example: acme_corp
              description: The unique code of the billing entity
            name:
              type: string
              example: Acme Corp
              description: The name of the billing entity
            default_currency:
              $ref: '#/components/schemas/Currency'
              description: The default currency of the billing entity
              example: USD
            document_numbering:
              type: string
              enum:
              - per_customer
              - per_billing_entity
              description: 'The type of document numbering for this billing entity:

