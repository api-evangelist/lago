    OrderObjectExtended:
      allOf:
      - $ref: '#/components/schemas/OrderObject'
      - type: object
        required:
        - billing_snapshot
        properties:
          billing_snapshot:
            $ref: '#/components/schemas/QuoteBillingItems'
            description: The billing items of the quote version the order comes from, as they stood when it was approved. This is what the execution applies. It is omitted from the webhook payloads, being a heavy blob.
    QuoteBillingItems:
      type:
      - object
      - 'null'
      description: "A snapshot of everything the quote bills. Unlike the rest of the Lago API, the keys nested in this object are camelCased: the object is stored and returned as it is authored in the Lago user interface.\n\nWhich top-level keys are present depends on the `order_type` of the parent quote:\n  - `one_off`: `addOns`.\n  - `subscription_creation` and `subscription_amendment`: `plans`, plus the optional `coupons` and `walletCredits`.\n\nEvery entry pins the catalog record it was built from through its `id` and its `payload`, so that an approved quote keeps billing what was approved even if the catalog changes afterwards. The optional `overrides` object carries the deviations from that record negotiated on the quote.\n\nThis object is the single source of truth for the term of the deal. Three of its nested dates bound that term, because the execution flow refuses them once past: `plans[].payload.endDate`, `walletCredits[].payload.expirationAt` and the `expirationAt` of a wallet credit's recurring top-up rule. The earliest of them is the day the deal stops being executable, and both the signing window and the execution date must fall strictly before it. A `one_off` quote carries none of them and is never bounded.\n\nOn a `draft` version this object may be incomplete: only the properties documented as required below are enforced on every save, the others are enforced when the version is approved.\n"
      properties:
        addOns:
          type: array
          description: The add-ons billed once by a `one_off` quote. At least one entry is required to approve the version.
          items:
            $ref: '#/components/schemas/QuoteBillingItemAddOnObject'
        plans:
          type: array
          description: The plans subscribed to, or amended, by a `subscription_creation` or `subscription_amendment` quote. At least one entry is required to approve the version.
          items:
            $ref: '#/components/schemas/QuoteBillingItemPlanObject'
        coupons:
          type: array
          description: The coupons applied to the customer when the quote is executed.
          items:
            $ref: '#/components/schemas/QuoteBillingItemCouponObject'
        walletCredits:
          type: array
          description: The prepaid credit wallets created for the customer when the quote is executed.
          items:
            $ref: '#/components/schemas/QuoteBillingItemWalletCreditObject'
    QuoteOrderTypeEnum:
      type: string
      description: "The commercial motion the quote describes. It can be any of the following values:\n  - `subscription_creation`: the quote creates one or more subscriptions.\n  - `subscription_amendment`: the quote amends an existing subscription, named by the quote's own `lago_subscription_id`.\n  - `one_off`: the quote bills add-ons once, without any subscription.\n"
      enum:
      - subscription_creation
      - subscription_amendment
      - one_off
      example: subscription_creation
  parameters:
