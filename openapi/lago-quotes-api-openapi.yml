openapi: 3.2.0
info:
  title: Lago API documentation Quotes API
  description: Lago API allows your application to push customer information and metrics (events) from your application to the billing application.
  version: 1.55.0
  license:
    name: AGPLv3
    url: https://github.com/getlago/lago-openapi/blob/main/LICENSE
  contact:
    email: tech@getlago.com
servers:
- url: https://api.getlago.com/api/v1
  description: US Lago cluster
- url: https://api.eu.getlago.com/api/v1
  description: EU Lago cluster
security:
- bearerAuth: []
tags:
- name: Quotes
  description: Everything about Quote collection
paths:
  /quotes:
    get:
      tags:
      - Quotes
      summary: List all quotes
      description: 'This endpoint is used to list all existing quotes.

        Quotes are ordered by creation date, from the most recent to the oldest.

        This is a premium feature.'
      operationId: findAllQuotes
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: status[]
        in: query
        description: Filter quotes by the status of their current version. Possible values are `draft`, `approved` and `voided`.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - draft
            - approved
            - voided
      - name: order_type[]
        in: query
        description: Filter quotes by order type. Possible values are `subscription_creation`, `subscription_amendment` and `one_off`.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - subscription_creation
            - subscription_amendment
            - one_off
      - name: number[]
        in: query
        description: Filter quotes by their number, as assigned by Lago.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            pattern: ^QT-\d{4}-\d{4,}$
          example:
          - QT-2026-0001
          - QT-2026-0002
      - name: owner_id[]
        in: query
        description: Filter quotes by the Lago identifiers of the users owning them.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            format: uuid
          example:
          - 1a901a90-1a90-1a90-1a90-1a901a901a90
      - name: external_customer_id[]
        in: query
        description: Filter quotes by the external unique identifiers of their customers (provided by your own application).
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - external_id_1234
      - name: from_date
        in: query
        description: Filter quotes created from a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2026-01-01'
      - name: to_date
        in: query
        description: Filter quotes created up to a specific date.
        required: false
        explode: true
        schema:
          type: string
          format: date
          example: '2026-12-31'
      responses:
        '200':
          description: Quotes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotesPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /quotes/{lago_id}:
    parameters:
    - $ref: '#/components/parameters/lago_quote_id'
    get:
      tags:
      - Quotes
      summary: Retrieve a quote
      description: 'This endpoint retrieves a specific quote, along with its owners and its current version.

        This is a premium feature.'
      operationId: findQuote
      responses:
        '200':
          description: Quote
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /quotes/{lago_id}/versions:
    parameters:
    - $ref: '#/components/parameters/lago_quote_id'
    get:
      tags:
      - Quotes
      summary: List all versions of a quote
      description: 'This endpoint is used to list all the versions of a specific quote, from the most recent to the oldest.

        The `content` and `billing_items` of each version are omitted; retrieve a version to get them.

        This is a premium feature.'
      operationId: findAllQuoteVersions
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Quote versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteVersionsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /quote_versions/{lago_id}:
    parameters:
    - $ref: '#/components/parameters/lago_quote_version_id'
    get:
      tags:
      - Quotes
      summary: Retrieve a quote version
      description: 'This endpoint retrieves a specific quote version, along with its document `content` and its `billing_items`.

        This is a premium feature.'
      operationId: findQuoteVersion
      responses:
        '200':
          description: Quote version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /quote_versions/{lago_id}/approve:
    parameters:
    - $ref: '#/components/parameters/lago_quote_version_id'
    post:
      tags:
      - Quotes
      summary: Approve a quote version
      description: 'This endpoint approves a quote version and generates the order form to send to the customer for signature.

        Only a `draft` version can be approved, and its `billing_items` must be complete: approval validates them against the catalog and against the customer, and returns a `422` when the deal cannot be executed as quoted.

        The `expires_at` of the generated order form is bounded by the deal''s own term, so a signing window reaching beyond the day the deal stops being executable is rejected.

        A concurrent write on the same quote is reported as a `422` rather than retried, so a duplicated call can fail while the first one is still in flight.

        This is a premium feature.'
      operationId: approveQuoteVersion
      requestBody:
        description: Approve quote version payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteVersionApproveInput'
        required: false
      responses:
        '200':
          description: Quote version approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /quote_versions/{lago_id}/void:
    parameters:
    - $ref: '#/components/parameters/lago_quote_version_id'
    post:
      tags:
      - Quotes
      summary: Void a quote version
      description: 'This endpoint voids a quote version, which makes it definitive: a voided version can neither be edited nor approved again.

        Only a `draft` version can be voided through this endpoint, and the resulting `void_reason` is `manual`. An `approved` version is voided by Lago itself, through the order form generated from it.

        A concurrent write on the same quote is reported as a `422` rather than retried, so a duplicated call can fail while the first one is still in flight.

        This is a premium feature.'
      operationId: voidQuoteVersion
      responses:
        '200':
          description: Quote version voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /quote_versions/{lago_id}/clone:
    parameters:
    - $ref: '#/components/parameters/lago_quote_version_id'
    post:
      tags:
      - Quotes
      summary: Clone a quote version
      description: 'This endpoint copies a quote version into a new `draft` version of the same quote, so that the deal can be renegotiated.

        Any version of the quote can be cloned, but a quote can only carry one active version: the draft the quote currently holds, if any, is voided with the `superseded` reason. Cloning is therefore rejected with a `422` once a version of the quote has been approved.

        A concurrent write on the same quote is reported as a `422` rather than retried, so a duplicated call can fail while the first one is still in flight.

        This is a premium feature.'
      operationId: cloneQuoteVersion
      responses:
        '200':
          description: Quote version cloned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  schemas:
    PaginationMeta:
      type: object
      required:
      - current_page
      - total_pages
      - total_count
      properties:
        current_page:
          type: integer
          description: Current page.
          example: 2
        next_page:
          type:
          - integer
          - 'null'
          description: Next page.
          example: 3
        prev_page:
          type:
          - integer
          - 'null'
          description: Previous page.
          example: 1
        total_pages:
          type: integer
          description: Total number of pages.
          example: 4
        total_count:
          type: integer
          description: Total number of records.
          example: 70
    QuotesPaginated:
      type: object
      required:
      - quotes
      - meta
      properties:
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/QuoteObject'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    QuoteVersion:
      type: object
      required:
      - quote_version
      properties:
        quote_version:
          $ref: '#/components/schemas/QuoteVersionObjectExtended'
    QuoteBillingItemCouponObject:
      type: object
      required:
      - id
      - localId
      - type
      - payload
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the coupon in Lago, pinned when the entry was added to the quote.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        localId:
          type: string
          description: Identifier of the entry within the quote version, assigned by the Lago user interface. It allows the quote document to reference the entry.
          example: b5c1e2a4-4e1e-4a7f-9f0e-9c1a0c7e1f2b
        type:
          type: string
          description: The kind of billing item.
          enum:
          - coupon
          example: coupon
        payload:
          type: object
          description: A snapshot of the coupon as it was added to the quote. `code` and `type` are required to approve the version.
          properties:
            code:
              type: string
              description: Unique code identifying the coupon.
              example: welcome_offer
            type:
              type: string
              description: Whether the coupon deducts a fixed amount or a percentage.
              enum:
              - fixed_amount
              - percentage
              example: fixed_amount
            amountCents:
              type:
              - integer
              - 'null'
              description: The amount deducted by the coupon, in cents. Only for a `fixed_amount` coupon.
              example: 10000
            currency:
              $ref: '#/components/schemas/CurrencyOrNull'
              description: The currency of `amountCents`. Only for a `fixed_amount` coupon.
            percentageRate:
              type:
              - number
              - 'null'
              description: The percentage deducted by the coupon. Only for a `percentage` coupon. It must be greater than 0.
              example: 10.5
            frequency:
              type:
              - string
              - 'null'
              description: How often the coupon is deducted.
              enum:
              - null
              - once
              - recurring
              - forever
              example: once
            frequencyDuration:
              type:
              - integer
              - 'null'
              description: The number of billing periods the coupon is deducted over. Only for a `recurring` coupon. It must be greater than 0.
              example: 3
        overrides:
          type:
          - object
          - 'null'
          description: The deviations from the coupon snapshot negotiated on the quote. Only the properties set here are overridden.
          properties:
            amountCents:
              type:
              - integer
              - 'null'
              description: Overrides the amount deducted by the coupon, in cents.
              example: 15000
            amountCurrency:
              $ref: '#/components/schemas/CurrencyOrNull'
              description: Overrides the currency the coupon is priced in, which is how a catalog coupon is quoted in the currency of the deal. The figure in `amountCents` is not converted, it is restated in this currency. It is set only while it differs from the catalog record, and removed once they agree.
            percentageRate:
              type:
              - number
              - 'null'
              description: Overrides the percentage deducted by the coupon. It must be greater than 0.
              example: 15
            frequency:
              type:
              - string
              - 'null'
              description: Overrides how often the coupon is deducted.
              enum:
              - null
              - once
              - recurring
              - forever
              example: recurring
            frequencyDuration:
              type:
              - integer
              - 'null'
              description: Overrides the number of billing periods the coupon is deducted over. It must be greater than 0.
              example: 6
    QuoteObjectExtended:
      allOf:
      - $ref: '#/components/schemas/QuoteObject'
      - type: object
        required:
        - owners
        properties:
          owners:
            type: array
            description: The users of the organization responsible for the quote.
            items:
              $ref: '#/components/schemas/QuoteOwnerObject'
    QuoteVersionApproveInput:
      type: object
      description: Parameters available when approving a quote version.
      required: []
      properties:
        expires_at:
          type: string
          format: date-time
          description: The date and time in UTC (ISO 8601) when the order form generated by the approval expires. It must be in the future, and must fall strictly before the day the quoted deal stops being executable, otherwise the approval is rejected with a `422`. That boundary is the earliest of the `endDate` of any quoted plan and the `expirationAt` of any quoted wallet credit or recurring top-up rule. A `one_off` quote carries none of them, so its signing window is never bounded. When `expires_at` is omitted, the order form never expires.
          example: '2026-06-30T23:59:59Z'
    QuoteVersionStatusEnum:
      type: string
      description: "The status of the quote version. It can be any of the following values:\n  - `draft`: the version is still editable.\n  - `approved`: the version has been approved and an order form has been generated from it.\n  - `voided`: the version is no longer actionable.\n\nA quote has at most one version in `draft` or `approved` status at any time; all the other versions are `voided`.\n"
      enum:
      - draft
      - approved
      - voided
      example: draft
    QuoteObject:
      allOf:
      - $ref: '#/components/schemas/QuoteBaseObject'
      - type: object
        required:
        - current_version
        properties:
          current_version:
            oneOf:
            - $ref: '#/components/schemas/QuoteVersionObject'
            - type: 'null'
            description: The latest version of the quote. Its `content` and `billing_items` are omitted here; retrieve the version to get them.
    Quote:
      type: object
      required:
      - quote
      properties:
        quote:
          $ref: '#/components/schemas/QuoteObjectExtended'
    QuoteVersionObjectExtended:
      allOf:
      - $ref: '#/components/schemas/QuoteVersionObject'
      - type: object
        required:
        - content
        - billing_items
        properties:
          content:
            type:
            - string
            - 'null'
            description: The HTML body of the quote document, as authored in the Lago user interface. It may reference the entries of `billing_items` through their `localId`.
            example: <h1>Quote QT-2026-0001</h1><p>Prepared for Acme Corp.</p>
          billing_items:
            $ref: '#/components/schemas/QuoteBillingItems'
    ApiErrorForbidden:
      type: object
      required:
      - status
      - error
      - code
      properties:
        status:
          type: integer
          format: int32
          example: 403
        error:
          type: string
          example: Forbidden
        code:
          type: string
          example: feature_unavailable
    QuoteOwnerObject:
      type: object
      required:
      - lago_id
      - email
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the user owning the quote, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        email:
          type:
          - string
          - 'null'
          format: email
          description: The email address of the user owning the quote.
          example: sales@getlago.com
    QuoteBillingItemAddOnObject:
      type: object
      required:
      - id
      - localId
      - type
      - payload
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the add-on in Lago, pinned when the entry was added to the quote.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        localId:
          type: string
          description: Identifier of the entry within the quote version, assigned by the Lago user interface. It allows the quote document to reference the entry.
          example: b5c1e2a4-4e1e-4a7f-9f0e-9c1a0c7e1f2b
        type:
          type: string
          description: The kind of billing item.
          enum:
          - add_on
          example: add_on
        payload:
          type: object
          description: A snapshot of the add-on as it was added to the quote. `code`, `units`, `unitAmountCents` and `totalAmountCents` are required to approve the version.
          properties:
            code:
              type: string
              description: Unique code identifying the add-on.
              example: setup_fee
            units:
              type: number
              description: The number of units billed. It must be greater than 0.
              example: 1
            unitAmountCents:
              type: integer
              description: The amount of one unit, in cents, in the currency of the quote version.
              example: 10000
            totalAmountCents:
              type: integer
              description: The total amount billed for the entry, in cents, in the currency of the quote version.
              example: 10000
            fromDatetime:
              type:
              - string
              - 'null'
              format: date-time
              description: The beginning of the period covered by the entry, in UTC (ISO 8601).
              example: '2026-01-01T00:00:00Z'
            toDatetime:
              type:
              - string
              - 'null'
              format: date-time
              description: The end of the period covered by the entry, in UTC (ISO 8601).
              example: '2026-12-31T23:59:59Z'
        overrides:
          type: object
          description: The deviations from the add-on snapshot negotiated on the quote. Only the properties set here are overridden.
          properties:
            description:
              type: string
              description: Overrides the description of the add-on.
              example: Onboarding package, discounted for the first year
            units:
              type: number
              description: Overrides the number of units billed. It must be greater than 0.
              example: 2
            unitAmountCents:
              type: integer
              description: Overrides the amount of one unit, in cents.
              example: 8000
            totalAmountCents:
              type: integer
              description: Overrides the total amount billed for the entry, in cents.
              example: 16000
            invoiceDisplayName:
              type: string
              description: Overrides the name of the add-on as it appears on the invoice.
              example: Onboarding
            fromDatetime:
              type:
              - string
              - 'null'
              format: date-time
              description: Overrides the beginning of the period covered by the entry, in UTC (ISO 8601).
              example: '2026-01-01T00:00:00Z'
            toDatetime:
              type:
              - string
              - 'null'
              format: date-time
              description: Overrides the end of the period covered by the entry, in UTC (ISO 8601).
              example: '2026-12-31T23:59:59Z'
    QuoteVersionVoidReasonEnum:
      type:
      - string
      - 'null'
      description: "The reason why the quote version was voided. It is `null` unless the `status` is `voided`. It can be any of the following values:\n  - `manual`: voided explicitly, through the API or the Lago user interface.\n  - `superseded`: voided because the version was cloned into a new draft.\n  - `cascade_of_expired`: voided because the order form generated from the version expired.\n  - `cascade_of_voided`: voided because the order form generated from the version was voided.\n"
      enum:
      - null
      - manual
      - superseded
      - cascade_of_expired
      - cascade_of_voided
      example: manual
    ApiErrorUnprocessableEntity:
      type: object
      required:
      - status
      - error
      - code
      - error_details
      properties:
        status:
          type: integer
          format: int32
          example: 422
        error:
          type: string
          example: Unprocessable entity
        code:
          type: string
          example: validation_errors
        error_details:
          type: object
    QuoteVersionObject:
      type: object
      required:
      - lago_id
      - lago_quote_id
      - lago_organization_id
      - version
      - status
      - currency
      - billing_entity_code
      - void_reason
      - approved_at
      - voided_at
      - created_at
      - updated_at
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the quote version, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_quote_id:
          type: string
          format: uuid
          description: Unique identifier of the quote the version belongs to, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_organization_id:
          type: string
          format: uuid
          description: Unique identifier of the organization, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        version:
          type: integer
          description: The number of the version within the quote. It starts at 1 and increases by 1 for every new version created by cloning.
          example: 1
        status:
          $ref: '#/components/schemas/QuoteVersionStatusEnum'
        currency:
          $ref: '#/components/schemas/CurrencyOrNull'
          description: The currency the version is quoted in.
        billing_entity_code:
          type:
          - string
          - 'null'
          description: 'Unique code identifying the billing entity that issues the deal. It is resolved rather than stored: the version''s own entity when it names one, then the entity of the subscription being amended for a `subscription_amendment` quote, then the customer''s own. It is `null` when none of them resolves. An amendment cannot name an entity itself, since the subscription it restates is already bound to one, and naming one on an amendment is rejected.'
          example: acme_corp
        void_reason:
          $ref: '#/components/schemas/QuoteVersionVoidReasonEnum'
        approved_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time in UTC (ISO 8601) when the version was approved. It is `null` unless the `status` is `approved`.
          example: '2026-04-29T08:59:51Z'
        voided_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time in UTC (ISO 8601) when the version was voided. It is `null` unless the `status` is `voided`.
          example: '2026-04-29T08:59:51Z'
        created_at:
          type: string
          format: date-time
          description: The date and time in UTC (ISO 8601) when the version was created.
          example: '2026-04-29T08:59:51Z'
        updated_at:
          type: string
          format: date-time
          description: The date and time in UTC (ISO 8601) when the version was last updated.
          example: '2026-04-29T08:59:51Z'
    ApiErrorUnauthorized:
      type: object
      required:
      - status
      - error
      properties:
        status:
          type: integer
          format: int32
          example: 401
        error:
          type: string
          example: Unauthorized
    QuoteBillingItemWalletCreditObject:
      type: object
      required:
      - localId
      - type
      - payload
      properties:
        localId:
          type: string
          description: Identifier of the entry within the quote version, assigned by the Lago user interface. It allows the quote document to reference the entry.
          example: b5c1e2a4-4e1e-4a7f-9f0e-9c1a0c7e1f2b
        type:
          type: string
          description: The kind of billing item.
          enum:
          - wallet_credit
          example: wallet_credit
        payload:
          type: object
          description: The prepaid credit wallet to create for the customer. Unlike the other billing items, a wallet credit is not built from an existing record, so it carries no `id` and no `overrides`. `paidCredits`, `grantedCredits` and `rateAmount` are required to approve the version.
          properties:
            paidCredits:
              type:
              - string
              - 'null'
              description: The number of credits the customer pays for.
              example: '100.0'
            grantedCredits:
              type:
              - string
              - 'null'
              description: The number of credits granted for free.
              example: '20.0'
            rateAmount:
              type:
              - string
              - 'null'
              description: The value of one credit, in the currency of the wallet.
              example: '1.0'
            currency:
              $ref: '#/components/schemas/CurrencyOrNull'
              description: The currency of the wallet.
            expirationAt:
              type:
              - string
              - 'null'
              format: date-time
              description: The date and time in UTC (ISO 8601) when the credits expire.
              example: '2027-01-01T00:00:00Z'
            appliesTo:
              type:
              - object
              - 'null'
              description: The limitations restricting what the credits can be spent on.
              properties:
                feeTypes:
                  type:
                  - array
                  - 'null'
                  description: The fee types the credits can be spent on.
                  items:
                    type: string
                    enum:
                    - charge
                    - add_on
                    - subscription
                    - credit
                    - commitment
                    - fixed_charge
                    - product
                  example:
                  - charge
                billableMetricCodes:
                  type:
                  - array
                  - 'null'
                  description: The codes of the billable metrics the credits can be spent on.
                  items:
                    type: string
                  example:
                  - api_calls
            recurringTransactionRules:
              type:
              - array
              - 'null'
              description: The rule automatically topping the wallet up. At most one rule is allowed, and its `trigger` is required, to approve the version.
              items:
                type: object
                properties:
                  trigger:
                    type:
                    - string
                    - 'null'
                    description: What triggers the top-up.
                    enum:
                    - null
                    - interval
                    - threshold
                    example: interval
                  interval:
                    type:
                    - string
                    - 'null'
                    description: How often the wallet is topped up. Only for an `interval` trigger.
                    enum:
                    - null
                    - weekly
                    - monthly
                    - quarterly
                    - semiannual
                    - yearly
                    example: monthly
                  thresholdCredits:
                    type:
                    - string
                    - 'null'
                    description: The credit balance below which the wallet is topped up. Only for a `threshold` trigger.
                    example: '10.0'
                  method:
                    type:
                    - string
                    - 'null'
                    description: Whether the top-up grants a fixed number of credits, or brings the balance up to a target.
                    enum:
                    - null
                    - fixed
                    - target
                    example: fixed
                  targetOngoingBalance:
                    type:
                    - string
                    - 'null'
                    description: The balance the top-up brings the wallet up to. Only for a `target` method.
                    example: '100.0'
                  grantsTargetTopUp:
                    type:
                    - boolean
                    - 'null'
                    description: Whether the granted credits count towards the target balance.
                    example: false
                  paidCredits:
                    type:
                    - string
                    - 'null'
                    description: The number of credits the customer pays for on every top-up.
                    example: '100.0'
                  grantedCredits:
                    type:
                    - string
                    - 'null'
                    description: The number of credits granted for free on every top-up.
                    example: '20.0'
                  startedAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: The date and time in UTC (ISO 8601) when the rule starts applying.
                    example: '2026-01-01T00:00:00Z'
                  expirationAt:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: The date and time in UTC (ISO 8601) when the rule stops applying.
                    example: '2027-01-01T00:00:00Z'
                  transactionName:
                    type:
                    - string
                    - 'null'
                    description: The name given to the wallet transactions created by the rule.
                    example: Monthly top-up
                  invoiceRequiresSuccessfulPayment:
                    type:
                    - boolean
                    - 'null'
                    description: Whether the credits are granted only once the top-up invoice is paid.
                    example: false
    QuoteBillingItemPlanObject:
      type: object
      required:
      - id
      - type
      - payload
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the plan in Lago, pinned when the entry was added to the quote.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        localId:
          type:
          - string
          - 'null'
          description: Identifier of the entry within the quote version, assigned by the Lago user interface. It allows the quote document to reference the entry.
          example: b5c1e2a4-4e1e-4a7f-9f0e-9c1a0c7e1f2b
        type:
          type: string
          description: The kind of billing item.
          enum:
          - plan
          example: plan
        payload:
          type: object
          description: A snapshot of the plan as it was added to the quote, and of the subscription to create from it. Additional catalog properties may be present, as only the ones Lago reads when the quote is executed are documented here. `code` is required to approve the version.
          properties:
            code:
              type: string
              description: Unique code identifying the plan.
              example: premium_plan
            subscriptionExternalId:
              type:
              - string
              - 'null'
              description: The external unique identifier to assign to the subscription created from the entry. For a `subscription_amendment` quote, it identifies the subscription being amended.
              example: sub_1234567890
            subscriptionName:
              type:
              - string
              - 'null'
              description: The name to assign to the subscription created from the entry.
              example: Premium plan - Acme Corp
            billingTime:
              type:
              - string
              - 'null'
              description: The billing time of the subscription created from the entry.
              enum:
              - null
              - calendar
              - anniversary
              example: calendar
            startDate:
              type:
              - string
              - 'null'
              description: The date and time in UTC (ISO 8601) when the subscription starts. It is optional, and a plan naming none starts the moment the order is executed.
              example: '2026-01-01T00:00:00Z'
            endDate:
              type:
              - string
              - 'null'
              description: The date and time in UTC (ISO 8601) when the subscription ends. Leaving it unset makes the deal open-ended, and on a `subscription_amendment` quote it leaves the amended subscription's own ending date in place. It bounds the deal, so the signing window and the execution date must both fall strictly before it.
              example: '2027-01-01T00:00:00Z'
            paymentMethodId:
              type:
              - string
              - 'null'
              format: uuid
              description: Unique identifier of the payment method to charge for the subscription, created by Lago.
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
            charges:
              type:
              - array
              - 'null'
              description: A snapshot of the usage-based charges of the plan. It pins the charge each entry of `overrides.charges` applies to.
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier of the charge in Lago. It is required to approve the version.
                    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
                  billableMetric:
                    type: object
                    description: The billable metric the charge is based on.
                    properties:
                      code:
                        type: string
                        description: Unique code identifying the billable metric. It is required to approve the version.
                        example: api_calls
                  chargeModel:
                    type:
                    - string
                    - 'null'
                    description: The pricing model of the charge.
                    enum:
                    - null
                    - standard
                    - graduated
                    - graduated_percentage
                    - package
                    - percentage
                    - volume
                    - custom
                    - dynamic
                    example: standard
            fixedCharges:
              type:
              - array
              - 'null'
              description: A snapshot of the fixed charges of the plan. It pins the fixed charge each entry of `overrides.fixedCharges` applies to.
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier of the fixed charge in Lago. It is required to approve the version.
                    example: 1a901a90-1a90-1a90-1a90-1a901a901a90
                  addOn:
                    type: object
                    description: The add-on the fixed charge is based on.
                    properties:
                      code:
                        type: string
                        description: Unique code identifying the add-on. It is required to approve the version.
                        example: seats
                  chargeModel:
                    type:
                    - string
                    - 'null'
                    description: The pricing model of the fixed charge.
                    enum:
                    - null
                    - standard
                    - graduated
                    - volume
                    example: standard
        overrides:
          type:
          - object
          - 'null'
          description: The deviations from the plan snapshot negotiated on the quote. Only the properties set here are overridden.
          properties:
            amountCents:
              type:
              - integer
              - 'null'
              description: Overrides the base amount of the plan, in cents.
              example: 50000
            amountCurrency:
              $ref: '#/components/schemas/CurrencyOrNull'
              description: Overrides the currency the plan is priced in, which is how a catalog plan is quoted in the currency of the deal. The figure in `amountCents` is not converted, it is restated in this currency. It is set only while it differs from the catalog record, and removed once they agree.
            invoiceDisplayName:
              type:
              - string
              - 'null'
              description: Overrides the name of the plan as it appears on the invoice.
              example: Premium
            name:
              type:
              - string
              - 'null'
              description: Overrides the name of the plan.
              example: Premium plan - Acme Corp
            description:
              type:
              - string
              - 'null'
              description: Overrides the description of the plan.
              example: Negotiated premium plan
            trialPeriod:
              type:
              - number
              - 'null'
              description: Overrides the trial period of the plan, in days.
              example: 30
            minimumCommitment:
              type:
              - object
              - 'null'
              description: Overrides the minimum commitment of the plan.
              properties:
                amountCents:
                  type:
                  - integer
                  - 'null'
                  description: The amount of the minimum commitment, in cents. It must be greater than 0.
                  example: 100000
                invoiceDisplayName:
                  type:
                  - string
                  - 'null'
                  description: The name of the minimum commitment as it appears on the invoice.
                  example: Annual commitment
            usageThresholds:
              type:
              - array
              - 'null'
              description: Overrides the progressive billing thresholds of the plan.
              items:
                type: object
                required:
                - amountCents
                properties:
                  amountCents:
                    type: integer
                    description: The usage amount, in cents, at which the threshold is reached. It must be greater than 0.
                    example: 100000
                  recurring:
                    type:
                    - boolean
                    - 'null'
                    description: Whether the threshold applies to every period, instead of only once.
                    example: false
                  thresholdDisplayName:
                    type:
                    - string
                    - 'null'
                    description: The name of the threshold as it appears on the invoice.
                    example: First 1,000 EUR of usage
            charges:
              type:
              - array
              - 'null'
              description: Overrides the usage-based charges of the plan. Each entry applies to the charge of the same billable metric in `payload.charges`.
              items:
                type: object
                required:
                - billableMetricCode
                properties:
                  billableMetricCode:
                    type: string
                    description: Unique code identifying the billable metric of the charge to override.
                    example: api_calls
                  chargeModel:
                    type:
                    - string
                    - 'null'
                    description: The pricing model of the charge.
                    enum:
                    - null
                    - standard
                    - graduated
                    - graduated_percentage
                    - package
                    - percentage
                    - volume
                    - custom
                    - dynamic
                    example: standard
                  properties:
                    type:
                    - object
                    - 'null'
                    description: The pricing properties of the charge. Their shape depends on the charge model, and is validated when the quote is executed.
                    example:
                      amount: '0.02'
                  minAmountCents:
                    type:
                    - integer
                    - 'null'
                    description: The minimum amount billed for the charge, in cents.
                    example: 10000
                  invoiceDisplayName:
                    type:
                    - string
                    - 'null'
                    description: The name of the charge as it appears on the invoice.
                    example: API calls
            fixedCharges:
              type:
              - array
              - 'null'
              description: Overrides the fixed charges of the plan. Each entry applies to the fixed charge of the same add-on in `payload.fixedCharges`.
              items:
                type: object
                required:
                - addOnCode
                properties:
                  addOnCode:
                    type: string
                    description: Unique code identifying the add-on of the fixed charge to override.
                    example: seats
                  units:
                    type:
                    - string
                    - 'null'
                    description: The number of units billed by the fixed charge.
                    example: '10'
                  properties:
                    type:
                    - object
                    - 'null'
                    description: The pricing properties of the fixed charge. Their shape depends on the charge model, and is validated when the quote is executed.
                    example:
                      amount: '5'
                  invoiceDisplayName:
                    type:
                    - string
                    - 'null'
                    description: The name of the fixed charge as it appears on the invoice.
                    example: Seats
