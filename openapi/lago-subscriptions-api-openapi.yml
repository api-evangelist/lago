    ChargeObject:
      type: object
      required:
      - lago_id
      - lago_billable_metric_id
      - billable_metric_code
      - created_at
      - charge_model
      - invoiceable
      - regroup_paid_fees
      - pay_in_advance
      - prorated
      - min_amount_cents
      - properties
      - filters
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of charge, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_billable_metric_id:
          type: string
          format: uuid
          description: Unique identifier of the billable metric created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        code:
          type: string
          description: Unique code identifying the charge within the plan.
          example: api_requests_charge
        billable_metric_code:
          type: string
          description: Unique code identifying a billable metric.
          example: requests
        invoice_display_name:
          type:
          - string
          - 'null'
          description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the name of the actual charge will be used as the default display name.
          example: Setup
        created_at:
          type: string
          format: date-time
          description: The date and time when the charge was created. It is expressed in UTC format according to the ISO 8601 datetime standard.
          example: '2022-09-14T16:35:31Z'
        charge_model:
          $ref: '#/components/schemas/ChargeModelEnum'
        pay_in_advance:
          type: boolean
          description: This field determines the billing timing for this specific usage-based charge. When set to `true`, the charge is due and invoiced immediately. Conversely, when set to `false`, the charge is due and invoiced at the end of each billing period.
          example: true
        invoiceable:
          type: boolean
          description: This field specifies whether the charge should be included in a proper invoice. If set to `false`, no invoice will be issued for this charge. You can only set it to `false` when `pay_in_advance` is `true`.
          example: true
        regroup_paid_fees:
          type:
          - string
          - 'null'
          enum:
          - null
          - invoice
          description: 'This setting can only be configured if `pay_in_advance` is `true` and `invoiceable` is `false`.

            This field determines whether and when the charge fee should be included in

            the invoice. If `null`, no invoice will be issued for this charge fee.

            If `invoice`, an invoice will be generated at the end of the period,

            consolidating all charge fees with a succeeded payment status.'
          example: invoice
        prorated:
          type: boolean
          example: false
          description: 'Specifies whether a charge is prorated based on the remaining number of days in the billing period or billed fully.


            - If set to `true`, the charge is prorated based on the remaining days in the current billing period.

            - If set to `false`, the charge is billed in full.

            - If not defined in the request, default value is `false`.'
        min_amount_cents:
          type: integer
          description: The minimum spending amount required for the charge, measured in cents and excluding any applicable taxes. It indicates the minimum amount that needs to be charged for each billing period.
          example: 1200
        properties:
          $ref: '#/components/schemas/ChargeObjectProperties'
          description: List of all thresholds utilized for calculating the charge.
        filters:
          type: array
          description: List of filters used to apply differentiated pricing based on additional event properties.
          items:
            $ref: '#/components/schemas/ChargeFilterObject'
        taxes:
          type: array
          description: All taxes applied to the charge.
          items:
            $ref: '#/components/schemas/TaxObject'
        applied_pricing_unit:
          type:
          - object
          - 'null'
          required:
          - code
          - conversion_rate
          description: The pricing unit applied to the charge.
          properties:
            code:
              type: string
              description: The code of the pricing unit.
              example: unit_code
            conversion_rate:
              type: string
              description: The conversion rate from pricing units to the plan's currency.
              example: '0.5'
        accepts_target_wallet:
          type: boolean
          description: 'Specifies whether the charge accepts a target wallet for prepaid credits deduction.

            When `true`, events may include a `target_wallet_code` in their `properties` to direct credit deduction to a specific wallet.

            This field requires a premium integration.'
          example: false
        lago_parent_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier of the parent charge (if this is an override).
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    LifetimeUsage:
      type: object
      required:
      - lifetime_usage
      properties:
        lifetime_usage:
          $ref: '#/components/schemas/LifetimeUsageObject'
    ChargesPaginated:
      type: object
      required:
      - charges
      - meta
      properties:
        charges:
          type: array
          items:
            $ref: '#/components/schemas/ChargeObject'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    ChargeFilterInput:
      type: object
      description: Values used to apply differentiated pricing based on additional event properties.
      required:
      - properties
      - values
      properties:
        invoice_display_name:
          type:
          - string
          - 'null'
          description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the values of the filter will be used as the default display name.
          example: AWS
        properties:
          $ref: '#/components/schemas/ChargeProperties'
          description: List of all thresholds utilized for calculating the charge.
        values:
          type: object
          description: List of possible filter values. The key and values must match one of the billable metric filters.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            region:
            - us-east-1
    AlertBatchCreateInput:
      type: object
      required:
      - alerts
      properties:
        alerts:
          type: array
          description: Array of alerts to create. All alerts are created atomically - if any fail validation, none are created.
          items:
            allOf:
            - $ref: '#/components/schemas/AlertBaseInput'
            - type: object
              required:
              - alert_type
              - code
              - thresholds
              properties:
                alert_type:
                  type: string
                  description: The type of alert.
                  enum:
                  - current_usage_amount
                  - billable_metric_current_usage_amount
                  - billable_metric_current_usage_units
                  - lifetime_usage_amount
                  - billable_metric_lifetime_usage_units
                  example: billable_metric_current_usage_amount
                code:
                  type: string
                  description: Unique code used to identify the alert.
                  example: storage_threshold_alert
                billable_metric_code:
                  type:
                  - string
                  - 'null'
                  description: The code of the billable metric associated with the alert. Only for alerts based on a billable metric.
                  example: storage_usage
    AlertBaseInput:
      type: object
      properties:
        code:
          type: string
          description: Unique code used to identify the alert.
          example: storage_threshold_alert
        name:
          type:
          - string
          - 'null'
          description: The name of the alert.
          example: Storage Usage Alert
        thresholds:
          type: array
          description: Array of thresholds associated with the alert.
          items:
            $ref: '#/components/schemas/AlertThresholdInput'
    BillableMetricFilterObject:
      type: object
      description: Values used to apply differentiated pricing based on additional event properties.
      required:
      - key
      - values
      properties:
        key:
          type: string
          example: region
          description: Filter key to add to the event properties payload
        values:
          type: array
          items:
            type: string
            example: us-east-1
          description: List of possible filter values
    SubscriptionUpdateInput:
      type: object
      required:
      - subscription
      properties:
        status:
          type: string
          enum:
          - active
          - pending
          example: active
          description: If the field is not defined and multiple `active` and `pending` subscriptions exists, Lago will update the `active` subscription. However, if you wish to update a `pending` subscription, please ensure that you include the `status` attribute with the `pending` value in your request body.
        subscription:
          type: object
          properties:
            name:
              type:
              - string
              - 'null'
              example: Repository B
              description: The display name of the subscription on an invoice. This field allows for customization of the subscription's name for billing purposes, especially useful when a single customer has multiple subscriptions using the same plan.
            ending_at:
              type:
              - string
              - 'null'
              format: date-time
              example: '2022-10-08T00:00:00Z'
              description: The effective end date of the subscription. If this field is set to null, the subscription will automatically renew. This date should be provided in ISO 8601 datetime format, and use Coordinated Universal Time (UTC).
            subscription_at:
              type: string
              format: date-time
              example: '2022-08-08T00:00:00Z'
              description: The start date and time of the subscription. This field can only be modified for pending subscriptions that have not yet started. This date should be provided in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
            plan_overrides:
              $ref: '#/components/schemas/PlanOverridesObject'
              description: Overrides applied to the plan for this subscription. A units-only `fixed_charges` override is recorded as a per-subscription unit override without creating a plan override; any other override creates a plan override for the subscription. See `fixed_charges` for the exact rule.
            invoice_custom_section:
              $ref: '#/components/schemas/InvoiceCustomSectionInput'
            payment_method:
              $ref: '#/components/schemas/PaymentMethodReference'
              description: Optional payment method to use for processing subscription payments.
            consolidate_invoice:
              type: boolean
              example: false
              description: 'Defines whether this subscription should be grouped with other subscriptions of the same customer when generating recurring invoices.


                - `true`: the subscription is included in the customer''s standard invoice grouping (by billing entity, currency and payment method).

                - `false`: the subscription is excluded from consolidation and always billed on its own dedicated invoice.

                '
            billing_entity_code:
              type: string
              example: default
              description: The code of the billing entity associated with the subscription. Updates take effect on future invoices only.
            on_termination_credit_note:
              type: string
              enum:
              - credit
              - refund
              - offset
              - skip
              example: credit
              description: 'Sets the default credit note behaviour applied when this subscription is later terminated before the end of its billing period:


                - `credit`: a credit note is generated for the unused subscription time. The unused amount is credited back to the customer.

                - `refund`: a credit note is generated for the unused subscription time. If the invoice is paid or partially paid, the unused paid amount is refunded; any unpaid unused amount is credited back to the customer.

                - `offset`: a credit note is generated for the unused subscription time. If the invoice is paid or partially paid, the unused paid amount is refunded; any unpaid unused amount is applied to the invoice reducing its amount due.

                - `skip`: no credit note is generated for the unused subscription time.


                _Note: This field is only applied to pay-in-advance plans and is ignored for pay-in-arrears plans._

                '
            on_termination_invoice:
              type: string
              enum:
              - generate
              - skip
              example: generate
              description: 'Sets the default invoice behaviour applied when this subscription is later terminated before the end of its billing period:


                - `generate`: an invoice is generated for the unbilled usage.

                - `skip`: no invoice is generated for the unbilled usage.

                '
            purchase_order_number:
              type:
              - string
              - 'null'
              example: PO-123
              description: The purchase order number associated with the subscription. It will be added to invoices generated for this subscription.
            progressive_billing_disabled:
              type: boolean
              default: false
              example: true
              description: 'Disables progressive billing for this subscription, regardless of any usage thresholds defined on the plan (including thresholds inherited from a parent plan when the subscription runs on a plan override).


                Set to `true` to switch progressive billing off for this subscription specifically. This is the recommended way to stop progressive billing on a subscription that inherits thresholds from its plan, since clearing `usage_thresholds` only removes subscription-level thresholds and does not remove those defined on (or inherited from) the plan.

                '
            usage_thresholds:
              type: array
              description: 'Usage thresholds managed directly on the subscription. This is the recommended way to set progressive billing thresholds per subscription; when present, they take precedence over the thresholds defined on the plan.


                Sending an empty array removes all subscription-level thresholds. This field cannot be combined with `plan_overrides.usage_thresholds` in the same request. To fully disable progressive billing on a subscription that inherits thresholds from its plan, use `progressive_billing_disabled` instead.

                '
              items:
                $ref: '#/components/schemas/UsageThresholdInput'
            activation_rules:
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionActivationRuleInput'
              description: 'Optional list of activation rules that gate the subscription activation. Activation rules can only be set or modified while the subscription is `pending` (future-dated and not yet activated); the request is rejected for `incomplete`, `active`, or `terminated` subscriptions.

                '
    LifetimeUsageInput:
      type: object
      required:
      - lifetime_usage
      properties:
        lifetime_usage:
          type: object
          required:
          - external_historical_usage_amount_cents
          properties:
            external_historical_usage_amount_cents:
              type: integer
              example: 100
              description: The historical usage amount in cents for the subscription (provided by your own application).
    SubscriptionExtended:
      type: object
      required:
      - subscription
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionObjectExtended'
        authorization:
          type: object
          description: 'The Stripe payment intent created for the pre-authorization. Only returned when creating a subscription with an `authorization` payload.

            '
          required:
          - id
          - object
          - amount
          - amount_capturable
          - status
          properties:
            id:
              type: string
              example: pi_1a901a901a901a901a901a90
              description: The identifier of the Stripe payment intent.
            object:
              type: string
              example: payment_intent
              description: The Stripe object type. Always `payment_intent`.
            amount:
              type: integer
              example: 5000
              description: The authorized amount, in cents.
            amount_capturable:
              type: integer
              example: 5000
              description: The amount that can still be captured from the authorization, in cents.
            status:
              type: string
              example: requires_capture
              description: The status of the Stripe payment intent. `requires_capture` means the amount is held and about to be released. `requires_action` means 3D Secure was requested, and the subscription is still created.
    InvoiceCustomSectionInput:
      type: object
      description: Configuration for invoice custom sections to apply to invoices generated by this resource.
      properties:
        skip_invoice_custom_sections:
          type: boolean
          example: false
          description: Set to `true` to exclude all invoice custom sections from PDF generation for invoices related to this resource. When `true`, `invoice_custom_section_codes` is ignored.
        invoice_custom_section_codes:
          type: array
          items:
            type: string
          description: List of unique codes identifying the invoice custom sections to apply. These override the default invoice custom sections configured at the customer or billing entity level.
          example:
          - eu_bank_details
    InvoiceCustomSectionObject:
      type: object
      required:
      - lago_id
      - name
      - code
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier for the invoice custom section in the Lago application, generated by Lago to ensure record uniqueness within the system.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        name:
          type: string
          description: Name of the invoice custom section.
          example: EU Bank Details
        code:
          type: string
          description: Unique code identifying the invoice custom section for the API request.
          example: eu_bank_details
        description:
          type: string
          description: Internal description of the invoice custom section.
          example: This section contains the bank details for EU customers.
        details:
          type: string
          description: The value shown on the invoice PDF.
          example: 'Bank Name: Lago Bank, IBAN: FR7630004000031234567890143'
        display_name:
          type: string
          description: The name of the invoice custom section displayed on the invoice.
          example: 'Bank Details:'
        applied_to_organization:
          type: boolean
          deprecated: true
          description: '**Deprecated.** This field will be removed in a future version. When set to true, it applies the invoice custom section to the organization''s default billing entity. To apply or remove an invoice custom section from any billing entity (including the default one), please use the `PUT /billing_entities/:code` endpoint instead.'
          example: true
        organization_id:
          type: string
          format: uuid
          description: Unique identifier for the organization associated with the invoice custom section.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        created_at:
          type: string
          format: date-time
          description: Creation date of the tax.
          example: '2023-07-06T14:35:58Z'
    AppliedInvoiceCustomSectionObject:
      type: object
      required:
      - lago_id
      - created_at
      - invoice_custom_section
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the applied invoice custom section in the Lago application.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        created_at:
          type: string
          format: date-time
          description: The date of the applied invoice custom section creation, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
          example: '2023-07-06T14:35:58Z'
        invoice_custom_section_id:
          deprecated: true
          type: string
          format: uuid
          description: '**Deprecated.** Unique identifier of the invoice custom section that was applied.'
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        invoice_custom_section:
          $ref: '#/components/schemas/InvoiceCustomSectionObject'
    ApiErrorForbidden:
