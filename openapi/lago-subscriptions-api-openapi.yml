openapi: 3.2.0
info:
  title: Lago API documentation Subscriptions API
  description: Lago API allows your application to push customer information and metrics (events) from your application to the billing application.
  version: 1.55.0
  license:
    name: AGPLv3
    url: https://github.com/getlago/lago-openapi/blob/main/LICENSE
  contact:
    email: tech@getlago.com
servers:
- url: https://api.getlago.com/api/v1
  description: US Lago cluster
- url: https://api.eu.getlago.com/api/v1
  description: EU Lago cluster
security:
- bearerAuth: []
tags:
- name: Subscriptions
  description: Everything about Subscription collection
  externalDocs:
    description: Find out more
    url: https://getlago.com/docs/api-reference/subscriptions/subscription-object
paths:
  /customers/{external_customer_id}/subscriptions:
    get:
      tags:
      - Subscriptions
      summary: List all customer's subscriptions
      description: This endpoint retrieves all active subscriptions for a customer.
      operationId: findAllCustomerSubscriptions
      parameters:
      - $ref: '#/components/parameters/external_customer_id_path'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/currency'
      - name: external_id
        in: query
        description: The subscription external unique identifier (provided by your own application).
        required: false
        schema:
          type: string
          example: subscription_premium
      - name: plan_code
        in: query
        description: The unique code representing the plan to be attached to the customer. This code must correspond to the code property of one of the active plans.
        required: false
        explode: true
        schema:
          type: string
          example: premium
      - name: overridden
        in: query
        description: When set, filters subscriptions by whether their plan is an override of a parent plan. `true` returns only subscriptions on overridden plans; `false` returns only those on standard (non-overridden) plans.
        required: false
        schema:
          type: boolean
          example: true
      - name: status[]
        in: query
        description: 'If the field is not defined, Lago will return only `active` subscriptions. However, if you wish to fetch subscriptions by different status you can define them in a status[] query param. Available filter values: `pending`, `canceled`, `terminated`, `active`, `incomplete`.'
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - pending
            - canceled
            - terminated
            - active
            - incomplete
          example:
          - active
          - pending
      - name: billing_entity_codes[]
        in: query
        description: Filter subscriptions by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      responses:
        '200':
          description: List of subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions:
    post:
      tags:
      - Subscriptions
      summary: Assign a plan to a customer
      description: This endpoint assigns a plan to a customer, creating or modifying a subscription. Ideal for initial subscriptions or plan changes (upgrades/downgrades).
      operationId: createSubscription
      requestBody:
        description: Subscription payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateInput'
        required: true
      responses:
        '200':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionExtended'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - Subscriptions
      summary: List all subscriptions
      description: This endpoint retrieves all active subscriptions.
      operationId: findAllSubscriptions
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/currency'
      - name: external_customer_id
        in: query
        description: The customer external unique identifier (provided by your own application)
        required: false
        schema:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
      - name: external_id
        in: query
        description: Filter subscriptions by their external unique identifier (provided by your own application).
        required: false
        schema:
          type: string
          example: my_sub_1234567890
      - name: plan_code
        in: query
        description: The unique code representing the plan to be attached to the customer. This code must correspond to the code property of one of the active plans.
        required: false
        schema:
          type: string
          example: premium
      - name: overridden
        in: query
        description: When set, filters subscriptions by whether their plan is an override of a parent plan. `true` returns only subscriptions on overridden plans; `false` returns only those on standard (non-overridden) plans.
        required: false
        schema:
          type: boolean
          example: true
      - name: status[]
        in: query
        description: 'If the field is not defined, Lago will return only `active` subscriptions. However, if you wish to fetch subscriptions by different status you can define them in a status[] query param. Available filter values: `pending`, `canceled`, `terminated`, `active`, `incomplete`.'
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - active
            - canceled
            - incomplete
            - pending
            - terminated
          example:
          - active
          - pending
      - name: billing_entity_codes[]
        in: query
        description: Filter subscriptions by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      responses:
        '200':
          description: List of subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /subscriptions/{external_id}:
    parameters:
    - name: external_id
      in: path
      description: External ID of the existing subscription
      required: true
      schema:
        type: string
        example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
    get:
      tags:
      - Subscriptions
      summary: Retrieve a subscription
      description: This endpoint retrieves a specific subscription.
      operationId: findSubscription
      parameters:
      - name: status
        in: query
        description: 'By default, this endpoint only returns `active` subscriptions. If you want to retrieve a subscription with a different `status`, you can specify it here.


          _Note: As there may exist multiple `canceled` or `terminated` subscriptions for the same `external_id`, it is recommended to use the "List all subscriptions" endpoint to retrieve those subscriptions._

          '
        required: false
        schema:
          type: string
          enum:
          - active
          - terminated
          - pending
          - canceled
          - incomplete
          example: active
          default: active
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionExtended'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Subscriptions
      summary: Update a subscription
      description: This endpoint allows you to update a subscription.
      operationId: updateSubscription
      requestBody:
        description: Update an existing subscription
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdateInput'
        required: true
      parameters:
      - name: status
        in: query
        description: 'By default, this endpoint only updates `active` subscriptions. If you want to update a subscription with a different `status`, you can specify it here.

          '
        required: false
        schema:
          type: string
          enum:
          - active
          - pending
          example: active
          default: active
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionExtended'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - Subscriptions
      summary: Terminate a subscription
      description: This endpoint allows you to terminate a subscription.
      operationId: destroySubscription
      parameters:
      - name: status
        in: query
        description: 'Selects which subscription to terminate for the given `external_id`, based on its status. If the field is not defined, Lago targets only `active` subscriptions.


          - `pending`: cancel a subscription scheduled for a future activation (include `status=pending`).

          - `incomplete`: cancel a payment-gated subscription that is still awaiting its activation payment (include `status=incomplete`). The subscription is canceled with `cancellation_reason: manual`, its invoice is closed and nothing is billed, and any pending payment is canceled on a best-effort basis with the payment provider (some provider statuses cannot be canceled). Applied coupons, credit notes and wallet credits are recredited. Termination behaviours (`on_termination_credit_note`, `on_termination_invoice`) are ignored, as an incomplete subscription has never been billed.

          '
        required: false
        explode: true
        schema:
          type: string
          example: incomplete
          default: active
      - name: on_termination_credit_note
        in: query
        description: 'When a pay-in-advance subscription is terminated before the end of its billing period, we generate a credit note for the unused subscription time by default.

          This field allows you to control the behavior of the credit note generation:


          - `credit`: A credit note is generated for the unused subscription time. The unused amount is credited back to the customer.

          - `refund`: A credit note is generated for the unused subscription time. If the invoice is paid or partially paid, the unused paid amount is refunded; any unpaid unused amount is credited back to the customer.

          - `offset`: A credit note is generated for the unused subscription time. If the invoice is paid or partially paid, the unused paid amount is refunded; any unpaid unused amount is applied to the invoice reducing its amount due.

          - `skip`: No credit note is generated for the unused subscription time.


          _Note: This field is only applicable to pay-in-advance plans and is ignored for pay-in-arrears plans._

          '
        required: false
        schema:
          type: string
          enum:
          - credit
          - refund
          - offset
          - skip
          example: credit
      - name: on_termination_invoice
        in: query
        description: 'When a subscription is terminated before the end of its billing period, we generate an invoice for the unbilled usage.

          This field allows you to control the behavior of the invoice generation:


          - `generate`: An invoice is generated for the unbilled usage.

          - `skip`: No invoice is generated for the unbilled usage.

          '
        required: false
        schema:
          type: string
          enum:
          - generate
          - skip
          example: generate
      responses:
        '200':
          description: Subscription terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionExtended'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /subscriptions/{external_id}/lifetime_usage:
    parameters:
    - name: external_id
      in: path
      description: External ID of the existing subscription
      required: true
      schema:
        type: string
        example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
    get:
      tags:
      - Subscriptions
      summary: Retrieve subscription lifetime usage
      description: This endpoint enables the retrieval of the lifetime usage of a subscription.
      operationId: getSubscriptionLifetimeUsage
      responses:
        '200':
          description: Subscription lifetime usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifetimeUsage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Subscriptions
      summary: Update a subscription lifetime usage
      description: This endpoint allows you to update the lifetime usage of a subscription.
      operationId: updateSubscriptionLifetimeUsage
      requestBody:
        description: Update the lifetime usage of a subscription
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifetimeUsageInput'
        required: true
      responses:
        '200':
          description: Subscription lifetime usage updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifetimeUsage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /subscriptions/{external_id}/alerts:
    parameters:
    - name: external_id
      in: path
      description: External ID of the existing subscription
      required: true
      schema:
        type: string
        example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
    get:
      tags:
      - Subscriptions
      summary: List subscription alerts
      description: This endpoint enables the retrieval of all alerts for a subscription.
      operationId: getSubscriptionAlerts
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Subscription alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alerts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Subscriptions
      summary: Create subscription alert(s)
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      description: This endpoint allows you to create alerts for a subscription. Send a single alert object wrapped in `alert` key to create one alert, or an array of alert objects wrapped in `alerts` key to create multiple alerts atomically.
      operationId: createSubscriptionAlert
      requestBody:
        description: Create one or more alerts for a subscription
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/AlertCreateInput'
              - $ref: '#/components/schemas/AlertBatchCreateInput'
        required: true
      responses:
        '200':
          description: Subscription alert(s) created
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Alert'
                - $ref: '#/components/schemas/Alerts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - Subscriptions
      summary: Delete all subscription alerts
      description: This endpoint allows you to delete all alerts for a subscription.
      operationId: deleteAllSubscriptionAlerts
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      responses:
        '200':
          description: All subscription alerts deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{external_id}/alerts/{code}:
    parameters:
    - name: external_id
      in: path
      description: External ID of the existing subscription
      required: true
      schema:
        type: string
        example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
    - name: code
      in: path
      description: Unique code of the alert
      required: true
      schema:
        type: string
        example: storage_threshold_alert
    get:
      tags:
      - Subscriptions
      summary: Retrieve a subscription alert
      description: This endpoint enables the retrieval of a specific alert for a subscription.
      operationId: getSubscriptionAlert
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      responses:
        '200':
          description: Subscription alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Subscriptions
      summary: Update a subscription alert
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      description: This endpoint allows you to update an existing alert for a subscription.
      operationId: updateSubscriptionAlert
      requestBody:
        description: Update an existing alert for a subscription
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertUpdateInput'
        required: true
      responses:
        '200':
          description: Subscription alert updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - Subscriptions
      summary: Delete a subscription alert
      description: This endpoint allows you to delete an existing alert for a subscription.
      operationId: deleteSubscriptionAlert
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      responses:
        '200':
          description: Subscription alert deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{external_id}/fixed_charges:
    parameters:
    - $ref: '#/components/parameters/subscription_external_id_path'
    get:
      tags:
      - Subscriptions
      summary: List all fixed charges for a subscription
      description: 'This endpoint retrieves all effective fixed charges for a specific subscription.

        The `units` of each fixed charge reflect any per-subscription unit override applied to the subscription; when no override exists, the plan-level units are returned.'
      operationId: findAllSubscriptionFixedCharges
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/subscription_status'
      responses:
        '200':
          description: List of fixed charges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedChargesPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{external_id}/charges:
    parameters:
    - $ref: '#/components/parameters/subscription_external_id_path'
    get:
      tags:
      - Subscriptions
      summary: List all charges for a subscription
      description: 'This endpoint retrieves all effective charges for a specific subscription.

        If the subscription has plan overrides with charge overrides, the overridden charges are returned.'
      operationId: findAllSubscriptionCharges
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/subscription_status'
      responses:
        '200':
          description: List of charges
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargesPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{external_id}/charges/{charge_code}:
    parameters:
    - $ref: '#/components/parameters/subscription_external_id_path'
    - $ref: '#/components/parameters/charge_code'
    get:
      tags:
      - Subscriptions
      summary: Retrieve a charge for a subscription
      description: 'This endpoint retrieves a specific effective charge for a subscription.

        If the subscription has a plan override with a charge override, the overridden charge is returned.'
      operationId: findSubscriptionCharge
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      responses:
        '200':
          description: Charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Subscriptions
      summary: Override a charge for a subscription
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      description: 'This endpoint creates or updates a charge override for a specific subscription.

        If the subscription does not have a plan override yet, one will be created automatically.

        The charge override allows customizing specific charge properties (invoice_display_name, min_amount_cents, properties, filters, taxes, applied_pricing_unit) without affecting the original plan charge.

        This is a premium feature.'
      operationId: overrideSubscriptionCharge
      requestBody:
        description: Charge override payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionChargeOverride'
        required: true
      responses:
        '200':
          description: Charge override created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Charge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /subscriptions/{external_id}/charges/{charge_code}/filters:
    parameters:
    - $ref: '#/components/parameters/subscription_external_id_path'
    - $ref: '#/components/parameters/charge_code'
    post:
      tags:
      - Subscriptions
      summary: Create a charge filter
      description: This endpoint creates a new filter for a specific charge on a subscription.
      operationId: createSubscriptionChargeFilter
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      requestBody:
        description: Charge filter payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeFilterCreateInput'
        required: true
      responses:
        '200':
          description: Charge filter created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeFilterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - Subscriptions
      summary: List all filters for a charge
      description: This endpoint retrieves all filters for a specific charge on a subscription.
      operationId: findAllSubscriptionChargeFilters
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/subscription_status'
      responses:
        '200':
          description: List of charge filters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeFiltersPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{external_id}/charges/{charge_code}/filters/{filter_id}:
    parameters:
    - $ref: '#/components/parameters/subscription_external_id_path'
    - $ref: '#/components/parameters/charge_code'
    - $ref: '#/components/parameters/charge_filter_id'
    get:
      tags:
      - Subscriptions
      summary: Retrieve a charge filter
      description: This endpoint retrieves a specific filter for a charge on a subscription.
      operationId: findSubscriptionChargeFilter
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      responses:
        '200':
          description: Charge filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeFilterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Subscriptions
      summary: Update a charge filter
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      description: This endpoint updates a specific filter for a charge on a subscription.
      operationId: updateSubscriptionChargeFilter
      requestBody:
        description: Charge filter payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeFilterUpdateInput'
        required: true
      responses:
        '200':
          description: Charge filter updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeFilterResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - Subscriptions
      summary: Delete a charge filter
      description: This endpoint deletes a specific filter from a charge on a subscription.
      operationId: destroySubscriptionChargeFilter
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      responses:
        '200':
          description: Charge filter deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeFilterResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{external_id}/fixed_charges/{fixed_charge_code}:
    parameters:
    - $ref: '#/components/parameters/subscription_external_id_path'
    - $ref: '#/components/parameters/fixed_charge_code'
    get:
      tags:
      - Subscriptions
      summary: Retrieve a fixed charge for a subscription
      description: 'This endpoint retrieves a specific effective fixed charge for a subscription.

        The `units` reflect any per-subscription unit override applied to the subscription; when no override exists, the plan-level units are returned.'
      operationId: findSubscriptionFixedCharge
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      responses:
        '200':
          description: Fixed Charge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedCharge'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Subscriptions
      summary: Override a fixed charge for a subscription
      parameters:
      - $ref: '#/components/parameters/subscription_status'
      description: 'This endpoint creates or updates a fixed charge override for a subscription, without affecting the original plan fixed charge.

        When the body contains only `units` (and optionally `apply_units_immediately`), the change is recorded as a per-subscription unit override. When the body also sets `invoice_display_name`, `properties`, or `tax_codes`, it is applied as a full plan override for the subscription instead.

        With `apply_units_immediately: true` on a pay-in-advance fixed charge the change is billed mid-period; otherwise it takes effect at the next billing period.

        This is a premium feature.'
      operationId: overrideSubscriptionFixedCharge
      requestBody:
        description: Fixed charge override payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionFixedChargeOverride'
        required: true
      responses:
        '200':
          description: Fixed charge override created or updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FixedCharge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
components:
  schemas:
    LifetimeUsageThresholdObject:
      type: object
      required:
      - amount_cents
      - completion_ratio
      - reached_at
      properties:
        amount_cents:
          type: integer
          description: The usage threshold amount in cents.
          example: 100
        completion_ratio:
          type: number
          description: The completion ratio of the usage threshold.
          example: 0.5
        reached_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time when the usage threshold was reached. The date and time must be in ISO 8601 format.
          example: '2024-01-01T00:00:00Z'
    AlertThresholdObject:
      allOf:
      - $ref: '#/components/schemas/AlertThresholdBaseObject'
      - type: object
        required:
        - code
        - value
        - recurring
        properties:
          value:
            type: string
            pattern: ^-?[0-9]+(\.[0-9]+)?$
            description: 'A value that should trigger this alert, formatted as a BigDecimal.


              The unit depends on the alert type: `billable_metric_current_usage_units` and `billable_metric_lifetime_usage_units` are expressed in units, `wallet_credits_balance` and `wallet_credits_ongoing_balance` in credits, and all other types in cents.'
            example: '99.0'
    ApplicableUsageThreshold:
      type: object
      required:
      - threshold_display_name
      - amount_cents
      - recurring
      properties:
        threshold_display_name:
          type:
          - string
          - 'null'
          description: The display name of the usage threshold.
          example: Threshold 1
        amount_cents:
          type: integer
          description: The amount to reach to trigger a `progressive_billing` invoice.
          example: 10000
        recurring:
          type: boolean
          description: This field when set to `true` indicates that a `progressive_billing` invoice will be created every time the lifetime usage increases by the specified amount.
          example: true
    SubscriptionCreateInput:
      type: object
      required:
      - subscription
      properties:
        authorization:
          type: object
          description: "Optionally, you can create a pre-authorization on the customer's card before creating a subscription. This process places a temporary hold (capture) for a specified amount on the customer's account, but does not actually withdraw the funds.\n\nImportant notes:\n  - The final amount due for the subscription is not known at the time of creation; it is determined only after the invoice is finalized.\n  - The payment intent generated for pre-authorization cannot be reused, as the final invoice amount may exceed the authorized amount.\n  - The payment intent is canceled immediately after creation, but this cancellation occurs asynchronously.\n  - For these reasons, it is recommended to use a small amount (such as $1) for pre-authorization. While this does not guarantee sufficient funds for the final payment, it helps reduce the likelihood of payment errors.\n"
          required:
          - amount_cents
          - amount_currency
          properties:
            amount_cents:
              type: integer
              example: 1000
              description: The amount of the authorization in cents.
            amount_currency:
              type: string
              example: USD
              description: The currency of the authorization.
        subscription:
          type: object
          required:
          - external_customer_id
          - plan_code
          - external_id
          properties:
            billing_entity_code:
              type: string
              example: default
              description: The code of the billing entity to be used for the subscription. If not provided, the default billing entity will be used.
            external_customer_id:
              type: string
              example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
              description: The customer external unique identifier (provided by your own application)
            plan_code:
              type: string
              example: premium
              description: The unique code representing the plan to be attached to the customer. This code must correspond to the `code` property of one of the active plans.
            name:
              type: string
              example: Repository A
              description: The display name of the subscription on an invoice. This field allows for customization of the subscription's name for billing purposes, especially useful when a single customer has multiple subscriptions using the same plan.
            external_id:
              type: string
              example: my_sub_1234567890
              description: The unique external identifier for the subscription. This identifier serves as an idempotency key, ensuring that each subscription is unique.
            billing_time:
              type: string
              description: The billing time for the subscription, which can be set as either `anniversary` or `calendar`. If not explicitly provided, it will default to `calendar`. The billing time determines the timing of recurring billing cycles for the subscription. By specifying `anniversary`, the billing cycle will be based on the specific date the subscription started (billed fully), while `calendar` sets the billing cycle at the first day of the week/month/year (billed with proration).
              example: anniversary
              enum:
              - calendar
              - anniversary
            ending_at:
              type: string
              format: date-time
              example: '2022-10-08T00:00:00Z'
              description: The effective end date of the subscription. If this field is set to null, the subscription will automatically renew. This date should be provided in ISO 8601 datetime format, and use Coordinated Universal Time (UTC).
            subscription_at:
              type: string
              format: date-time
              example: '2022-08-08T00:00:00Z'
              description: The start date for the subscription, allowing for the creation of subscriptions that can begin in the past or future. Please note that it cannot be used to update the start date of a pending subscription or schedule an upgrade/downgrade. The start_date should be provided in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
            plan_overrides:
              $ref: '#/components/schemas/PlanOverridesObject'
              description: Overrides applied to the plan for this subscription. A units-only `fixed_charges` override is recorded as a per-subscription unit override without creating a plan override; any other override creates a plan override for the subscription. See `fixed_charges` for the exact rule.
            invoice_custom_section:
              $ref: '#/components/schemas/InvoiceCustomSectionInput'
            payment_method:
              $ref: '#/components/schemas/PaymentMethodReference'
              description: Optional payment method to use for processing subscription payments.
            consolidate_invoice:
              type: boolean
              default: true
              example: true
              description: 'Defines whether this subscription should be grouped with other subscriptions of the same customer when generating recurring invoices.


                - `true` (default): the subscription is included in the customer''s standard invoice grouping (by billing entity, currency and payment method).

                - `false`: the subscription is excluded from consolidation and always billed on its own dedicated invoice.

                '
            purchase_order_number:
              type:
              - string
              - 'null'
              example: PO-123
              description: The purchase order number associated with the subscription. It will be added to invoices generated for this subscription.
            progressive_billing_disabled:
              type: boolean
              default: false
              example: true
              description: 'Disables progressive billing for this subscription, regardless of any usage thresholds defined on the plan (including thresholds inherited from a parent plan when the subscription runs on a plan override).


                Set to `true` to switch progressive billing off for this subscription specifically, without changing the plan''s thresholds.

                '
            usage_thresholds:
              type: array
              description: 'Usage thresholds managed directly on the subscription. This is the recommended way to set progressive billing thresholds per subscription; when present, they take precedence over the thresholds defined on the plan.


                This field cannot be combined with `plan_overrides.usage_thresholds` in the same request.

                '
              items:
                $ref: '#/components/schemas/UsageThresholdInput'
            activation_rules:
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionActivationRuleInput'
              description: 'Optional list of activation rules that gate the subscription activation. When a `payment` rule is provided and the plan is paid in advance (and the subscription is not in a trial), the subscription is created in the `incomplete` state and is only activated once the gating payment succeeds. If the payment fails or the rule''s `timeout_hours` elapses, the subscription is canceled.

                '
    AlertThresholdBaseObject:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: Code identifying the threshold inside the alert. You set it when you create or update the alert.
          example: warn
        recurring:
          type: boolean
          default: false
          description: This field when set to `true` indicates that the alert will be retriggered when this threshold is reached after the last non-recurring threshold. Only one recurring threshold per alert allowed.
          example: false
    SubscriptionActivationRuleInput:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          description: The type of the activation rule. Only `payment` is currently supported. A `payment` rule gates the subscription activation on a successful payment of the first invoice.
          example: payment
          enum:
          - payment
        timeout_hours:
          type: integer
          description: The number of hours the subscription stays in the `incomplete` state waiting for the payment to succeed before it is automatically canceled. Must be a positive integer or zero.
          example: 48
    ChargeFiltersPaginated:
      type: object
      required:
      - filters
      - meta
      properties:
        filters:
          type: array
          items:
            $ref: '#/components/schemas/ChargeFilterFullObject'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    FixedChargeOverridableInput:
      type: object
      description: Properties of a fixed charge that can be overridden at the subscription level.
      properties:
        invoice_display_name:
          type:
          - string
          - 'null'
          description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the name of the add-on will be used as the default display name.
          example: Setup Fee
        units:
          type: string
          description: The quantity of units for the fixed charge.
          example: '1.0'
        apply_units_immediately:
          type: boolean
          description: When set to `true`, the fixed charge units are applied immediately for active subscriptions. When set to `false`, the units are applied at the next billing period.
          example: false
        properties:
          $ref: '#/components/schemas/ChargeProperties'
          description: List of all thresholds utilized for calculating the fixed charge.
        tax_codes:
          $ref: '#/components/schemas/TaxCodes'
    PlanEntitlementObject:
      type: object
      required:
      - code
      - name
      - description
      - privileges
      properties:
        code:
          type: string
          example: seats
          description: Unique code used to identify the feature. Max 255 characters.
        name:
          type:
          - string
          - 'null'
          example: Number of seats
          description: Name of the feature. Max 255 characters.
        description:
          type:
          - string
          - 'null'
          example: Number of users of the account
          description: Description of the feature. Max 600 characters.
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/PlanEntitlementPrivilegeObject'
          example:
          - code: max
            name: Maximum
            value_type: integer
            config: {}
            value: 10
          - code: max_admins
            name: Max Admins
            value_type: integer
            config: {}
            value: 5
          - code: root
            name: Allow root user
            value_type: boolean
            config: {}
            value: true
          - code: provider
            name: SSO Provider
            value_type: select
            value: google
            config:
              select_options:
              - google
              - okta
          description: Privileges associated with this feature. Each privilege must have a value assigned.
    BillableMetricObject:
      type: object
      required:
      - lago_id
      - name
      - code
      - aggregation_type
      - recurring
      - created_at
      - filters
      properties:
        lago_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier of the billable metric created by Lago.
        name:
          type: string
          example: Storage
          description: Name of the billable metric.
        code:
          type: string
          example: storage
          description: Unique code used to identify the billable metric associated with the API request. This code associates each event with the correct metric.
        description:
          type:
          - string
          - 'null'
          example: GB of storage used in my application
          description: Internal description of the billable metric.
        recurring:
          type: boolean
          example: false
          description: 'Defines if the billable metric is persisted billing period over billing period.


            - If set to `true`: the accumulated number of units calculated from the previous billing period is persisted to the next billing period.

            - If set to `false`: the accumulated number of units is reset to 0 at the end of the billing period.

            - If not defined in the request, default value is `false`.'
        rounding_function:
          type:
          - string
          - 'null'
          enum:
          - ceil
          - floor
          - round
          - null
          example: round
          description: Refers to the numeric value or mathematical expression that will be rounded based on the calculated number of billing units. Possible values are `round`, `ceil` and `floor`.
        rounding_precision:
          type:
          - integer
          - 'null'
          example: 2
          description: Specifies the number of decimal places to which the `rounding_function` will be rounded. It can be a positive or negative value.
        created_at:
          type: string
          format: date-time
          example: '2022-09-14T16:35:31Z'
          description: Creation date of the billable metric.
        expression:
          type:
          - string
          - 'null'
          example: round((event.properties.ended_at - event.properties.started_at) * event.properties.units)
          description: Expression used to calculate the event units. The expression is evaluated for each event and the result is then used to calculate the total aggregated units.
        field_name:
          type:
          - string
          - 'null'
          example: gb
          description: Property of the billable metric used for aggregating usage data. This field is not required for `count_agg`.
        aggregation_type:
          type: string
          description: Aggregation method used to compute usage for this billable metric.
          example: sum_agg
          enum:
          - count_agg
          - sum_agg
          - max_agg
          - unique_count_agg
          - weighted_sum_agg
          - latest_agg
        weighted_interval:
          type:
          - string
          - 'null'
          enum:
          - seconds
          - null
          example: seconds
          description: Parameter exclusively utilized in conjunction with the `weighted_sum_agg` aggregation type. It serves to adjust the aggregation result by assigning weights and proration to the result based on time intervals.
        filters:
          type: array
          items:
            $ref: '#/components/schemas/BillableMetricFilterObject'
    PlanOverridesObject:
      type: object
      description: Based plan overrides.
      properties:
        amount_cents:
          type: integer
          description: The base cost of the plan, excluding any applicable taxes, that is billed on a recurring basis. This value is defined at 0 if your plan is a pay-as-you-go plan.
          example: 10000
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the plan. It indicates the monetary unit in which the plan's cost, including taxes and usage-based charges, is expressed.
          example: USD
        description:
          type: string
          description: The description on the plan.
          example: Plan for early stage startups.
        invoice_display_name:
          type: string
          example: Startup plan
          description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the name of the plan will be used as the default display name.
        name:
          type: string
          example: Startup
          description: The name of the plan.
        tax_codes:
          $ref: '#/components/schemas/TaxCodes'
        trial_period:
          type: number
          description: The duration in days during which the base cost of the plan is offered for free.
          example: 5
        minimum_commitment:
          $ref: '#/components/schemas/MinimumCommitmentInput'
        charges:
          type: array
          description: Additional usage-based charges for this plan.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: Unique identifier of the charge created by Lago.
                example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              billable_metric_id:
                type: string
                format: uuid
                description: Unique identifier of the billable metric created by Lago.
                example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              code:
                type: string
                description: Unique code identifying the charge within the plan.
                example: api_requests_charge
              charge_model:
                $ref: '#/components/schemas/ChargeModelEnum'
              invoice_display_name:
                type: string
                description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the name of the actual charge will be used as the default display name.
                example: Setup
              min_amount_cents:
                type: integer
                description: The minimum spending amount required for the charge, measured in cents and excluding any applicable taxes. It indicates the minimum amount that needs to be charged for each billing period.
                example: 0
              properties:
                $ref: '#/components/schemas/ChargeObjectProperties'
                description: List of all thresholds utilized for calculating the charge.
              filters:
                type: array
                description: List of filters used to apply differentiated pricing based on additional event properties.
                items:
                  $ref: '#/components/schemas/ChargeFilterInput'
              tax_codes:
                $ref: '#/components/schemas/TaxCodes'
              applied_pricing_unit:
                type: object
                description: Updates the pricing unit conversion rate for this charge. Only applies if the charge has applied pricing unit.
                properties:
                  conversion_rate:
                    type: string
                    description: 'The conversion rate from pricing units to the plan''s currency.

                      This rate determines how many currency units (in the plan''s base currency) equal one pricing unit.

                      For example, if the plan uses USD and the conversion rate is 0.5, then 1 pricing unit = $0.50 USD.'
                    example: '0.5'
        fixed_charges:
          type: array
          description: Fixed charge overrides for the subscription. When `plan_overrides` contains only `fixed_charges` and every entry contains only `id`, `units`, and optionally `apply_units_immediately`, the units are recorded as a per-subscription override without creating a plan override, and subscription-scoped reads return these units. If any entry carries other fields, or `plan_overrides` contains any other key, the request is applied as a full plan override for the subscription instead.
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: string
                format: uuid
                description: Unique identifier of the fixed charge created by Lago.
                example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              invoice_display_name:
                type: string
                description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the name of the actual charge will be used as the default display name.
                example: Setup fee
              units:
                type: number
                description: The number of units for the fixed charge. Defaults to 0 if not provided.
                example: 1
                default: 0
              apply_units_immediately:
                type: boolean
                description: Determines if the units should be applied immediately upon assignment or deferred to the next billing cycle.
                example: true
              properties:
                $ref: '#/components/schemas/FixedChargeProperties'
                description: List of all thresholds utilized for calculating the fixed charge.
              tax_codes:
                $ref: '#/components/schemas/TaxCodes'
                description: List of taxes applied to the fixed charge.
        usage_thresholds:
          type: array
          deprecated: true
          description: '**Deprecated.** Managing usage thresholds through `plan_overrides` is deprecated and its behavior is inconsistent: an empty array does not reliably clear thresholds (it is ignored the first time a subscription is overridden), and it never affects thresholds inherited from a parent plan. Use the top-level `usage_thresholds` array on the subscription instead, or `progressive_billing_disabled` to switch progressive billing off.

            '
          items:
            $ref: '#/components/schemas/UsageThresholdInput'
        metadata:
          $ref: '#/components/schemas/MetadataInput'
    PlanObject:
      type: object
      required:
      - lago_id
      - name
      - created_at
      - code
      - interval
      - amount_cents
      - amount_currency
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the plan created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        name:
          type: string
          description: The name of the plan.
          example: Startup
        invoice_display_name:
          type:
          - string
          - 'null'
          description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the name of the plan will be used as the default display name.
          example: Startup plan
        created_at:
          type: string
          format: date-time
          description: The date and time when the plan was created. It is expressed in UTC format according to the ISO 8601 datetime standard. This field provides the timestamp for the exact moment when the plan was initially created.
          example: '2023-06-27T19:43:42Z'
        code:
          type: string
          description: The code of the plan. It serves as a unique identifier associated with a particular plan. The code is typically used for internal or system-level identification purposes, like assigning a subscription, for instance.
          example: startup
        interval:
          type: string
          description: 'The interval used for recurring billing. It represents the frequency at which subscription billing occurs. The interval can be one of the following values: `yearly`, `semiannual`, `quarterly`, `monthly` or `weekly`.'
          enum:
          - weekly
          - monthly
          - quarterly
          - semiannual
          - yearly
          example: monthly
        description:
          type:
          - string
          - 'null'
          description: The description on the plan.
          example: Plan for early stage startups.
        amount_cents:
          type: integer
          description: The base cost of the plan, excluding any applicable taxes, that is billed on a recurring basis. This value is defined at 0 if your plan is a pay-as-you-go plan.
          example: 10000
        amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the plan. It indicates the monetary unit in which the plan's cost, including taxes and usage-based charges, is expressed.
          example: USD
        trial_period:
          type:
          - number
          - 'null'
          description: The duration in days during which the base cost of the plan is offered for free.
          example: 5
        pay_in_advance:
          type: boolean
          description: This field determines the billing timing for the plan. When set to `true`, the base cost of the plan is due at the beginning of each billing period. Conversely, when set to `false`, the base cost of the plan is due at the end of each billing period.
          example: true
        bill_charges_monthly:
          type:
          - boolean
          - 'null'
          description: This field, when set to `true`, enables to invoice usage-based charges on monthly basis, even if the cadence of the plan is yearly or semiannual. This allows customers to pay charges overage on a monthly basis. This can be set to true only if the plan's interval is `yearly` or `semiannual`.
          example: null
        bill_fixed_charges_monthly:
          type:
          - boolean
          - 'null'
          description: This field, when set to `true`, enables to invoice fixed charges on monthly basis, even if the cadence of the plan is yearly or semiannual. This allows customers to pay fixed charges on a monthly basis. This can be set to true only if the plan's interval is `yearly` or `semiannual`.
          example: null
        parent_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Unique identifier of the parent plan, created by Lago. It is set on plans that override a parent plan for a single subscription, and `null` on standard plans.
          example: null
        pending_deletion:
          type: boolean
          description: This field is set to `true` when the plan is scheduled for deletion but still attached to subscriptions that have to be billed first.
          example: false
        minimum_commitment:
          $ref: '#/components/schemas/MinimumCommitmentObject'
        charges:
          type: array
          items:
            $ref: '#/components/schemas/ChargeObject'
          description: Additional usage-based charges for this plan.
          example:
          - lago_id: 1a901a90-1a90-1a90-1a90-1a901a901a91
            lago_billable_metric_id: 1a901a90-1a90-1a90-1a90-1a901a901a91
            billable_metric_code: requests
            created_at: '2023-06-27T19:43:42Z'
            charge_model: package
            invoiceable: true
            invoice_display_name: Setup
            pay_in_advance: false
            regroup_paid_fees: null
            prorated: false
            min_amount_cents: 3000
            properties:
              amount: '30'
              free_units: 100
              package_size: 1000
            filters: []
          - lago_id: 1a901a90-1a90-1a90-1a90-1a901a901a92
            lago_billable_metric_id: 1a901a90-1a90-1a90-1a90-1a901a901a92
            billable_metric_code: cpu
            created_at: '2023-06-27T19:43:42Z'
            charge_model: graduated
            invoiceable: true
            invoice_display_name: Setup
            pay_in_advance: false
