              description: Value for integer type privileges
            - type: boolean
              description: Value for boolean type privileges
            - type: string
              description: Value for string or select type privileges
            example: 10
            description: Value assigned to this privilege in the entitlement. Type depends on the privilege's value_type.
    TaxCodes:
      type: array
      items:
        type: string
      description: List of unique code used to identify the taxes.
      example:
      - french_standard_vat
    AlertObject:
      type: object
      required:
      - lago_id
      - lago_organization_id
      - external_subscription_id
      - lago_wallet_id
      - wallet_code
      - billable_metric
      - alert_type
      - code
      - name
      - direction
      - previous_value
      - last_processed_at
      - thresholds
      - created_at
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the alert, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_organization_id:
          type: string
          format: uuid
          description: Unique identifier of the organization, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_subscription_id:
          type: string
          description: The subscription external unique identifier (provided by your own application).
          example: sub_1234567890
        lago_wallet_id:
          type: 'null'
          description: Always null. An alert returned by the subscription endpoints is never attached to a wallet.
        wallet_code:
          type: 'null'
          description: Always null. An alert returned by the subscription endpoints is never attached to a wallet.
        billable_metric:
          oneOf:
          - $ref: '#/components/schemas/BillableMetricObject'
          - type: 'null'
          description: The billable metric associated with the alert. Null unless the alert type is based on a billable metric.
        alert_type:
          type: string
          description: The type of alert.
          enum:
          - current_usage_amount
          - billable_metric_current_usage_amount
          - billable_metric_current_usage_units
          - lifetime_usage_amount
          - billable_metric_lifetime_usage_units
          example: billable_metric_current_usage_amount
        code:
          type: string
          description: Unique code used to identify the alert.
          example: storage_threshold_alert
        name:
          type:
          - string
          - 'null'
          description: The name of the alert.
          example: Storage Usage Alert
        direction:
          type: string
          description: Indicates whether the alert is triggered when the monitored metric goes above or below the threshold. Lago sets it from the alert type and you cannot change it. A subscription alert is always `increasing`.
          enum:
          - increasing
          - decreasing
          example: increasing
        previous_value:
          type: string
          description: When the system checked if this alert should be triggered, this value was retrieved and checked against the thresholds. Returned as a string formatted as a BigDecimal.
          example: '1000.0'
        last_processed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time in UTC (ISO 8601) when the system checked if this alert should be triggered. Null until it's processed for the first time.
          example: '2025-05-19T10:04:21Z'
        thresholds:
          type: array
          description: Array of thresholds associated with the alert.
          items:
            $ref: '#/components/schemas/AlertThresholdObject'
        created_at:
          type: string
          format: date-time
          description: The date and time in UTC (ISO 8601) when the alert was created.
          example: '2025-03-20T10:00:00Z'
    SubscriptionChargeOverride:
      type: object
      required:
      - charge
      properties:
        charge:
          $ref: '#/components/schemas/ChargeOverridableInput'
    SubscriptionActivationRuleObject:
      type: object
      required:
      - lago_id
      - type
      - timeout_hours
      - status
      - expires_at
      - created_at
      - updated_at
      properties:
        lago_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the activation rule within the Lago application. This ID is exclusively created by Lago.
        type:
          type: string
          description: The type of the activation rule. Only `payment` is currently supported. A `payment` rule gates the subscription activation on a successful payment of the first invoice.
          example: payment
          enum:
          - payment
        timeout_hours:
          type: integer
          description: The number of hours the subscription stays in the `incomplete` state waiting for the payment to succeed before it is automatically canceled.
          example: 48
        status:
          type: string
          description: 'The evaluation status of the activation rule:

            - `inactive`: the rule has not been evaluated yet.

            - `pending`: the rule is applicable and is waiting to be satisfied (e.g. waiting for the payment).

            - `satisfied`: the rule has been satisfied and no longer blocks activation.

            - `declined`: the rule was applicable but was declined.

            - `failed`: the rule could not be satisfied (e.g. the payment failed).

            - `expired`: the rule was not satisfied before its timeout elapsed.

            - `not_applicable`: the rule did not apply to this subscription.'
          example: pending
          enum:
          - inactive
          - pending
          - satisfied
          - declined
          - failed
          - expired
          - not_applicable
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-08-10T00:00:00Z'
          description: The date and time when the rule expires, after which an unsatisfied rule causes the subscription to be canceled. Represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC). Null until the rule starts being evaluated.
        created_at:
          type: string
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The creation date of the activation rule, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
        updated_at:
          type: string
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The last update date of the activation rule, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
    ApiErrorUnauthorized:
      type: object
      required:
      - status
      - error
      properties:
        status:
          type: integer
          format: int32
          example: 401
        error:
          type: string
          example: Unauthorized
    SubscriptionObject:
      type: object
      required:
      - activated_at
      - activation_rules
      - billing_time
      - canceled_at
      - cancellation_reason
      - consolidate_invoice
      - created_at
      - current_billing_period_ending_at
      - current_billing_period_started_at
      - downgrade_plan_date
      - ending_at
      - external_customer_id
      - external_id
      - lago_customer_id
      - lago_id
      - name
      - next_plan_code
      - on_termination_credit_note
      - on_termination_invoice
      - payment_method
      - plan_amount_cents
      - plan_amount_currency
      - plan_code
      - previous_plan_code
      - progressive_billing_disabled
      - purchase_order_number
      - started_at
      - status
      - subscription_at
      - terminated_at
      - trial_ended_at
      properties:
        lago_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the subscription within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the subscription's record within the Lago system
        external_id:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
          description: The subscription external unique identifier (provided by your own application).
        lago_customer_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system
        external_customer_id:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
          description: The customer external unique identifier (provided by your own application).
        billing_entity_code:
          type: string
          example: default
          description: The code of the billing entity associated with the subscription.
        billing_time:
          type: string
          description: The billing time for the subscription, which can be set as either `anniversary` or `calendar`. If not explicitly provided, it will default to `calendar`. The billing time determines the timing of recurring billing cycles for the subscription. By specifying `anniversary`, the billing cycle will be based on the specific date the subscription started (billed fully), while `calendar` sets the billing cycle at the first day of the week/month/year (billed with proration).
          example: anniversary
          enum:
          - calendar
          - anniversary
        name:
          type:
          - string
          - 'null'
          example: Repository A
          description: The display name of the subscription on an invoice. This field allows for customization of the subscription's name for billing purposes, especially useful when a single customer has multiple subscriptions using the same plan.
        plan_code:
          type: string
          example: premium
          description: The unique code representing the plan to be attached to the customer. This code must correspond to the `code` property of one of the active plans.
        plan_amount_cents:
          type: integer
          description: The base cost of the related plan, excluding any applicable taxes, that is billed on a recurring basis.
          example: 10000
        plan_amount_currency:
          $ref: '#/components/schemas/Currency'
          description: The currency of the related plan. It indicates the monetary unit in which the plan's cost, including taxes and usage-based charges, is expressed.
          example: USD
        status:
          type: string
          description: 'The status of the subscription, which can have the following values:

            - `active`: the subscription is currently active and applied to the customer.

            - `canceled`: the subscription has been stopped before its activation. This can occur when two consecutive downgrades have been applied to a customer, when a subscription with a pending status is terminated, or when a payment-gated subscription fails to be paid (or its activation rule expires) before activation. When caused by payment gating, the `cancellation_reason` field is set.

            - `incomplete`: the subscription was created with a payment activation rule and is waiting for the gating payment to succeed before it becomes `active`. It is automatically `canceled` if the payment fails or the activation rule expires.

            - `pending`: a previous subscription has been downgraded, and the current one is awaiting automatic activation at the end of the billing period.

            - `terminated`: the subscription is no longer active.'
          example: active
          enum:
          - active
          - canceled
          - incomplete
          - pending
          - terminated
        created_at:
          type: string
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The creation date of the subscription, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC). This date provides a timestamp indicating when the subscription was initially created.
        canceled_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-09-14T16:35:31Z'
          description: The cancellation date of the subscription. This field is not null when the subscription is `canceled`. This date should be provided in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
        started_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The effective start date of the subscription. This field can be null if the subscription is `pending` or `canceled`. This date should be provided in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
        ending_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-10-08T00:00:00Z'
          description: The effective end date of the subscription. If this field is set to null, the subscription will automatically renew. This date should be provided in ISO 8601 datetime format, and use Coordinated Universal Time (UTC).
        subscription_at:
          type: string
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The anniversary date and time of the initial subscription. This date serves as the basis for billing subscriptions with `anniversary` billing time. The `anniversary_date` should be provided in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
        terminated_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-09-14T16:35:31Z'
          description: The termination date of the subscription. This field is not null when the subscription is `terminated`. This date should be provided in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC)
        previous_plan_code:
          type:
          - string
          - 'null'
          example: null
          description: The code identifying the previous plan associated with this subscription.
        next_plan_code:
          type:
          - string
          - 'null'
          example: null
          description: The code identifying the next plan in the case of a downgrade.
        downgrade_plan_date:
          type:
          - string
          - 'null'
          format: date
          example: '2022-04-30'
          description: The date when the plan will be downgraded, represented in ISO 8601 date format.
        trial_ended_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The date when the free trial is ended, represented in ISO 8601 date format.
        current_billing_period_started_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: The date and time when the current billing period started, represented in ISO 8601 date format.
        current_billing_period_ending_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-09-08T00:00:00Z'
          description: The date and time when the current billing period ends, represented in ISO 8601 date format.
        on_termination_credit_note:
          type:
          - string
          - 'null'
          description: 'When a pay-in-advance subscription is terminated before the end of its billing period, we generate a credit note for the unused subscription time by default.

            This field allows you to control the behavior of the credit note generation:


            - `credit`: A credit note is generated for the unused subscription time. The unused amount is credited back to the customer.

            - `refund`: A credit note is generated for the unused subscription time. If the invoice is paid or partially paid, the unused paid amount is refunded; any unpaid unused amount is credited back to the customer.

            - `offset`: A credit note is generated for the unused subscription time. If the invoice is paid or partially paid, the unused paid amount is refunded; any unpaid unused amount is applied to the invoice reducing its amount due.

            - `skip`: No credit note is generated for the unused subscription time.


            _Note: This field is only applicable to pay-in-advance plans and will be `null` for pay-in-arrears plans._

            '
          example: credit
          enum:
          - credit
          - refund
          - offset
          - skip
        on_termination_invoice:
          type:
          - string
          example: generate
          enum:
          - generate
          - skip
          default: generate
          description: 'When a subscription is terminated before the end of its billing period, we generate an invoice for the unbilled usage.

            This field allows you to control the behavior of the invoice generation:


            - `generate`: An invoice is generated for the unbilled usage.

            - `skip`: No invoice is generated for the unbilled usage.

            '
        applied_invoice_custom_sections:
          description: The invoice custom sections applied to invoices generated by this subscription. Only returned when creating, retrieving, updating or terminating a subscription, not when listing subscriptions and not in subscription webhooks.
          type: array
          items:
            $ref: '#/components/schemas/AppliedInvoiceCustomSectionObject'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodReference'
          description: The payment method assigned to this subscription for processing payments.
        consolidate_invoice:
          type: boolean
          default: true
          example: true
          description: 'Controls whether this subscription is eligible to be grouped with other subscriptions of the same customer on a consolidated recurring invoice.


            - `true` (default): the subscription is included in the customer''s standard invoice grouping (by billing entity, currency and payment method).

            - `false`: the subscription is excluded from consolidation and always billed on its own dedicated invoice, regardless of other grouping criteria.

            '
        progressive_billing_disabled:
          type: boolean
          default: false
          example: false
          description: 'Indicates whether progressive billing is switched off for this subscription, regardless of any usage thresholds defined on the plan (including thresholds inherited from a parent plan when the subscription runs on a plan override).


            When `true`, no progressive billing invoice is issued for this subscription.

            '
        cancellation_reason:
          type:
          - string
          - 'null'
          example: payment_failed
          enum:
          - payment_failed
          - timeout
          - manual
          description: 'The reason a payment-gated subscription was canceled while still `incomplete`. Null unless the subscription was canceled before activation.


            - `payment_failed`: the gating payment failed.

            - `timeout`: the activation rule expired before the payment succeeded.

            - `manual`: the incomplete subscription was canceled on demand, via a terminate request with `status=incomplete`.

            '
        activated_at:
          type:
          - string
          - 'null'
          format: date-time
          example: '2022-08-08T00:00:00Z'
          description: 'The date and time when a payment-gated subscription was activated (i.e. moved from `incomplete` to `active` once the gating payment succeeded), represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC). Null while the subscription is still `incomplete`.

            '
        activation_rules:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionActivationRuleObject'
          description: 'The activation rules attached to the subscription. A payment activation rule gates activation on a successful first payment, keeping the subscription in the `incomplete` state until the payment succeeds or the rule expires.

            '
        purchase_order_number:
          type:
          - string
          - 'null'
          example: PO-123
          description: The purchase order number associated with the subscription. It will be added to invoices generated for this subscription.
    ApiErrorNotFound:
      type: object
      required:
      - status
      - error
      - code
      properties:
        status:
          type: integer
          format: int32
          example: 404
        error:
          type: string
          example: Not Found
        code:
          type: string
          example: object_not_found
    ChargeOverridableInput:
      type: object
      description: Properties of a charge that can be overridden at the subscription level.
      properties:
        invoice_display_name:
          type: string
          description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the name of the actual charge will be used as the default display name.
          example: Setup
        min_amount_cents:
          type: integer
          description: The minimum spending amount required for the charge, measured in cents and excluding any applicable taxes. It indicates the minimum amount that needs to be charged for each billing period.
          example: 0
        properties:
          $ref: '#/components/schemas/ChargeObjectProperties'
          description: List of all thresholds utilized for calculating the charge.
        filters:
          type: array
          description: List of filters used to apply differentiated pricing based on additional event properties.
          items:
            $ref: '#/components/schemas/ChargeFilterInput'
        tax_codes:
          $ref: '#/components/schemas/TaxCodes'
        applied_pricing_unit:
          type: object
          description: The pricing unit to apply to the charge.
          properties:
            code:
              type: string
              description: The code of the pricing unit.
              example: credits
            conversion_rate:
              type: string
              description: 'The conversion rate from pricing units to the plan''s currency.

                This rate determines how many currency units (in the plan''s base currency) equal one pricing unit.

                For example, if the plan uses USD and the conversion rate is 0.5, then 1 pricing unit = $0.50.'
              example: '0.5'
    ChargeModelEnum:
      type: string
      description: "Specifies the pricing model used for the calculation of the final fee. It can be any of the following values:\n  - [`dynamic`](https://docs.getlago.com/guide/plans/charges/charge-models/dynamic)\n  - [`graduated_percentage`](https://docs.getlago.com/guide/plans/charges/charge-models/graduated-percentage)\n  - [`graduated`](https://docs.getlago.com/guide/plans/charges/charge-models/graduated)\n  - [`package`](https://docs.getlago.com/guide/plans/charges/charge-models/package)\n  - [`percentage`](https://docs.getlago.com/guide/plans/charges/charge-models/percentage)\n  - [`standard`](https://docs.getlago.com/guide/plans/charges/charge-models/standard)\n  - [`volume`](https://docs.getlago.com/guide/plans/charges/charge-models/volume)\n"
      enum:
      - dynamic
      - graduated
      - graduated_percentage
      - package
      - percentage
      - standard
      - volume
    AlertCreateInput:
      type: object
      required:
      - alert
      properties:
        alert:
          allOf:
          - $ref: '#/components/schemas/AlertBaseInput'
          - type: object
            required:
            - alert_type
            - code
            - thresholds
            properties:
              alert_type:
                type: string
                description: The type of alert.
                enum:
                - current_usage_amount
                - billable_metric_current_usage_amount
                - billable_metric_current_usage_units
                - lifetime_usage_amount
                - billable_metric_lifetime_usage_units
                example: billable_metric_current_usage_amount
              code:
                type: string
                description: Unique code used to identify the alert.
                example: storage_threshold_alert
              billable_metric_code:
                type:
                - string
                - 'null'
                description: The code of the billable metric associated with the alert. Only for alerts based on a billable metric.
                example: storage_usage
    LifetimeUsageObject:
      type: object
      required:
      - lago_id
      - lago_subscription_id
      - external_subscription_id
      - external_historical_usage_amount_cents
      - invoiced_usage_amount_cents
      - current_usage_amount_cents
      - from_datetime
      - to_datetime
      properties:
        lago_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the lifetime usage record within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the lifetime usage record within the Lago system
        lago_subscription_id:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
          description: Unique identifier assigned to the subscription record within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the subscription record within the Lago system
        external_subscription_id:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
          description: The subscription external unique identifier (provided by your own application).
        external_historical_usage_amount_cents:
          type: integer
          example: 100
          description: The historical usage amount in cents for the subscription (provided by your own application).
        invoiced_usage_amount_cents:
          type: integer
          example: 100
          description: The total invoiced usage amount in cents for the subscription.
        current_usage_amount_cents:
          type: integer
          example: 100
          description: The current usage amount in cents for the subscription on the current billing period.
        from_datetime:
          type:
          - string
          - 'null'
          format: date-time
          example: '2024-01-01T00:00:00Z'
          description: The recording start date and time of the subscription lifetime usage. The date and time must be in ISO 8601 format.
        to_datetime:
          type: string
          format: date-time
          example: '2024-12-31T23:59:59Z'
          description: The recording end date and time of the subscription lifetime usage. The date and time must be in ISO 8601 format.
        usage_thresholds:
          type: array
          description: Array of usage thresholds that apply to the subscription. Thresholds attached to the subscription take precedence over the ones attached to its plan. This array is returned only when at least one threshold applies.
          items:
            $ref: '#/components/schemas/LifetimeUsageThresholdObject'
    PlanEntitlement:
      type: object
      required:
      - entitlement
      properties:
        entitlement:
          $ref: '#/components/schemas/PlanEntitlementObject'
