          type: integer
          format: int32
          example: 404
        error:
          type: string
          example: Not Found
        code:
          type: string
          example: object_not_found
    ChargeOverridableInput:
      type: object
      description: Properties of a charge that can be overridden at the subscription level.
      properties:
        invoice_display_name:
          type: string
          description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the name of the actual charge will be used as the default display name.
          example: Setup
        min_amount_cents:
          type: integer
          description: The minimum spending amount required for the charge, measured in cents and excluding any applicable taxes. It indicates the minimum amount that needs to be charged for each billing period.
          example: 0
        properties:
          $ref: '#/components/schemas/ChargeObjectProperties'
          description: List of all thresholds utilized for calculating the charge.
        filters:
          type: array
          description: List of filters used to apply differentiated pricing based on additional event properties.
          items:
            $ref: '#/components/schemas/ChargeFilterInput'
        tax_codes:
          $ref: '#/components/schemas/TaxCodes'
        applied_pricing_unit:
          type: object
          description: The pricing unit to apply to the charge.
          properties:
            code:
              type: string
              description: The code of the pricing unit.
              example: credits
            conversion_rate:
              type: string
              description: 'The conversion rate from pricing units to the plan''s currency.

                This rate determines how many currency units (in the plan''s base currency) equal one pricing unit.

                For example, if the plan uses USD and the conversion rate is 0.5, then 1 pricing unit = $0.50.'
              example: '0.5'
    ChargeCreateInput:
      type: object
      required:
      - charge
      properties:
        charge:
          allOf:
          - $ref: '#/components/schemas/ChargeInput'
          - required:
            - billable_metric_id
            - charge_model
            - code
          - properties:
              cascade_updates:
                type: boolean
                description: This field determines whether the creation of the charge should be cascaded to the children plans. When set to `true`, the charge will be created in children plans. Conversely, when set to `false`, the charge will only be created in the plan itself. If not defined in the request, default value is `false`.
                example: true
    ChargeModelEnum:
      type: string
      description: "Specifies the pricing model used for the calculation of the final fee. It can be any of the following values:\n  - [`dynamic`](https://docs.getlago.com/guide/plans/charges/charge-models/dynamic)\n  - [`graduated_percentage`](https://docs.getlago.com/guide/plans/charges/charge-models/graduated-percentage)\n  - [`graduated`](https://docs.getlago.com/guide/plans/charges/charge-models/graduated)\n  - [`package`](https://docs.getlago.com/guide/plans/charges/charge-models/package)\n  - [`percentage`](https://docs.getlago.com/guide/plans/charges/charge-models/percentage)\n  - [`standard`](https://docs.getlago.com/guide/plans/charges/charge-models/standard)\n  - [`volume`](https://docs.getlago.com/guide/plans/charges/charge-models/volume)\n"
      enum:
      - dynamic
      - graduated
      - graduated_percentage
      - package
      - percentage
      - standard
      - volume
    ChargeFilterCreateInput:
      type: object
      required:
      - filter
      properties:
        filter:
          type: object
          required:
          - properties
          - values
          properties:
            cascade_updates:
              type: boolean
              description: This field determines whether the creation of the filter should be cascaded to the children plans. When set to `true`, the changes will be cascaded into children. Conversely, when set to `false`, the changes will only be applied to the plan itself. If not defined in the request, default value is `false`. This field only applies to plan charge filters and is ignored on the subscription charge filter endpoints.
              example: true
            invoice_display_name:
              type:
              - string
              - 'null'
              description: Specifies the name that will be displayed on an invoice. If no value is set for this field, the values of the filter will be used as the default display name.
              example: AWS
            properties:
              $ref: '#/components/schemas/ChargeProperties'
              description: List of all thresholds utilized for calculating the charge.
            values:
              type: object
              description: List of possible filter values. The key and values must match one of the billable metric filters.
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                region:
                - us-east-1
    FixedChargeModelEnum:
      type: string
      description: "Specifies the pricing model used for the calculation of the fixed charge fee. It can be any of the following values:\n  - `standard`\n  - `graduated`\n  - `volume`\n"
