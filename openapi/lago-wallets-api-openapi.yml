          example: settled
        source:
          type: string
          enum:
          - manual
          - interval
          - threshold
          description: The source field represents the origin or trigger of the wallet transaction. Possible values are `manual`, `interval`, `threshold`
          example: manual
        transaction_status:
          type: string
          enum:
          - purchased
          - granted
          - voided
          - invoiced
          description: The transaction status of the wallet transaction. Possible values are `purchased` (with pending or settled status), `granted` (without invoice_id), `voided` or `invoiced`.
          example: purchased
        transaction_type:
          type: string
          enum:
          - inbound
          - outbound
          description: The type of transaction. Possible values are `inbound` (increasing the balance) or `outbound` (decreasing the balance).
          example: inbound
        amount:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          description: The amount of credits based on the rate and the currency.
          example: '10.0'
        credit_amount:
          type: string
          pattern: ^[0-9]+.?[0-9]*$
          description: The number of credits used in the wallet transaction.
          example: '100.0'
        invoice_requires_successful_payment:
          type: boolean
          description: A boolean setting that, when set to true, delays issuing an invoice for a wallet top-up until a successful payment is made; if false, the invoice is issued immediately upon wallet top-up, regardless of the payment status. Default value of false.
          example: false
        metadata:
          type: array
          description: This field allows you to store a list of key-value pairs that hold additional information or custom attributes related to the data.
          items:
            type: object
            properties:
              key:
                type: string
                description: The unique identifier for the attribute.
              value:
                type: string
                description: The value associated with the key.
          example:
          - key: example key
            value: example value
          - key: another key
            value: another value
        remaining_amount_cents:
          type:
          - integer
          - 'null'
          description: The remaining unconsumed amount of an inbound wallet transaction, expressed in cents. Only present for inbound transactions on traceable wallets. Tracks how much of the original credited amount has not yet been consumed by outbound transactions.
          example: 5000
        remaining_credit_amount:
          type:
          - string
          - 'null'
          pattern: ^[0-9]+.?[0-9]*$
          description: The remaining unconsumed amount of an inbound wallet transaction, expressed in credits. Only present for inbound transactions on traceable wallets.
          example: '5.0'
        priority:
          type: integer
          description: The priority of the wallet transaction, used to determine the order in which inbound transactions are consumed. Lower values are consumed first.
          example: 50
        settled_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date when wallet transaction is settled, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
          example: '2022-04-29T08:59:51Z'
        failed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date when the wallet transaction failed, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
          example: '2022-04-29T08:59:51Z'
        created_at:
          type: string
          format: date-time
          description: The date of the wallet transaction creation, represented in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
          example: '2022-04-29T08:59:51Z'
        name:
          type:
          - string
          - 'null'
          description: The name of the wallet transaction. It will appear on the invoice as the label for the fee. If not set, the label on the invoice will fallback to either `Prepaid credits - {{wallet_name}}` if the wallet name is set, or `Prepaid credits`.
          example: Tokens for models 'high-fidelity-boost'
        applied_invoice_custom_sections:
          description: The invoice custom sections applied to invoices generated by this wallet transaction.
          type: array
          items:
            $ref: '#/components/schemas/AppliedInvoiceCustomSectionObject'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodReference'
          description: The payment method assigned to this wallet transaction for processing the payment.
        purchase_order_number:
          type:
          - string
          - 'null'
          example: PO-123
          description: The purchase order number associated with this wallet transaction. It will be added to invoices generated for the resulting wallet top-up. If not set, falls back to the wallet's `purchase_order_number`.
    ApiErrorNotFound:
      type: object
      required:
      - status
      - error
      - code
      properties:
        status:
          type: integer
          format: int32
          example: 404
        error:
          type: string
          example: Not Found
        code:
          type: string
          example: object_not_found
    WalletTransactionPaymentUrl:
      type: object
      required:
      - wallet_transaction_payment_details
      description: The payment details generated for a wallet transaction.
      properties:
        wallet_transaction_payment_details:
          type: object
          required:
          - lago_wallet_transaction_id
          - lago_customer_id
          - external_customer_id
          - payment_provider
          - payment_url
          properties:
            lago_customer_id:
              type: string
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
              description: Unique identifier assigned to the customer within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the customer's record within the Lago system
            lago_wallet_transaction_id:
              type: string
              example: 1e501a90-1a90-1a90-1a90-1a901a901a80
              description: Unique identifier assigned to the wallet transaction within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the wallet transaction's record within the Lago system
            external_customer_id:
              type: string
              example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
              description: The customer external unique identifier (provided by your own application)
            payment_provider:
              type: string
              example: stripe
              description: The Payment Provider name linked to the Customer.
            payment_url:
              type: string
              example: https://foo.bar
              description: The generated Payment URL for the Wallet transaction.
    ApiErrorBadRequest:
      type: object
      required:
      - status
      - error
      properties:
        status:
          type: integer
          format: int32
          example: 400
        error:
          type: string
          example: Bad request
    MetadataObject:
      type:
      - object
      - 'null'
      description: 'Custom metadata stored as key-value pairs.

        Keys are strings (max 100 characters), values can be strings (max 255 characters) or null.'
      additionalProperties:
        type:
        - string
        - 'null'
      example:
        external_id: ext-123
        synced_at: '2024-01-15'
        source: null
    WalletAlertObject:
      type: object
      required:
      - lago_id
      - lago_organization_id
      - external_subscription_id
      - lago_wallet_id
      - wallet_code
      - billable_metric
      - alert_type
      - code
      - name
      - direction
      - previous_value
      - last_processed_at
      - thresholds
      - created_at
      properties:
        lago_id:
          type: string
          format: uuid
          description: Unique identifier of the alert, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        lago_organization_id:
          type: string
          format: uuid
          description: Unique identifier of the organization, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        external_subscription_id:
          type: 'null'
          description: Always null. An alert returned by the wallet endpoints is never attached to a subscription.
        lago_wallet_id:
          type: string
          description: Unique identifier of the wallet, created by Lago.
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
        wallet_code:
          type: string
          description: The wallet external unique identifier (provided by your own application).
          example: wallet_code
        billable_metric:
          type: 'null'
          description: Always null. A wallet alert is never based on a billable metric.
        alert_type:
          type: string
          description: The type of alert.
          enum:
          - wallet_balance_amount
          - wallet_credits_balance
          - wallet_ongoing_balance_amount
          - wallet_credits_ongoing_balance
          example: wallet_balance_amount
        code:
          type: string
          description: Unique code used to identify the alert.
          example: wallet_balance_alert
        name:
          type:
          - string
          - 'null'
          description: The name of the alert.
          example: Wallet Balance Alert
        direction:
          type: string
          description: Indicates whether the alert is triggered when the monitored metric goes above or below the threshold. Lago sets it from the alert type and you cannot change it. A wallet alert is always `decreasing`.
          enum:
          - increasing
          - decreasing
          example: decreasing
        previous_value:
          type: string
          description: When the system checked if this alert should be triggered, this value was retrieved and checked against the thresholds. Returned as a string formatted as a BigDecimal.
          example: '1000.0'
        last_processed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The date and time in UTC (ISO 8601) when the system checked if this alert should be triggered. Null until it's processed for the first time.
          example: '2025-05-19T10:04:21Z'
        thresholds:
          type: array
          description: Array of thresholds associated with the alert.
          items:
            $ref: '#/components/schemas/AlertThresholdObject'
        created_at:
          type: string
          format: date-time
          description: The date and time in UTC (ISO 8601) when the alert was created.
          example: '2025-03-20T10:00:00Z'
    AlertThresholdInput:
      allOf:
      - $ref: '#/components/schemas/AlertThresholdBaseObject'
      - type: object
        required:
        - value
        properties:
          value:
            oneOf:
            - type: number
            - type: string
            description: 'A value that should trigger this alert. This can be a number or a string formatted as a BigDecimal.


              The unit depends on the alert type: `billable_metric_current_usage_units` and `billable_metric_lifetime_usage_units` are expressed in units, `wallet_credits_balance` and `wallet_credits_ongoing_balance` in credits, and all other types in cents.'
            example: 99
    WalletCreateInput:
      type: object
      required:
      - wallet
      properties:
        wallet:
          type: object
          required:
          - rate_amount
          - external_customer_id
          properties:
            name:
              type:
              - string
              - 'null'
              description: The name of the wallet.
              example: Prepaid
            code:
              type:
              - string
              - 'null'
              description: The code of the wallet.
              example: prepaid
            priority:
              type: integer
              minimum: 1
              maximum: 50
              description: 'Wallet priority for ordering when a customer has multiple wallets. Allowed values: 1-50, where 1 is highest priority and 50 is lowest. Defaults to 50. Wallets with the same priority are applied by expiration date, soonest first, with wallets without an expiration date last, then by creation date, oldest first.'
              example: 50
            rate_amount:
              type: string
              pattern: ^[0-9]+.?[0-9]*$
              description: The rate of conversion between credits and the amount in the specified currency. It indicates the ratio or factor used to convert credits into the corresponding monetary value in the currency of the transaction.
              example: '1.5'
            currency:
              $ref: '#/components/schemas/Currency'
              description: The currency of the wallet. Required when the customer has no currency yet. When omitted, the wallet uses the customer's currency. When provided on a customer without a currency, it also sets the customer's currency.
              example: USD
            paid_credits:
              type:
              - string
              - 'null'
              pattern: ^[0-9]+.?[0-9]*$
              description: The number of paid credits. Required only if there is no granted credits.
              example: '20.0'
            granted_credits:
              type:
              - string
              - 'null'
              pattern: ^[0-9]+.?[0-9]*$
              description: The number of free granted credits. Required only if there is no paid credits.
              example: '10.0'
            external_customer_id:
              type: string
              description: The customer external unique identifier (provided by your own application)
              example: hooli_1234
            billing_entity_code:
              type: string
              example: default
              description: The code of the billing entity associated with the wallet. If not provided, the customer's billing entity is used.
            expiration_at:
              type:
              - string
              - 'null'
              format: date-time
              description: The date and time that determines when the wallet will expire. It follows the ISO 8601 datetime format and is expressed in Coordinated Universal Time (UTC).
              example: '2022-07-07T23:59:59Z'
            invoice_requires_successful_payment:
              type: boolean
              description: A boolean setting that, when set to true, delays issuing an invoice for a wallet top-up until a successful payment is made; if false, the invoice is issued immediately upon wallet top-up, regardless of the payment status. Default value of false.
              example: false
            transaction_metadata:
              type:
              - array
              - 'null'
              description: This optional field allows you to store a list of key-value pairs that provide additional information or custom attributes. These key-value pairs will be included in the metadata of wallet transactions generated during the wallet creation process.
              items:
                type: object
                properties:
                  key:
                    type: string
                    description: The unique identifier for the attribute.
                  value:
                    type: string
                    description: The corresponding value for the key.
              example:
              - key: example_key
                value: example_value
              - key: another_key
                value: another_value
            transaction_name:
              type:
              - string
              - 'null'
              description: The name of the wallet transactions triggered when creating the wallet. It will appear on the invoice as the label for the fee. If not set, the label on the invoice will fallback to either `Prepaid credits - {{wallet_name}}` if the wallet name is set, or `Prepaid credits`.
              example: Tokens for models 'high-fidelity-boost'
            transaction_priority:
              type: integer
              minimum: 1
              maximum: 50
              description: 'The priority of the wallet transactions triggered when creating the wallet. It drives the order in which credits are consumed. Allowed values: 1-50, where 1 is highest priority and 50 is lowest. Defaults to 50.'
              example: 50
            purchase_order_number:
              type:
              - string
              - 'null'
              example: PO-123
              description: The purchase order number associated with the wallet. It will be added to invoices generated for wallet top-ups, unless a more specific purchase order number is set on the wallet transaction or recurring transaction rule that triggered the top-up.
            applies_to:
              type:
              - object
              - 'null'
              description: Set wallet limitations to fee types.
              properties:
                fee_types:
                  type:
                  - array
                  - 'null'
                  items:
                    $ref: '#/components/schemas/WalletFeeTypeEnum'
                  description: An array of fee types to which the wallet is applicable. By specifying the fee types in this field, you can restrict the wallet's usage to specific fee types only.
                  example:
                  - charge
                billable_metric_codes:
                  type:
                  - array
                  - 'null'
                  items:
                    type: string
                  description: An array of billable metric codes to which the wallet is applicable. By specifying the billable metric codes in this field, you can restrict the wallet's usage to specific metrics only.
                  example: []
            paid_top_up_min_amount_cents:
              type:
              - integer
              - 'null'
              description: Minimum amount of cents that can be top-up with a single paid transaction.
              example: 100
            paid_top_up_max_amount_cents:
              type:
              - integer
              - 'null'
              description: Maximum amount of cents that can be top-up with a single paid transaction.
              example: 1000
            ignore_paid_top_up_limits_on_creation:
              type:
              - boolean
              - 'null'
              description: If set to true, the wallet will ignore paid top-up limits on creation.
              example: false
            invoice_custom_section:
              $ref: '#/components/schemas/InvoiceCustomSectionInput'
            recurring_transaction_rules:
              type:
              - array
              - 'null'
              description: List of recurring transaction rules. Currently, we only allow one recurring rule per wallet.
              items:
                type: object
                description: Object that represents rule for wallet recurring transactions.
                required:
                - trigger
                properties:
                  paid_credits:
                    type:
                    - string
                    - 'null'
                    pattern: ^[0-9]+.?[0-9]*$
                    description: The number of paid credits used for recurring top-up.
                    example: '20.0'
                  granted_credits:
                    type:
                    - string
                    - 'null'
                    pattern: ^[0-9]+.?[0-9]*$
                    description: The number of free granted credits used for recurring top-up.
                    example: '10.0'
                  grants_target_top_up:
                    type:
                    - boolean
                    - 'null'
                    description: Applies only to `target` rules. When `true`, the recurring top-up grants free credits to reach the target ongoing balance instead of creating a paid top-up (and bypasses the paid top-up minimum). When `false`, the gap is filled with a paid top-up. `null` for `fixed` rules. Defaults to `false` for target rules when omitted.
                    example: false
                  method:
                    type: string
                    enum:
                    - fixed
                    - target
                    description: The method used for recurring top-up. Possible values are `fixed` or `target`.
                    example: target
                  trigger:
                    type: string
                    enum:
                    - interval
                    - threshold
                    description: The trigger. Possible values are `interval` or `threshold`.
                    example: interval
                  interval:
                    type: string
                    enum:
                    - weekly
                    - monthly
                    - quarterly
                    - semiannual
                    - yearly
                    description: 'The interval used for recurring top-up. It represents the frequency at which automatic top-up occurs. The interval can be one of the following values: `weekly`, `monthly`, `quarterly`, `semiannual` or `yearly`. Required only when trigger is `interval`.'
                    example: monthly
                  started_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    example: '2022-08-08T00:00:00Z'
                    description: The effective start date for recurring top-ups. This date should be provided in ISO 8601 datetime format and expressed in Coordinated Universal Time (UTC).
                  expiration_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                    description: The expiration date and time for this specific recurring transaction rule. It follows the ISO 8601 datetime format and is expressed in Coordinated Universal Time (UTC).
                    example: '2023-09-30T23:59:59Z'
                  threshold_credits:
                    type: string
                    pattern: ^[0-9]+.?[0-9]*$
                    description: The threshold for recurring top-ups is the value at which an automatic top-up is triggered. For example, if this threshold is set at 10 credits, an automatic top-up will occur whenever the wallet balance falls to or below 10 credits. Required only when trigger is set to `threshold`.
                    example: '20.0'
                  target_ongoing_balance:
                    type: string
                    pattern: ^[0-9]+.?[0-9]*$
                    description: The target ongoing balance is the value set for the ongoing balance to be reached by the automatic top-up. Required only when trigger is set to `target`.
                    example: '200.0'
                  invoice_requires_successful_payment:
                    type: boolean
                    description: A boolean setting that, when set to true, delays issuing an invoice for a wallet top-up until a successful payment is made; if false, the invoice is issued immediately upon wallet top-up, regardless of the payment status. Default value of false.
                    example: false
                  transaction_metadata:
                    type: array
                    description: This optional field allows you to store a list of key-value pairs containing additional information or custom attributes. These key-value pairs will populate the metadata of the wallet transactions triggered by this rule.
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: The unique identifier for the attribute.
                        value:
                          type: string
                          description: The value associated with the key.
                    example:
                    - key: example_key
                      value: example_value
                    - key: another_key
                      value: another_value
                  transaction_name:
                    type:
                    - string
                    - 'null'
                    description: The name of the wallet transactions triggered by this rule. It will appear on the invoice as the label for the fee. If not set, the label on the invoice will fallback to either `Prepaid credits - {{wallet_name}}` if the wallet name is set, or `Prepaid credits`.
                    example: Tokens for models 'high-fidelity-boost'
                  purchase_order_number:
                    type:
                    - string
                    - 'null'
                    example: PO-123
                    description: The purchase order number associated with this recurring transaction rule. It will be added to invoices generated for the resulting wallet top-ups. If not set, falls back to the wallet's `purchase_order_number`.
                  ignore_paid_top_up_limits:
                    type: boolean
                    description: When true, this rule can top up the wallet with transactions that exceed the paid top-up limits. Defaults to false.
                    example: false
                  invoice_custom_section:
                    $ref: '#/components/schemas/InvoiceCustomSectionInput'
                  payment_method:
                    $ref: '#/components/schemas/PaymentMethodReference'
                    description: Optional payment method to use for processing recurring top-up payments.
            payment_method:
              $ref: '#/components/schemas/PaymentMethodReference'
              description: Optional payment method to use for processing wallet top-up payments.
            metadata:
              $ref: '#/components/schemas/MetadataInput'
    WalletsPaginated:
      type: object
      required:
      - wallets
      - meta
      properties:
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/WalletObject'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
  parameters:
    currency:
      name: currency
      in: query
      description: Filter the results by currency, expressed as an ISO 4217 code.
      required: false
      explode: true
      schema:
        type: string
        example: EUR
    external_customer_id_path:
      name: external_customer_id
      in: path
      description: The customer external unique identifier (provided by your own application)
      required: true
      schema:
        type: string
        example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
    page:
      name: page
      in: query
      description: Page number.
      required: false
      explode: true
      schema:
        type: integer
        example: 1
    per_page:
      name: per_page
      in: query
      description: Number of records per page.
      required: false
      explode: true
      schema:
        type: integer
        example: 20
    wallet_code:
      name: wallet_code
      in: path
      description: A unique wallet identifier within a customer. It is either set by the user at creation or auto-generated by Lago if not provided.
      required: true
      schema:
        type: string
        example: wallet-code
  responses:
    BadRequest:
      description: Bad Request error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorBadRequest'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorForbidden'
    UnprocessableEntity:
      description: Unprocessable entity error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorUnprocessableEntity'
    NotFound:
      description: Not Found error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorNotFound'
    Unauthorized:
      description: Unauthorized error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorUnauthorized'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
externalDocs:
  description: Lago Github
  url: https://github.com/getlago
