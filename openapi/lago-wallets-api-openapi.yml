openapi: 3.2.0
info:
  title: Lago API documentation Wallets API
  description: Lago API allows your application to push customer information and metrics (events) from your application to the billing application.
  version: 1.55.0
  license:
    name: AGPLv3
    url: https://github.com/getlago/lago-openapi/blob/main/LICENSE
  contact:
    email: tech@getlago.com
servers:
- url: https://api.getlago.com/api/v1
  description: US Lago cluster
- url: https://api.eu.getlago.com/api/v1
  description: EU Lago cluster
security:
- bearerAuth: []
tags:
- name: Wallets
  description: Everything about Wallet collection
  externalDocs:
    description: Find out more
    url: https://getlago.com/docs/api-reference/wallets/wallet-object
paths:
  /customers/{external_customer_id}/wallets:
    parameters:
    - $ref: '#/components/parameters/external_customer_id_path'
    post:
      tags:
      - Wallets
      summary: Create a wallet
      description: This endpoint is used to create a wallet with prepaid credits.
      operationId: createCustomerWallet
      requestBody:
        description: Wallet payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletCreateInput'
        required: true
      responses:
        '200':
          description: Wallet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - Wallets
      summary: List all customer's wallets
      description: This endpoint is used to list all wallets with prepaid credits of a customer.
      operationId: findAllCustomerWallets
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/currency'
      - name: billing_entity_codes[]
        in: query
        description: Filter wallets by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      responses:
        '200':
          description: Wallets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/wallets/{code}:
    parameters:
    - $ref: '#/components/parameters/external_customer_id_path'
    - name: code
      in: path
      description: A unique wallet identifier within a customer. It is either set by the user at creation or auto-generated by Lago if not provided.
      required: true
      schema:
        type: string
        example: wallet-code
    put:
      tags:
      - Wallets
      summary: Update a wallet
      description: This endpoint is used to update an existing wallet with prepaid credits. A terminated wallet cannot be updated and returns a `422` error.
      operationId: updateCustomerWallet
      requestBody:
        description: Wallet update payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletUpdateInput'
        required: true
      responses:
        '200':
          description: Wallet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - Wallets
      summary: Retrieve a wallet
      description: This endpoint is used to retrieve an existing wallet with prepaid credits.
      operationId: findCustomerWallet
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Wallets
      summary: Terminate a wallet
      description: This endpoint is used to terminate an existing wallet with prepaid credits.
      operationId: destroyCustomerWallet
      responses:
        '200':
          description: Wallet terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /customers/{external_customer_id}/wallets/{wallet_code}/metadata:
    parameters:
    - $ref: '#/components/parameters/external_customer_id_path'
    - $ref: '#/components/parameters/wallet_code'
    post:
      tags:
      - Wallets
      summary: Replace wallet metadata
      description: 'This endpoint replaces all existing metadata on a wallet with the provided key-value pairs.

        Any existing metadata keys not included in the request will be removed.'
      operationId: replaceCustomerWalletMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletMetadataResponse'
      responses:
        '200':
          description: Wallet metadata replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags:
      - Wallets
      summary: Merge wallet metadata
      description: 'This endpoint merges the provided metadata with existing metadata on the wallet.

        Existing keys not in the request are preserved. New keys are added, existing keys are updated.'
      operationId: mergeCustomerWalletMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletMetadataResponse'
      responses:
        '200':
          description: Wallet metadata merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - Wallets
      summary: Delete all wallet metadata
      description: This endpoint removes all metadata from a wallet.
      operationId: deleteAllCustomerWalletMetadata
      responses:
        '200':
          description: Wallet metadata deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/wallets/{wallet_code}/metadata/{key}:
    parameters:
    - $ref: '#/components/parameters/external_customer_id_path'
    - $ref: '#/components/parameters/wallet_code'
    delete:
      tags:
      - Wallets
      summary: Delete a metadata key
      description: This endpoint removes a single metadata key from a wallet.
      parameters:
      - name: key
        in: path
        description: The metadata key to delete.
        required: true
        schema:
          type: string
          example: external_id
      operationId: deleteCustomerWalletMetadataKey
      responses:
        '200':
          description: Metadata key deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/wallets/{wallet_code}/alerts:
    parameters:
    - $ref: '#/components/parameters/external_customer_id_path'
    - $ref: '#/components/parameters/wallet_code'
    get:
      tags:
      - Wallets
      summary: List wallet alerts
      description: This endpoint enables the retrieval of all alerts for a wallet.
      operationId: getCustomerWalletAlerts
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Wallet alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAlerts'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Wallets
      summary: Create wallet alert(s)
      description: This endpoint allows you to create new alerts for a wallet. Send a single alert object wrapped in `alert` key to create one alert, or an array of alert objects wrapped in `alerts` key to create multiple alerts atomically.
      operationId: createCustomerWalletAlert
      requestBody:
        description: Create a new alert for a wallet
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/WalletAlertCreateInput'
              - $ref: '#/components/schemas/WalletAlertBatchCreateInput'
        required: true
      responses:
        '200':
          description: Wallet alert(s) created
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/WalletAlert'
                - $ref: '#/components/schemas/WalletAlerts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - Wallets
      summary: Delete all wallet alerts
      description: This endpoint allows you to delete all alerts for a wallet.
      operationId: deleteAllCustomerWalletAlerts
      responses:
        '200':
          description: All wallet alerts deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{external_customer_id}/wallets/{wallet_code}/alerts/{code}:
    parameters:
    - $ref: '#/components/parameters/external_customer_id_path'
    - $ref: '#/components/parameters/wallet_code'
    - name: code
      in: path
      description: Unique code of the alert
      required: true
      schema:
        type: string
        example: balance_threshold_alert
    get:
      tags:
      - Wallets
      summary: Retrieve a wallet alert
      description: This endpoint enables the retrieval of a specific alert for a wallet.
      operationId: getCustomerWalletAlert
      responses:
        '200':
          description: Wallet alert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAlert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Wallets
      summary: Update a wallet alert
      description: This endpoint allows you to update an existing alert for a wallet.
      operationId: updateCustomerWalletAlert
      requestBody:
        description: Update an existing alert for a wallet
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletAlertUpdateInput'
        required: true
      responses:
        '200':
          description: Wallet alert updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAlert'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - Wallets
      summary: Delete a wallet alert
      description: This endpoint allows you to delete an existing alert for a wallet.
      operationId: deleteCustomerWalletAlert
      responses:
        '200':
          description: Wallet alert deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletAlert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallets:
    post:
      tags:
      - Wallets
      summary: Create a wallet
      description: This endpoint is used to create a wallet with prepaid credits.
      operationId: createWallet
      requestBody:
        description: Wallet payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletCreateInput'
        required: true
      responses:
        '200':
          description: Wallet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - Wallets
      summary: List all wallets
      description: This endpoint is used to list all wallets with prepaid credits.
      operationId: findAllWallets
      parameters:
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - $ref: '#/components/parameters/currency'
      - name: external_customer_id
        in: query
        description: Filter wallets by customer external unique identifier (provided by your own application). When omitted, all wallets for the organization are returned.
        required: false
        explode: true
        schema:
          type: string
          example: 5eb02857-a71e-4ea2-bcf9-57d3a41bc6ba
      - name: billing_entity_codes[]
        in: query
        description: Filter wallets by billing entity codes.
        required: false
        explode: true
        schema:
          type: array
          items:
            type: string
          example:
          - billing_entity_code_1
          - billing_entity_code_2
      responses:
        '200':
          description: Wallets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallets/{lago_id}:
    parameters:
    - name: lago_id
      in: path
      description: Unique identifier assigned to the wallet within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the wallet's record within the Lago system.
      required: true
      schema:
        type: string
        format: uuid
        example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    put:
      tags:
      - Wallets
      summary: Update a wallet
      description: This endpoint is used to update an existing wallet with prepaid credits. A terminated wallet cannot be updated and returns a `422` error.
      operationId: updateWallet
      requestBody:
        description: Wallet update payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletUpdateInput'
        required: true
      responses:
        '200':
          description: Wallet updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags:
      - Wallets
      summary: Retrieve a wallet
      description: This endpoint is used to retrieve an existing wallet with prepaid credits.
      operationId: findWallet
      responses:
        '200':
          description: Wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Wallets
      summary: Terminate a wallet
      description: This endpoint is used to terminate an existing wallet with prepaid credits.
      operationId: destroyWallet
      responses:
        '200':
          description: Wallet terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /wallets/{lago_id}/metadata:
    post:
      tags:
      - Wallets
      summary: Replace wallet metadata
      description: 'This endpoint replaces all existing metadata on a wallet with the provided key-value pairs.

        Any existing metadata keys not included in the request will be removed.'
      parameters:
      - name: lago_id
        in: path
        description: Unique identifier assigned to the wallet within the Lago application.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      operationId: replaceWalletMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletMetadataResponse'
      responses:
        '200':
          description: Wallet metadata replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    patch:
      tags:
      - Wallets
      summary: Merge wallet metadata
      description: 'This endpoint merges the provided metadata with existing metadata on the wallet.

        Existing keys not in the request are preserved. New keys are added, existing keys are updated.'
      parameters:
      - name: lago_id
        in: path
        description: Unique identifier assigned to the wallet within the Lago application.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      operationId: mergeWalletMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletMetadataResponse'
      responses:
        '200':
          description: Wallet metadata merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      tags:
      - Wallets
      summary: Delete all wallet metadata
      description: This endpoint removes all metadata from a wallet.
      parameters:
      - name: lago_id
        in: path
        description: Unique identifier assigned to the wallet within the Lago application.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      operationId: deleteAllWalletMetadata
      responses:
        '200':
          description: Wallet metadata deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallets/{lago_id}/metadata/{key}:
    delete:
      tags:
      - Wallets
      summary: Delete a metadata key
      description: This endpoint removes a single metadata key from a wallet.
      parameters:
      - name: lago_id
        in: path
        description: Unique identifier assigned to the wallet within the Lago application.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      - name: key
        in: path
        description: The metadata key to delete.
        required: true
        schema:
          type: string
          example: external_id
      operationId: deleteWalletMetadataKey
      responses:
        '200':
          description: Metadata key deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallet_transactions:
    post:
      tags:
      - Wallets
      summary: Top up a wallet
      description: This endpoint is used to top-up an active wallet.
      operationId: createWalletTransaction
      requestBody:
        description: Wallet transaction payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletTransactionCreateInput'
        required: true
      responses:
        '200':
          description: Wallet transaction created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactions'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /wallet_transactions/{lago_id}:
    parameters:
    - name: lago_id
      in: path
      description: Unique identifier assigned to the wallet transaction within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the wallet transaction's record within the Lago system.
      required: true
      schema:
        type: string
        format: uuid
        example: bb0a27be-51f7-4f4f-aad0-2abc80534c0f
    get:
      tags:
      - Wallets
      summary: Retrieve a wallet transaction
      description: This endpoint is used to retrieve a specific wallet transaction.
      operationId: findWalletTransaction
      responses:
        '200':
          description: Wallet transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /wallet_transactions/{lago_id}/payment_url:
    post:
      tags:
      - Wallets
      summary: Generate a payment URL
      description: This endpoint generates a checkout link for a specific wallet transaction.
      parameters:
      - name: lago_id
        in: path
        description: ID of the wallet transaction.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      operationId: walletTransactionPaymentUrl
      responses:
        '200':
          description: Payment URL has been generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionPaymentUrl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /wallet_transactions/{lago_id}/consumptions:
    get:
      tags:
      - Wallets
      summary: List all consumptions for a wallet transaction
      description: This endpoint is used to list all consumption records for an inbound wallet transaction. It shows how the credits from this inbound transaction were consumed by outbound transactions. Only available for traceable wallets.
      operationId: findAllWalletTransactionConsumptions
      parameters:
      - name: lago_id
        in: path
        description: Unique identifier assigned to the wallet transaction within the Lago application. Must be an inbound wallet transaction.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Wallet transaction consumptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionConsumptionsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /wallet_transactions/{lago_id}/fundings:
    get:
      tags:
      - Wallets
      summary: List all fundings for a wallet transaction
      description: This endpoint is used to list all funding records for an outbound wallet transaction. It shows which inbound transactions funded this outbound transaction. Only available for traceable wallets.
      operationId: findAllWalletTransactionFundings
      parameters:
      - name: lago_id
        in: path
        description: Unique identifier assigned to the wallet transaction within the Lago application. Must be an outbound wallet transaction.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      responses:
        '200':
          description: Wallet transaction fundings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionFundingsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /wallets/{lago_id}/wallet_transactions:
    get:
      tags:
      - Wallets
      summary: List all wallet transactions
      description: This endpoint is used to list all wallet transactions.
      operationId: findAllWalletTransactions
      parameters:
      - name: lago_id
        in: path
        description: Unique identifier assigned to the wallet within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the wallet's record within the Lago system.
        required: true
        schema:
          type: string
          format: uuid
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/per_page'
      - name: status
        in: query
        description: The status of the wallet transaction. Possible values are `pending`, `settled` or `failed`.
        required: false
        explode: true
        schema:
          type: string
          example: pending
      - name: transaction_status
        in: query
        description: The transaction status of the wallet transaction. Possible values are `purchased` (with pending or settled status), `granted` (without invoice_id), `voided` or `invoiced`.
        required: false
        explode: true
        schema:
          type: string
          example: purchased
      - name: transaction_type
        in: query
        description: The transaction type of the wallet transaction. Possible values are `inbound` (increasing the wallet balance) or `outbound` (decreasing the wallet balance).
        required: false
        explode: true
        schema:
          type: string
          example: inbound
      - name: metadata[key]
        in: query
        description: Filter wallet transactions by metadata. Replace `key` with the actual metadata key you want to match, and provide the corresponding value. For example, `metadata[color]=blue`.
        required: false
        explode: true
        schema:
          type: string
          example: someValue
      responses:
        '200':
          description: Wallet transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletTransactionsPaginated'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    AlertThresholdObject:
      allOf:
      - $ref: '#/components/schemas/AlertThresholdBaseObject'
      - type: object
        required:
        - code
        - value
        - recurring
        properties:
          value:
            type: string
            pattern: ^-?[0-9]+(\.[0-9]+)?$
            description: 'A value that should trigger this alert, formatted as a BigDecimal.


              The unit depends on the alert type: `billable_metric_current_usage_units` and `billable_metric_lifetime_usage_units` are expressed in units, `wallet_credits_balance` and `wallet_credits_ongoing_balance` in credits, and all other types in cents.'
            example: '99.0'
    WalletAlerts:
      type: object
      required:
      - alerts
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/WalletAlertObject'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginationMeta:
      type: object
      required:
      - current_page
      - total_pages
      - total_count
      properties:
        current_page:
          type: integer
          description: Current page.
          example: 2
        next_page:
          type:
          - integer
          - 'null'
          description: Next page.
          example: 3
        prev_page:
          type:
          - integer
          - 'null'
          description: Previous page.
          example: 1
        total_pages:
          type: integer
          description: Total number of pages.
          example: 4
        total_count:
          type: integer
          description: Total number of records.
          example: 70
    WalletTransactionCreateInput:
      type: object
      required:
      - wallet_transaction
      properties:
        wallet_transaction:
          type: object
          required:
          - wallet_id
          properties:
            wallet_id:
              type: string
              format: uuid
              description: Unique identifier assigned to the wallet within the Lago application. This ID is exclusively created by Lago and serves as a unique identifier for the wallet's record within the Lago system.
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
            name:
              type:
              - string
              - 'null'
              description: 'The name of the wallet transaction. It will appear on the invoice as the label for the fee. If not set, the label on the invoice will fallback to either `Prepaid credits - {{wallet_name}}` if the wallet name is set, or `Prepaid credits`.


                Note that this name will apply to all transactions (`paid_credits`, `granted_credits` and `voided_credits`) created by this action.

                '
              example: Tokens for models 'high-fidelity-boost'
            paid_credits:
              type:
              - string
              - 'null'
              pattern: ^[0-9]+.?[0-9]*$
              description: The number of paid credits.
              example: '20.0'
            granted_credits:
              type:
              - string
              - 'null'
              pattern: ^[0-9]+.?[0-9]*$
              description: The number of free granted credits.
              example: '10.0'
            voided_credits:
              type:
              - string
              - 'null'
              pattern: ^[0-9]+.?[0-9]*$
              description: The number of voided credits.
              example: '5.0'
            voided_transaction_id:
              type:
              - string
              - 'null'
              format: uuid
              description: Unique identifier of the inbound wallet transaction to void. Only available on traceable wallets, and the target transaction must still have a remaining amount.
              example: 1a901a90-1a90-1a90-1a90-1a901a901a90
            priority:
              type: integer
              minimum: 1
              maximum: 50
              description: 'The priority of the wallet transaction. It drives the order in which credits are consumed. Allowed values: 1-50, where 1 is highest priority and 50 is lowest. Defaults to 50.'
              example: 50
            invoice_requires_successful_payment:
              type: boolean
              description: A boolean setting that, when set to true, delays issuing an invoice for a wallet top-up until a successful payment is made; if false, the invoice is issued immediately upon wallet top-up, regardless of the payment status. Default value of false.
              example: false
            ignore_paid_top_up_limits:
              type: boolean
              description: When true, allows topping up the wallet with transactions that exceed the paid top-up limits. Defaults to false.
              example: false
            purchase_order_number:
              type:
              - string
              - 'null'
              example: PO-123
              description: The purchase order number associated with this wallet transaction. It will be added to invoices generated for the resulting wallet top-up. If not set, falls back to the wallet's `purchase_order_number`.
            invoice_custom_section:
              $ref: '#/components/schemas/InvoiceCustomSectionInput'
            payment_method:
              $ref: '#/components/schemas/PaymentMethodReference'
              description: Optional payment method to use for processing the wallet transaction payment.
            metadata:
              type:
              - array
              - 'null'
              description: This optional field allows you to store a list of key-value pairs that hold additional information or custom attributes related to the data.
              items:
                type: object
                properties:
                  key:
                    type: string
                    description: The unique identifier for the attribute.
                  value:
                    type: string
                    description: The value associated with the key.
              example:
              - key: example key
                value: example value
              - key: another key
                value: another value
    PaymentMethodReference:
      type: object
      description: Reference to a specific payment method for processing the payment.
      properties:
        payment_method_type:
          type: string
          enum:
          - provider
          - manual
          description: The type of payment method to use.
          example: provider
        payment_method_id:
          type: string
          format: uuid
          description: The unique identifier of the payment method (required when using a specific provider payment method).
          example: 1a901a90-1a90-1a90-1a90-1a901a901a90
    WalletTransactionConsumptionsPaginated:
      allOf:
      - $ref: '#/components/schemas/WalletTransactionConsumptions'
      - type: object
        required:
        - meta
        properties:
          meta:
            $ref: '#/components/schemas/PaginationMeta'
    AlertThresholdBaseObject:
      type: object
      properties:
        code:
          type:
          - string
          - 'null'
          description: Code identifying the threshold inside the alert. You set it when you create or update the alert.
          example: warn
        recurring:
          type: boolean
          default: false
          description: This field when set to `true` indicates that the alert will be retriggered when this threshold is reached after the last non-recurring threshold. Only one recurring threshold per alert allowed.
          example: false
    WalletAlert:
      type: object
      required:
      - alert
      properties:
        alert:
          $ref: '#/components/schemas/WalletAlertObject'
    InvoiceCustomSectionInput:
      type: object
      description: Configuration for invoice custom sections to apply to invoices generated by this resource.
      properties:
        skip_invoice_custom_sections:
          type: boolean
          example: false
          description: Set to `true` to exclude all invoice custom sections from PDF generation for invoices related to this resource. When `true`, `invoice_custom_section_codes` is ignored.
        invoice_custom_section_codes:
          type: array
          items:
            type: string
          description: List of unique codes identifying the invoice custom sections to apply. These override the default invoice custom sections configured at the customer or billing entity level.
          example:
          - eu_bank_details
    WalletTransactionConsumptions:
      type: object
      required:
